<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>番付バトルシミュレーター2</title>
<style>
:root{
  --bg:#f3eee3;--panel:#fffdf8;--ink:#201c17;--dim:#7a7064;--line:#ddd3c1;--accent:#b3261e;--accent2:#8a6a1f;
  --good:#1d7a46;--bad:#a33;--bar:#2f9e5a;--barmid:#d9a21b;--barlow:#c4372b;--chip:#efe7d6;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","BIZ UDMincho",serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#181613;--panel:#222019;--ink:#efe9dc;--dim:#a39a89;--line:#3a352b;--accent:#ee6b60;--accent2:#d8b25a;
  --good:#58c487;--bad:#ee7b7b;--chip:#2f2b22;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--mincho);margin:0}
h3{font-size:15px;margin:18px 0 8px;border-left:4px solid var(--accent);padding-left:8px}
button,select,input{font:inherit;color:inherit}
button,.btn{padding:7px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;display:inline-block}
button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
select,input[type=search],input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
input[type=search],input[type=text]{width:100%}
.dim{color:var(--dim)} small{font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px 40px}

/* ヘッダ */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--accent);padding:8px 0;
  padding-top:max(8px,env(safe-area-inset-top,0px))}
.top .in{max-width:1180px;margin:0 auto;padding:0 12px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px;letter-spacing:.08em}
.brand small{color:var(--dim)}
.status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.status div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:0}
.status small{display:block;color:var(--dim)}
.status b{display:block;font-family:var(--mincho);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl .grow{flex:1}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.modes label{padding:6px 10px;cursor:pointer}
.modes input{display:none}
.modes label:has(input:checked){background:var(--accent);color:#fff}
#speedBox{display:inline-flex;align-items:center;gap:4px}
#speed{width:80px}

/* バトルステージ(前作のUIをベースに刷新) */
.stage{margin:14px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stagehead h2{font-size:16px}
.duel{position:relative;border-radius:12px;overflow:hidden;padding:12px 10px 12px;color:#fff;
  background:var(--stage-bg,linear-gradient(180deg,#7ea6ee 0%,#a9c6f4 52%,#c9d6e6 100%));background-size:cover;background-position:center}
.arena{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);gap:10px;align-items:start}
.side{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0;max-width:360px;width:100%;cursor:pointer;transition:opacity .25s}
#sideR{margin-left:auto}
.who{display:flex;align-items:baseline;justify-content:center;gap:4px;flex-wrap:wrap;background:rgba(12,24,60,.5);border-radius:8px;padding:3px 8px;text-align:center}
.who .rk{font-size:13px;font-weight:800;color:color-mix(in srgb,var(--dc,#ccc) 45%,#fff)}
.who .nm{font-size:clamp(16px,2.6vw,22px);font-weight:800;overflow-wrap:anywhere;text-shadow:0 1px 3px #0008}
.who .mv{font-size:15px;font-weight:900;color:#5dff9a}.who .mv.dn{color:#ff8a80}
.cond{text-align:center;font-size:12px;text-shadow:0 1px 3px #000a}
.cond[data-c="1.2"]{color:#ffe27a;font-weight:700}.cond[data-c="0.8"]{color:#ffb4ab}
.hpt{text-align:center;font-weight:800;font-size:clamp(13px,2.2vw,18px);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000a}
.bar{height:18px;background:rgba(18,18,22,.88);border-radius:99px;overflow:hidden;border:2px solid #111}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(180deg,#9bff5a,#5fd23a);transition:width .25s}
.bar i[data-lv=mid]{background:linear-gradient(180deg,#ffd35a,#d9a21b)} .bar i[data-lv=lo]{background:linear-gradient(180deg,#ff6a5a,#c4372b)}
.portrait{position:relative;width:100%;aspect-ratio:1/1;border:6px solid var(--fr,#efe2c2);background:#1b1b22;border-radius:3px;box-shadow:0 3px 10px #0004}
.portrait[data-tier=top]{--fr:#f5c542}.portrait[data-tier=sen]{--fr:#9db8ee}.portrait[data-tier=toshi]{--fr:#79d3cf}
.portrait[data-tier=top]::before,.portrait[data-tier=top]::after{content:"✨";position:absolute;top:-17px;font-size:17px;animation:twk 1.6s infinite alternate;pointer-events:none}
.portrait[data-tier=top]::before{left:-8px}.portrait[data-tier=top]::after{right:-8px;animation-delay:.6s}
@keyframes twk{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
.pimg{position:absolute;inset:0;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
.pimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-size:clamp(48px,9vw,96px);font-weight:700;color:#ffffffd0;text-shadow:0 2px 8px #0006}
.vm{position:absolute;top:10%;bottom:10%;width:14px;background:rgba(18,18,22,.78);border:2px solid #111;border-radius:99px;overflow:hidden;transition:opacity .2s}
#sideL .vm{right:6px}#sideR .vm{left:6px}
.vm.off{opacity:.18}
.vm i{position:absolute;left:0;right:0;bottom:0;height:0;background:#3a1cff;transition:height .25s}
.vm i[data-full="1"]{background:#ff9d1c;animation:glow 1s infinite alternate}
.spt{align-self:center;font-size:11px;color:#ffe27a;border:1px solid #ffe27a;border-radius:99px;padding:0 8px;background:rgba(12,24,60,.45)}
.chips{display:flex;gap:2px}
.chips span{flex:1 1 0;min-width:0;height:26px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#454545;border:2px solid #1c1c1c;font-size:min(11px,2.5vw);font-weight:800;color:transparent}
.chips span.w{background:#f8dd55;border-color:#ee9a2c;color:#e98a14}
.chips span.l{background:#8c4fe0;border-color:#5a2ca8;color:#3a1478}
.chips span.now{border-color:#fff;animation:glow .7s infinite alternate}
.side .st{font-size:11px;text-align:center;text-shadow:0 1px 3px #000a}
.side.win .portrait{--fr:#ffd23f;box-shadow:0 0 0 3px #ffd23f66,0 3px 14px #0006}
.side.lose .pimg img,.side.lose .pimg .ph{filter:grayscale(.85) brightness(.75)}
.side.hit{animation:shake .28s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mid{text-align:center;padding-top:6px;text-shadow:0 2px 6px #0007}
#duelBasho{font-size:12px;opacity:.95}
#duelDay{font-size:clamp(26px,5vw,42px);font-weight:900;line-height:1.1;font-family:var(--mincho)}
#duelSub{font-size:11px;opacity:.9}
.mid .vs{font-family:var(--mincho);font-size:24px;color:#ffe27a;font-weight:800;margin-top:10px}
.mid .turn{font-size:12px} .mid .res{font-size:12px;font-weight:700;margin-top:4px}
.pop{position:absolute;right:8px;top:6px;font-weight:800;font-size:18px;pointer-events:none;animation:up .9s forwards;z-index:3;text-shadow:0 1px 3px #000c}
.pop.ph{color:#ff5a4d} .pop.pc{color:#ffb020;font-size:26px} .pop.pm{color:#e6e6e6;font-size:15px}
.pop.pcrit,.pop.pspec{left:0;right:0;top:auto;bottom:8px;text-align:center;font-size:clamp(20px,4.6vw,40px);font-weight:900;font-style:italic;
  color:transparent;background:linear-gradient(90deg,#ff3b3b,#c030d0);-webkit-background-clip:text;background-clip:text;text-shadow:none;-webkit-text-stroke:1.5px #fff;filter:drop-shadow(0 1px 2px #000c);animation-duration:1.1s}
.pop.pspec{background:linear-gradient(90deg,#ffd23f,#ff7a1c)}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
.gameset{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;
  padding:10px 14px;background:rgba(24,36,232,.93);cursor:pointer;animation:gsin .35s}
@keyframes gsin{from{opacity:0;transform:translateY(-50%) scaleY(.2)}to{opacity:1;transform:translateY(-50%) scaleY(1)}}
.gsn{text-align:center;min-width:0}
.gsn .n{font-size:clamp(13px,2.6vw,24px);font-weight:800;overflow-wrap:anywhere}
.gsn .r{font-size:clamp(20px,5vw,44px);font-weight:900;line-height:1.1}
.gsn.w{color:#ff4a3a}.gsn.l{color:#c8c8c8}
.gst{font-size:clamp(26px,6vw,56px);font-weight:900;line-height:.95;text-align:center;color:#6bff3a;text-shadow:0 2px 0 #0a6a00,0 0 12px #0008}
.feed{margin-top:10px;height:116px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
.feed .crit{color:#e08a00;font-weight:700} .feed .miss{color:var(--dim)}
.idle .arena{opacity:.45}
.pfimg{display:block;width:100%;max-width:220px;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin:8px auto;border:3px solid var(--line)}

/* タブ */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-top:6px}
.tabs button{border-radius:8px 8px 0 0;border-bottom:none;background:transparent}
.tabs button.on{background:var(--panel);border-color:var(--accent);color:var(--accent);font-weight:700}
.pane{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:12px;min-height:240px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

.mlist{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.m{display:grid;grid-template-columns:62px 1fr 22px 20px 22px 1fr 62px;gap:4px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--line);font-size:13px}
.mlist>.m:last-child{border-bottom:none}
.m .r{font-size:11px;color:var(--dim)} .m .r:last-child{text-align:right}
.m a.nl:last-of-type{text-align:right}
.m i{font-style:normal;color:var(--dim);font-size:11px;text-align:center}
.m b{text-align:center}.m b.w{color:var(--good)}.m b.x{color:var(--dim)}
.m.cur{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:2px solid var(--accent);outline-offset:-2px}
/* 検索タブ用: 行が1要素のとき */
#tab_search .m{grid-template-columns:70px 1fr auto}
a.nl{color:inherit;cursor:pointer;text-decoration:underline dotted var(--dim);text-underline-offset:3px;overflow-wrap:anywhere}
a.nl:hover{color:var(--accent)}

.tbl{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tbl.small{max-height:220px;margin:8px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td:nth-child(3){white-space:normal}
th{position:sticky;top:0;background:var(--chip);font-size:12px}
.up{color:var(--good)} .dn{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.card small{display:block} .card b{font-family:var(--mincho);font-size:16px;display:block}
.chg{margin:0;padding-left:20px;font-size:13px}
ol.rk{margin:0;padding-left:22px}
.logbox{max-height:520px;overflow:auto;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.logbox div{padding:1px 0;border-bottom:1px dashed var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:99px;padding:3px 6px 3px 10px;display:inline-flex;gap:4px;align-items:center}
.chip button{padding:0 6px;border-radius:99px;border:none;background:transparent}
.set{margin:10px 0}.set.btns{display:flex;gap:8px;flex-wrap:wrap}
.memo{font-size:13px;color:var(--dim);padding-left:20px}

dialog{border:1px solid var(--accent);border-radius:14px;background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 24px);padding:16px}
dialog::backdrop{background:#0008}
dialog h2{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stats small{display:block;color:var(--dim)} .stats b{font-size:16px}
.sb{display:block;height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:3px}
.sb i{display:block;height:100%;background:var(--accent2)}
code{font-size:11px;word-break:break-all}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}


/* メーター・特殊能力 */
.mt{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--dim)}
.mbar{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.mbar i{display:block;height:100%;width:0;background:#4a7fd1;transition:width .25s}
.mbar i[data-full="1"]{background:#e08a00;animation:glow 1s infinite alternate}
@keyframes glow{from{opacity:.65}to{opacity:1}}
.spt{display:inline-block;margin-top:4px;font-size:11px;color:var(--accent2);border:1px solid var(--accent2);border-radius:99px;padding:0 8px}
.side.cast .portrait{animation:cast .7s}
@keyframes cast{0%{box-shadow:0 0 0 0 #e08a0099}60%{box-shadow:0 0 0 12px #e08a0000}100%{box-shadow:none}}
.pop.ps{color:#ff6a3d;font-size:28px} .pop.pg{color:#6dff9c;font-size:20px} .pop.pf{color:#bcd4ff;font-size:16px}
.feed .trig{color:#e08a00;font-weight:800} .feed .fx{color:#4a7fd1} .feed .spk{color:#c0301f;font-weight:700} .feed .heal{color:var(--good)}
.sp{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.sp ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.sp li.gate{color:var(--accent2)} .sp li.atk{color:#c0301f}
.sp details{margin-top:4px}

@media(max-width:720px){
  .status{grid-template-columns:repeat(3,minmax(0,1fr))}
  .arena{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;order:-1;padding:0;display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:center;align-items:baseline}.mid .vs{margin-top:0;font-size:18px}.vm{width:11px}
  .who{min-height:50px;align-content:center}
  .chips span{height:24px}.chips span.w,.chips span.l{font-size:0}.chips span.w::after,.chips span.l::after{content:attr(data-s);font-size:12px}
  .m{grid-template-columns:1fr 20px 18px 20px 1fr}.m .r{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><h1>番付バトルシミュレーター2</h1><small>観戦型・後継作</small></div>
  <div class="status">
    <div><small>場所</small><b id="stNo">-</b></div>
    <div><small>開催地</small><b id="stPlace">-</b></div>
    <div><small>日程</small><b id="stDay">-</b></div>
    <div><small>残り取組</small><b id="stLeft">-</b></div>
    <div><small>総合優勝</small><b id="stChamp">-</b></div>
  </div>
  <div class="ctl">
    <button class="primary" id="bOne">▶ 次の1番</button>
    <button id="bDay">今日を進める</button>
    <button id="bBasho">場所を最後まで</button>
    <button id="bAuto">▶ 自動で進める</button>
    <button class="danger" id="bStop" hidden>■ 停止</button>
    <button class="primary" id="bNext" hidden>次の場所へ ▶</button>
    <button id="bUpd" title="スプレッドシートから最新のキャラクターデータを取得">⟳ データ更新</button>
    <span class="grow"></span>
    <div class="modes" title="戦闘の見せ方">
      <label><input type="radio" name="mode" value="fast">高速</label>
      <label><input type="radio" name="mode" value="anim">観戦</label>
    </div>
    <span id="speedBox">速さ<input type="range" id="speed" min="1" max="5" step="1" value="3"></span>
  </div>
</div></header>

<main class="wrap">
  <section class="stage" id="stageBody">
    <div class="stagehead"><h2>本日の一番</h2><span><small class="dim" id="stNext"></small> <button id="bSkip">スキップ</button></span></div>
    <div class="duel" id="duel">
      <div class="arena">
        <div class="side" id="sideL"></div>
        <div class="mid"><div id="duelBasho"></div><div id="duelDay"></div><div id="duelSub"></div><div class="vs">VS</div><div class="turn" id="turn"></div><div class="res" id="res"></div></div>
        <div class="side" id="sideR"></div>
      </div>
      <div class="gameset" id="gameset" hidden></div>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <nav class="tabs">
    <button data-tab="matches">取組</button>
    <button data-tab="banzuke">番付</button>
    <button data-tab="standings">成績</button>
    <button data-tab="titles">優勝</button>
    <button data-tab="search">検索・観戦</button>
    <button data-tab="duel">練習戦</button>
    <button data-tab="log">ログ</button>
    <button data-tab="settings">設定</button>
  </nav>
  <div class="pane" id="tab_matches"></div>
  <div class="pane" id="tab_banzuke" hidden></div>
  <div class="pane" id="tab_standings" hidden></div>
  <div class="pane" id="tab_titles" hidden></div>
  <div class="pane" id="tab_search" hidden></div>
  <div class="pane" id="tab_duel" hidden></div>
  <div class="pane" id="tab_log" hidden></div>
  <div class="pane" id="tab_settings" hidden></div>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

/* 画像URL: GitHubの表示ページ(.../blob/main/xxx.png)は画像ファイルではないので、直接読み込める raw 形式に変換する */
function imgUrl(u){
  u=norm(String(u==null?'':u).trim());
  if(!u)return '';
  const m=u.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/(?:blob|raw)\/(.+)$/);
  if(m)return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
  return /^https?:\/\//.test(u)?u:'';
}

function mkPerson(r){
  return {id:r[0],name:r[1],hp:r[2],pw:r[3],gd:r[4],iq:r[5],ab:r[6],rk:r[7],
    fav:norm(r[8]),bad:norm(r[9]),inc:r[10],cmd:r[11]||'',pre:!!r[12],com:r[13]||0,gaku:r[14]||0,img:imgUrl(r[15]),
    div:'',slot:0,pk:0,w:0,l:0,met:[],res:[],rec:[],titles:[],tsuna:false,demoted:false};
}
function initPeople(rows){
  rows=rows||DATA;
  S.people=rows.map(mkPerson);
  S.byId=new Map(S.people.map(p=>[p.id,p]));
  S.retired={};
  const rest=[];
  for(const p of S.people){
    if(p.pre){p.div='前相撲';p.slot=9999;}
    else if(p.rk>=1&&p.rk<=4){p.div=TOP_NAMES[p.rk];p.slot=p.rk;}
    else rest.push(p);
  }
  rest.sort((a,b)=>a.rk-b.rk||b.ab-a.ab||a.id-b.id);
  layout(rest);
  S.people.forEach(p=>p.pk=p.slot);
  S.history=[];S.logs=[];
  startBasho(1);
}

  layout(list,'上等兵');
  S.people.forEach(p=>p.pk=p.slot);
  S.history=[];S.logs=[];
  startBasho(1);
  L(`番付・記録をリセット: ${list.length}人を能力評価値順に上等兵1から配置`);
}
function nameKey(s){return String(s).replace(/[\s\u3000]/g,'');}
function pname(id){const p=S.byId.get(id);return p?p.name:(S.retired[id]||'(不明)');}
/* キャラクターデータの更新を進行中のゲームへ反映する(場所の合間のみ呼ぶこと)。
   rows: [id,名前,体力,パワー,ガード,IQ,能力評価値,初期番付,得意,苦手,収入,特殊能力,前相撲] */
function applyRoster(rows){
  const B=S.basho;
  const byKey=new Map(S.people.map(p=>[nameKey(p.name),p]));
  const keep=new Set(),added=[],removed=[];
  for(const r of rows){
    const p=byKey.get(nameKey(r[1]));
    if(p){
      keep.add(p);
      p.name=r[1];p.hp=r[2];p.pw=r[3];p.gd=r[4];p.iq=r[5];p.ab=r[6];
      p.fav=norm(r[8]);p.bad=norm(r[9]);p.inc=r[10];p.cmd=r[11]||'';p.com=r[13]||0;p.gaku=r[14]||0;p.img=imgUrl(r[15]);
    }else{
      const np=mkPerson(r);
      np.div='前相撲';np.slot=9999;np.pre=true;np.pk=9999;
      S.people.push(np);keep.add(np);added.push(np);
    }
  }
  for(const p of S.people)if(!keep.has(p)){removed.push(p);S.retired[p.id]=p.name;}
  S.people=S.people.filter(p=>keep.has(p));
  S.byId=new Map(S.people.map(p=>[p.id,p]));
  // 空いた枠を詰めて番付を再配置(大将〜旗頭と前相撲は据え置き)
  const nonTop=S.people.filter(p=>!p.pre&&!TOP_DIVS.includes(p.div));
  layout(sortRank(nonTop));
  S.people.forEach(p=>{p.pk=rankSortKey(p);});
  // 表示中の取組から、いなくなった人を外す
  B.matches=B.matches.filter(m=>S.byId.has(m.a.id)&&S.byId.has(m.b.id));
  if(B.mi>B.matches.length)B.mi=B.matches.length;
  B.byes=B.byes.filter(p=>S.byId.has(p.id));
  L(`キャラデータ更新: 追加${added.length}人 / 整理${removed.length}人 / 現在${S.people.length}人`);
  return {added,removed};
}

/* 並び順(良い順)から番付枠へ流し込む。1枚につき2人(東西) */
function layout(list,fromDiv){
  let idx=0;
  const fi=fromDiv?LAYOUT.findIndex(x=>x[0]===fromDiv):0;
  for(const [name,start,cap] of LAYOUT.slice(Math.max(0,fi))){
    for(let k=0;k<cap&&idx<list.length;k++,idx++){
      const p=list[idx];p.div=name;p.slot=start+Math.floor(k/2);p.pre=false;p.demoted=false;
    }
  }
  const rest=list.slice(idx),n=rest.length;
  let third=Math.min(THIRD_COUNT,n);
  if((n-third)%2)third++;
  third=Math.min(third,n);
  S.thirdStart=LOW_START+Math.floor((n-third)/2);
  rest.forEach((p,k)=>{
    p.slot=LOW_START+Math.floor(k/2);
    p.div=k<n-third?'二等兵':'三等兵';
    p.pre=false;p.demoted=false;
  });
  S.maxSlot=LOW_START+Math.ceil(n/2);
}
function slotBase(div){
  if(div==='二等兵')return LOW_START-1;
  if(div==='三等兵')return S.thirdStart-1;
  const e=LAYOUT.find(x=>x[0]===div);return e?e[1]-1:0;
}
function rankLabel(p){
  if(p.div==='前相撲')return '前相撲';
  if(TOP_DIVS.includes(p.div))return p.div;
  return p.div+(p.slot-slotBase(p.div));
}
function groupIndex(p){return GROUPS.findIndex(g=>g.divs.includes(p.div));}
function rankSortKey(p){return p.div==='前相撲'?99999:p.slot;}

/* ---------- 場所の進行 ---------- */
function startBasho(no){
  S.people.forEach(p=>{p.w=0;p.l=0;p.met=[];p.res=[];});
  S.basho={no,place:PLACES[(no-1)%PLACES.length],day:0,matches:[],mi:0,phase:'ready',
    titles:null,playoffs:[],byes:[]};
}
function maxDays(){return 7;}
function met(a,b){return a.met.includes(b.id);}
function ordKey(p){return rankSortKey(p)*10000-p.ab;}   // 小さいほど上位
function sortRank(list){return list.slice().sort((a,b)=>ordKey(a)-ordKey(b)||a.id-b.id);}

/* =====================================================================
   取組編成エンジン(取組編成ロジック仕様表 v1.1 準拠)
   処理の流れ(仕様書§21):
     出場者取得 → 固定対戦(7日目) → ハード禁止判定 isMatchAllowed
     → 解禁抽選 → rank_fit/record_fit → 重要対戦ボーナス・再戦ペナルティ
     → 全体マッチング(個別に最善手を選ばず、ペア全体の合計点を最大化)
   ===================================================================== */
const MM={
  // 基本ウェイト [番付適合度, 成績適合度] ×日数(仕様書§6)。キーはClass(1:大将 2:副将・先鋒・旗頭 3:戦士 4:闘士 5:上等兵以下)
  W:{
    1:[[90,10],[85,15],[80,20],[70,30],[55,45],[35,65],[20,80]],
    2:[[85,15],[80,20],[75,25],[65,35],[50,50],[35,65],[20,80]],
    3:[[65,35],[60,40],[55,45],[50,50],[45,55],[30,70],[20,80]],
    4:[[55,45],[50,50],[45,55],[40,60],[30,70],[20,80],[10,90]],
    5:[[60,40],[50,50],[40,60],[25,75],[10,90]]
  },
  REC_FIT:[100,75,45,20,5],                                   // 勝ち数差0,1,2,3,4以上(§8)
  RANK_FIT:[[2,100],[5,90],[10,75],[20,55],[30,35],[50,20]],  // 番付距離の上限→適合度。51以上は5(§9)
  ADJ:70, FAR:25,                                             // 隣接クラス / 2クラス以上離れ(§10)
  // 重要対戦ボーナス(§18)。T=大将 F=副将 S=先鋒
  BONUS:{TT:{5:70,6:90,7:200},TF:{5:50,6:75,7:120},FF:{5:50,6:75,7:110},
         TS:{5:30,6:45,7:70},FS:{5:25,6:40,7:60},SS:{5:20,6:35,7:50}},
  REMATCH1:-1000, REMATCH2:-3000,                             // 再戦ペナルティ(§19)
  NOISE:3,                                                    // ランダム補正 ±3(§23)
  RESTARTS:4,
  DEF:{mmT6:40,mmF5:20,mmF6:50}                               // 解禁確率の初期値(%)(§14,§15)。設定画面で変更可
};
const isTaisho=p=>p.div==='大将';
const isFukusho=p=>p.div==='副将';
const isSenpo=p=>p.div==='先鋒';
const isHatagashira=p=>p.div==='旗頭';
const isSanyakuUp=p=>isTaisho(p)||isFukusho(p)||isSenpo(p);      // 先鋒以上
const isTaishoOrFukusho=p=>isTaisho(p)||isFukusho(p);
function topKind(p){return p.div==='大将'?'T':p.div==='副将'?'F':p.div==='先鋒'?'S':'';}
function mmClass(p){
  switch(p.div){
    case '大将':return 1;
    case '副将':case '先鋒':case '旗頭':return 2;
    case '戦士':return 3;
    case '闘士':return 4;
    default:return 5; // 上等兵・一等兵・二等兵・三等兵・前相撲
  }
}
function mmProb(key){const v=+S.settings[key];return Number.isFinite(v)&&S.settings[key]!==''&&S.settings[key]!=null?Math.max(0,Math.min(100,v)):MM.DEF[key];}
function topPairKey(a,b){
  const ka=topKind(a),kb=topKind(b);if(!ka||!kb)return '';
  const o={T:0,F:1,S:2};return o[ka]<=o[kb]?ka+kb:kb+ka;
}

/* その日・その取組グループの文脈(大将/副将の人数と解禁抽選結果) */
function mmContext(list,day,notes){
  const nT=list.filter(isTaisho).length,nF=list.filter(isFukusho).length;
  const ul={T6:false,F5:false,F6:false,info:[]};
  const lot=(flag,label,key)=>{
    const p=mmProb(key),ok=Math.random()*100<p;ul[flag]=ok;
    const s=`${label} 解禁確率${p}% → ${ok?'解禁':'解禁せず'}`;ul.info.push(s);notes&&notes.push(s);
  };
  if(nT>=3&&day===6)lot('T6','大将3人以上・6日目','mmT6');
  if(nF>=3&&day===5)lot('F5','副将3人以上・5日目','mmF5');
  if(nF>=3&&day===6)lot('F6','副将3人以上・6日目','mmF6');
  return {nT,nF,unlock:ul};
}

/* isMatchAllowed の本体: 許可なら null、禁止なら理由の文字列を返す(§12〜§16,§25) */
function mmHard(a,b,day,ctx){
  const k=topPairKey(a,b);if(!k)return null;            // 先鋒以上同士でなければ制限なし
  if(day<=3)return '先鋒以上同士は1〜3日目禁止';
  if(k==='TT'){
    if(ctx.nT===2)return day===7?null:'大将2人: 大将同士は7日目に固定(温存)';
    if(day<=5)return `大将${ctx.nT}人: 大将同士は1〜5日目禁止`;
    if(day===6)return ctx.unlock.T6?null:`大将${ctx.nT}人: 6日目の解禁抽選に外れ`;
    return null;
  }
  if(k==='FF'){
    if(ctx.nF===2)return day===7?null:'副将2人: 副将同士は7日目に固定(温存)';
    if(day<=4)return `副将${ctx.nF}人: 副将同士は1〜4日目禁止`;
    if(day===5)return ctx.unlock.F5?null:`副将${ctx.nF}人: 5日目の解禁抽選に外れ`;
    if(day===6)return ctx.unlock.F6?null:`副将${ctx.nF}人: 6日目の解禁抽選に外れ`;
    return null;
  }
  if(k==='TF')return day<=4?'大将↔副将は1〜4日目禁止':null;
  return null;                                           // 大将/副将/先鋒↔先鋒は4日目から解禁
}
function isMatchAllowed(a,b,day,ctx){return mmHard(a,b,day,ctx)===null;}

/* 通常スコア(§7〜§10,§18,§19)。禁止判定は呼び出し側で先に行うこと */
function mmEval(a,b,day,ctx){
  const ca=mmClass(a),cb=mmClass(b);
  let rf,dist=null;
  if(ca!==cb)rf=Math.abs(ca-cb)===1?MM.ADJ:MM.FAR;
  else{dist=Math.abs(a.slot-b.slot);rf=5;for(const [mx,v] of MM.RANK_FIT)if(dist<=mx){rf=v;break;}}
  const diff=Math.abs(a.w-b.w),cf=MM.REC_FIT[Math.min(diff,MM.REC_FIT.length-1)];
  const tbl=MM.W[Math.min(ca,cb)],[rw,cw]=tbl[Math.min(day,tbl.length)-1];   // 上位クラス側の表を使う
  const base=(rf*rw+cf*cw)/100;
  const k=topPairKey(a,b);
  const bonus=(k&&MM.BONUS[k]&&MM.BONUS[k][day])||0;
  const n=a.met.filter(x=>x===b.id).length;
  const rem=n===0?0:n===1?MM.REMATCH1:MM.REMATCH2;
  return {rf,cf,rw,cw,dist,diff,base,bonus,rem,final:base+bonus+rem};
}

/* 7日目の固定・最優先対戦(§14〜§17,§26,§27) */
function mmFixed(list,day,ctx){
  const fx=[];if(day!==7)return fx;
  const T=list.filter(isTaisho),F=list.filter(isFukusho);
  const best=arr=>{
    let r=null;
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      if(mmHard(arr[i],arr[j],day,ctx))continue;
      const e=mmEval(arr[i],arr[j],day,ctx);
      if(!r||e.final>r.e.final)r={a:arr[i],b:arr[j],e};
    }
    return r;
  };
  if(T.length===2)fx.push({a:T[0],b:T[1],tier:0,why:'大将2人 → 7日目の大将同士は固定(Tier0)'});
  else if(T.length>=3){const x=best(T);if(x)fx.push({a:x.a,b:x.b,tier:1,why:`大将${T.length}人 → 7日目の大将同士を最優先で1組確保(Tier1)`});}
  if(F.length===2)fx.push({a:F[0],b:F[1],tier:0,why:'副将2人 → 7日目の副将同士は固定(Tier0)'});
  else if(F.length>=3){const x=best(F);if(x)fx.push({a:x.a,b:x.b,tier:2,why:`副将${F.length}人 → 7日目の副将同士を高優先で1組確保(Tier2)`});}
  return fx;
}

/* 全体マッチング: 重み行列W(null=禁止)から合計点が最大になるペアの組を求める。
   貪欲法(高得点順)で初期解を作り、2組の相手を入れ替える改善(2-opt)で磨く。数回やり直して最良を採用。 */
function mmSolve(n,W){
  let m=0;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(W[i][j]!=null)m++;
  const ci=new Int32Array(m),cj=new Int32Array(m),cs=new Float64Array(m);
  for(let i=0,k=0;i<n;i++)for(let j=i+1;j<n;j++)if(W[i][j]!=null){ci[k]=i;cj[k]=j;cs[k]=W[i][j];k++;}
  const fixLeft=mate=>{
    for(;;){
      const L=[];for(let i=0;i<n;i++)if(mate[i]===-1)L.push(i);
      if(L.length<2)return;
      let best=null;
      const x=L[0];
      for(const y of L){ // 余り同士で組む
        if(y!==x&&W[x][y]!=null&&(!best||W[x][y]>best.s))best={s:W[x][y],t:0,y};
      }
      for(const y of L){ // 既存のペア(u,v)を解いて (x,u)+(y,v) / (x,v)+(y,u) に組み直す
        if(y===x)continue;
        for(let u=0;u<n;u++){
          const v=mate[u];if(v<0||u>v)continue;
          if(W[x][u]!=null&&W[y][v]!=null){const s=W[x][u]+W[y][v]-W[u][v];if(!best||s>best.s)best={s,t:1,y,u,v,o:0};}
          if(W[x][v]!=null&&W[y][u]!=null){const s=W[x][v]+W[y][u]-W[u][v];if(!best||s>best.s)best={s,t:1,y,u,v,o:1};}
        }
      }
      if(!best){mate[x]=-2;continue;}            // どうしても組めない人は一旦保留
      if(best.t===0){mate[x]=best.y;mate[best.y]=x;}
      else{
        const {y,u,v,o}=best;
        if(o===0){mate[x]=u;mate[u]=x;mate[y]=v;mate[v]=y;}
        else{mate[x]=v;mate[v]=x;mate[y]=u;mate[u]=y;}
      }
    }
  };
  const improve=mate=>{
    for(let pass=0,ch=true;ch&&pass<40;pass++){
      ch=false;
      for(let a=0;a<n;a++){
        if(mate[a]<a)continue;                       // 各ペアは小さい番号側からだけ調べる
        for(let c=a+1;c<n;c++){
          const b=mate[a],d=mate[c];
          if(d<c||b===c)continue;                    // d<c は 保留(負)または相方が先に調べた側
          const cur=W[a][b]+W[c][d];let bs=cur,opt=0;
          if(W[a][c]!=null&&W[b][d]!=null){const s=W[a][c]+W[b][d];if(s>bs+1e-9){bs=s;opt=1;}}
          if(W[a][d]!=null&&W[b][c]!=null){const s=W[a][d]+W[b][c];if(s>bs+1e-9){bs=s;opt=2;}}
          if(opt===1){mate[a]=c;mate[c]=a;mate[b]=d;mate[d]=b;ch=true;}
          else if(opt===2){mate[a]=d;mate[d]=a;mate[b]=c;mate[c]=b;ch=true;}
        }
      }
    }
  };
  let bestRes=null;
  for(let r=0;r<MM.RESTARTS;r++){
    const key=new Float64Array(m);
    for(let k=0;k<m;k++)key[k]=cs[k]+(r===0?0:Math.random()*15);
    const order=new Uint32Array(m);for(let k=0;k<m;k++)order[k]=k;
    order.sort((x,y)=>key[y]-key[x]);
    const mate=new Array(n).fill(-1);
    for(let t=0;t<m;t++){const k=order[t],i=ci[k],j=cj[k];if(mate[i]===-1&&mate[j]===-1){mate[i]=j;mate[j]=i;}}
    fixLeft(mate);improve(mate);
    let tot=0,left=0;
    for(let i=0;i<n;i++){if(mate[i]<0)left++;else if(mate[i]>i)tot+=W[i][mate[i]];}
    if(!bestRes||left<bestRes.left||(left===bestRes.left&&tot>bestRes.tot))bestRes={mate:mate.slice(),tot,left};
  }
  const pairs=[],left=[];
  bestRes.mate.forEach((m,i)=>{if(m>i)pairs.push([i,m]);else if(m<0)left.push(i);});
  return {pairs,left};
}

/* 先鋒以上の選手が「誰とは組めなかったか」を理由つきで記録(§28) */
function mmBlocked(p,list,day,ctx){
  const by=new Map();
  for(const o of list){
    if(o===p||!isSanyakuUp(o))continue;
    const why=mmHard(p,o,day,ctx);if(!why)continue;
    if(!by.has(why))by.set(why,[]);by.get(why).push(`${o.name}(${rankLabel(o)})`);
  }
  return [...by].map(([w,ns])=>`${w}:${ns.slice(0,6).join('、')}${ns.length>6?` ほか${ns.length-6}人`:''}`);
}

function mmDbg(a,b,day,ctx,e,tier,fixedWhy,noise,pool){
  const k=topPairKey(a,b);
  const d={day,ra:rankLabel(a),rb:rankLabel(b),wa:a.w,wb:b.w,
    rf:e.rf,cf:e.cf,rw:e.rw,cw:e.cw,dist:e.dist,base:+e.base.toFixed(1),bonus:e.bonus,rem:e.rem,
    noise:+(noise||0).toFixed(1),final:+(e.final+(noise||0)).toFixed(1),
    hard:'OK',tier:tier,fx:fixedWhy||'',ul:ctx.unlock.info.slice()};
  if(isSanyakuUp(a))d.blkA=mmBlocked(a,pool,day,ctx);
  if(isSanyakuUp(b))d.blkB=mmBlocked(b,pool,day,ctx);
  if(k)d.kind=k;
  return d;
}
function mmTier(a,b,day,fixedTier){
  if(fixedTier!=null)return fixedTier;
  const k=topPairKey(a,b);
  if(k==='TT')return 1;
  if(k==='FF')return 2;
  if(k==='TF'&&day>=5)return 3;
  if((k==='TS'||k==='FS'||k==='SS')&&day>=4)return 4;
  return 5;
}

function planDay(day){
  const B=S.basho;B.byes=[];
  const pools=[];
  GROUPS.forEach((g,gi)=>{
    if(day>g.days)return;
    const list=sortRank(S.people.filter(p=>g.divs.includes(p.div)));
    pools.push({g,gi,list});
  });
  // 奇数なら下の階級から1人借りて偶数にする。最後が奇数なら1人は休み
  for(let i=0;i<pools.length;i++){
    if(pools[i].list.length%2){
      if(i+1<pools.length&&pools[i+1].list.length){pools[i].list.push(pools[i+1].list.shift());}
      else{B.byes.push(pools[i].list.pop());}
    }
  }
  const out=[],notes=[];
  for(const {g,gi,list} of pools){
    const ctx=mmContext(list,day,notes);
    const fixed=mmFixed(list,day,ctx);
    const used=new Set();fixed.forEach(f=>{used.add(f.a);used.add(f.b);});
    const rest=list.filter(p=>!used.has(p));
    const n=rest.length;
    const pairs=fixed.map(f=>({a:f.a,b:f.b,fx:f}));
    if(n>=2){
      const W=Array.from({length:n},()=>new Array(n).fill(null));
      const E=Array.from({length:n},()=>new Array(n).fill(null));
      for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
        if(!isMatchAllowed(rest[i],rest[j],day,ctx))continue;       // 禁止はスコア計算の対象にしない(§25)
        const e=mmEval(rest[i],rest[j],day,ctx);
        const nz=(Math.random()*2-1)*MM.NOISE;
        E[i][j]=E[j][i]={e,nz};
        W[i][j]=W[j][i]=e.final+nz;
      }
      const {pairs:ps,left}=mmSolve(n,W);
      ps.forEach(([i,j])=>pairs.push({a:rest[i],b:rest[j],ev:E[i][j]}));
      // 禁止ルールを破らずには組めない人は休みにする(絶対禁止は緩和しない §22)
      left.forEach(i=>{B.byes.push(rest[i]);notes.push(`${rest[i].name}は禁止ルールを破らずに組める相手がなく休み`);});
    }
    for(const pr of pairs){
      let {a,b}=pr;
      let e,nz=0,tier,why='';
      if(pr.fx){e=mmEval(a,b,day,ctx);tier=pr.fx.tier;why=pr.fx.why;notes.push(`${a.name}↔${b.name}: ${why}`);}
      else{e=pr.ev.e;nz=pr.ev.nz;tier=mmTier(a,b,day,null);}
      const dbg=mmDbg(a,b,day,ctx,e,tier,why,nz,list);
      if(ordKey(b)<ordKey(a))[a,b]=[b,a];
      out.push({a,b,gi,w:null,swiss:false,dbg});
    }
    if(g.key==='総合'&&(ctx.nT||ctx.nF)){
      notes.unshift(`大将${ctx.nT}人・副将${ctx.nF}人`);
    }
  }
  // 下位の取組から順に。最後が最上位(結び)
  out.sort((x,y)=>y.gi-x.gi||ordKey(y.a)-ordKey(x.a));
  B.mmNotes=notes;
  return out;
}
function beginDay(){
  const B=S.basho;
  B.day++;B.mi=0;B.phase='days';
  B.matches=planDay(B.day);
  L(`第${B.no}場所 ${B.day}日目:${B.matches.length}番の取組を編成`+((B.mmNotes&&B.mmNotes.length)?`(${B.mmNotes.join(' / ')})`:''));
}

function applyResult(m,res){
  m.w=res.winner===m.a?'A':'B';
  m.turns=res.turns;m.sp=res.sp;m.condA=res.A.c;m.condB=res.B.c;
  m.hpA=res.A.hp;m.hpB=res.B.hp;
  const win=res.winner,lose=res.loser;
  win.w++;lose.l++;
  win.met.push(lose.id);lose.met.push(win.id);
  (win.res=win.res||[]).push({o:lose.id,w:1});(lose.res=lose.res||[]).push({o:win.id,w:0});
}
function playNextFast(){
  const B=S.basho;if(B.mi>=B.matches.length)return null;
  const m=B.matches[B.mi++];
  const res=simulate(m.a,m.b,B.place);applyResult(m,res);return {m,res};
}
function dayDone(){return S.basho.mi>=S.basho.matches.length;}
function bashoDaysDone(){return S.basho.day>=maxDays()&&dayDone();}

/* ---------- 優勝・決定戦 ---------- */
function decideTitles(){
  const B=S.basho;B.titles={};B.playoffs=[];
  for(const g of GROUPS){
    const mem=S.people.filter(p=>g.divs.includes(p.div));
    if(!mem.length)continue;
    const mx=Math.max(...mem.map(p=>p.w));
    let cand=mem.filter(p=>p.w===mx);
    const first=cand.slice();
    let round=1;
    while(cand.length>1){
      cand=cand.slice().sort(()=>Math.random()-.5);
      const nxt=[];
      for(let i=0;i<cand.length;i+=2){
        if(i+1>=cand.length){nxt.push(cand[i]);continue;}
        const r=simulate(cand[i],cand[i+1],B.place);
        B.playoffs.push({key:g.key,round,a:cand[i].id,b:cand[i+1].id,win:r.winner.id});
        nxt.push(r.winner);
      }
      cand=nxt;round++;
    }
    const ch=cand[0];
    B.titles[g.key]={id:ch.id,w:ch.w,l:ch.l,playoff:first.length>1,n:first.length};
    ch.titles.push({b:B.no,key:g.key});
    L(`第${B.no}場所 ${g.label}:${ch.name}(${ch.w}勝${ch.l}敗)${first.length>1?' 決定戦':''}`);
  }
  B.phase='titled';
}

/* ---------- 番付編成 ---------- */
function promote(p,div){p.div=div;p.slot=TOP_DIVS.indexOf(div)+1;p.pre=false;p.demoted=false;}
function rebalance(){
  const B=S.basho;
  S.people.forEach(p=>{p.rec.push({b:B.no,div:rankLabel(p),w:p.w,l:p.l});if(p.rec.length>40)p.rec.shift();p.pk=rankSortKey(p);});
  const changes=[];
  const tops=[],movers=[];
  for(const p of S.people){
    const prevW=p.rec.length>1?p.rec[p.rec.length-2].w:0;
    const sum3=p.rec.slice(-3).reduce((s,r)=>s+r.w,0);
    const before=rankLabel(p);
    if(p.div==='大将'){tops.push(p);continue;}
    if(p.div==='副将'){
      if(p.w===7){
        if(p.tsuna){promote(p,'大将');p.tsuna=false;changes.push(`${p.name}:副将→大将(2場所連続7勝)`);}
        else p.tsuna=true;
        tops.push(p);
      }else{
        p.tsuna=false;
        if(p.w>3||prevW>3)tops.push(p);
        else{promote(p,'先鋒');tops.push(p);changes.push(`${p.name}:副将→先鋒`);}
      }
      continue;
    }
    if(p.div==='先鋒'){
      if(sum3>14){promote(p,'副将');changes.push(`${p.name}:先鋒→副将`);tops.push(p);}
      else if(p.w>3)tops.push(p);
      else if(p.w>2){promote(p,'旗頭');tops.push(p);changes.push(`${p.name}:先鋒→旗頭`);}
      else{p.demoted=true;p.div='戦士';p.slot=5;movers.push(p);changes.push(`${p.name}:先鋒→降下`);}
      continue;
    }
    if(p.div==='旗頭'){
      if(p.w>3){promote(p,'先鋒');tops.push(p);changes.push(`${p.name}:旗頭→先鋒`);}
      else if(p.w>2)tops.push(p);
      else{p.demoted=true;p.div='戦士';p.slot=5;movers.push(p);}
      continue;
    }
    movers.push(p);
  }
  // 一般力士の内部スコア
  const lowN=S.people.filter(p=>p.slot>=LOW_START&&p.div!=='前相撲').length;
  const cut=Math.floor(lowN/2)+121;
  const scored=[];
  for(const p of movers){
    let s;
    const wi=(arr)=>arr[Math.min(p.w,arr.length-1)];
    if(p.div==='前相撲'||p.pre)s=(S.maxSlot||300)-wi(PRE);
    else{
      const sl=p.demoted?5:p.slot;
      if(sl<37){s=sl-wi(HYO);if(s<4)s=4;}
      else if(sl<67)s=sl-wi(MID);
      else if(sl<cut)s=sl-wi(LOW);
      else s=sl-wi(LOWEST);
    }
    if(s<=4&&p.div!=='前相撲'&&!p.pre){promote(p,'旗頭');tops.push(p);changes.push(`${p.name}:${p.w}勝${p.l}敗で旗頭へ`);continue;}
    p._s=s;scored.push(p);
  }
  scored.sort((a,b)=>a._s-b._s||b.w-a.w||a.slot-b.slot||b.ab-a.ab||a.id-b.id);
  layout(scored);
  scored.forEach(p=>{delete p._s;});
  B.changes=changes;
  const hi=changes.filter(c=>/大将|副将|先鋒/.test(c));
  hi.slice(0,12).forEach(c=>L('番付 '+c));
  B.phase='done';
}
function nextBasho(){
  S.history.push({no:S.basho.no,place:S.basho.place.name,titles:S.basho.titles,playoffs:S.basho.playoffs});
  if(S.history.length>200)S.history.shift();
  startBasho(S.basho.no+1);
}
function finishBashoLogic(){ // 日程終了後: 優勝決定→番付編成
  decideTitles();rebalance();
}

/* =====================================================================
   戦闘エンジン + 特殊能力コマンドエンジン

   コマンド形式: [種別 idx1 idx2 ... idx11]  (12要素。生成ツールの出力と同じ)
     種別 1:能力調整 2:攻撃 3:システム介入 4:条件分岐 9:例外コード
     idx7=発動確率  idx8=発動条件(0:メーター満タン 1:常時 2:HPに応じる)  idx11=継続ターン(0:永続)

   1ターンの流れ
     1. 両者の戦闘用ステータスを基礎値に戻す(体力の増減分だけは現在HPに反映)
     2. メーターを加算(暫定: 毎ターン一定量)
     3. 常時・HP条件・継続中の「能力調整/システム介入」を先攻→後攻の順に適用
     4. 先攻の行動 → 後攻の行動
        ・メーター満タンなら特殊能力が発動(メーターは0に戻る)
        ・メーター発動の「攻撃」があればそのターンの通常攻撃の代わりになる
        ・常時/HP条件の「攻撃」は通常攻撃に加えて追加ダメージ
     5. 継続ターンを消費
   ===================================================================== */
const STAT_NAME=['体力','パワー','ガード','コミュ力','学力','IQ'];
const SYS_NAME=['防御力','クリティカル率','ミス率','クリティカル倍率','実行時の体力'];
const REF_NAME=['最大体力','パワー','ガード','コミュ力','学力','IQ','前ターンのダメージ量','実行時の体力'];
const TURN_LIMIT=400, METER_MAX=100, DEF_CRIT_MULT=150;
/* 種別9(例外コード呼び出し)の登録先: EXC_HANDLERS[コードID]=(ctx,self,opp)=>{...} 戦闘開始時に1回呼ばれる */
const EXC_HANDLERS={};

/* ---------- 基本計算(TurboWarp版の対戦処理を移植) ---------- */
function condRoll(){
  const r=1+Math.floor(Math.random()*100);
  return r>90?1.2:r>65?1.1:r>35?1:r>10?0.9:0.8;
}
function guardRateV(gd,c){const g=gd*c;return ((g-70)/(g+70))/2;}
function calc(b,op,v){
  let r=b;
  if(op===0)r=b+v;else if(op===1)r=b-v;else if(op===2)r=b*v;else if(op===3&&v!==0)r=b/v;
  return Number.isFinite(r)?r:b;
}
function roll(prob){return Math.random()*100<prob;}

/* ---------- コマンド解析 ---------- */
const _parseCache=new Map();
function parseCommands(str){
  str=str||'';
  if(_parseCache.has(str))return _parseCache.get(str);
  const cmds=[],errs=[];
  const re=/\[([^\]]*)\]/g;let m;
  while((m=re.exec(str))){
    const toks=m[1].match(/\([^)]*\)|[^\s]+/g)||[];
    if(toks.length!==12){errs.push(m[0]);continue;}
    const a=toks.map(t=>{
      if(t[0]==='(')return t.slice(1,-1).split(/[,\s、]+/).filter(x=>x!=='').map(Number).filter(Number.isFinite);
      const n=Number(t);return Number.isFinite(n)?n:0;
    });
    cmds.push({raw:m[0],a});
  }
  const res={cmds,errs};_parseCache.set(str,res);return res;
}

/* ---------- 説明文(コマンド生成ツールの文面に準拠) ---------- */
function describeMain(a){
  const T=['自分','相手','両方'];
  const type=a[0];
  const op4=(ref,calcM,val,who)=>{
    const f=['+','-','×','÷'][calcM]||'+';
    return `(相手の${ref} ${f} ${val})`;
  };
  if(type===1){
    const tg=T[a[1]]||'',st=a[2]===6?'全ステータス':STAT_NAME[a[2]]||'';
    if(a[3]===4)return `${tg}の${st}を ${op4(a[4]===6?'前ターンのダメージ量':STAT_NAME[a[4]]||'',a[5],a[6])} にする`;
    return `${tg}の${st}${['を '+a[6]+' 加算する','を '+a[6]+' 減算する','を '+a[6]+' 倍にする','を '+a[6]+' で割る'][a[3]]||''}`;
  }
  if(type===2){
    const tg=a[1]===0?'自分':a[1]===1?'相手':'両方';
    if(a[3]===0)return `${tg}に ${a[6]}(固定値)のダメージを与える`;
    if(a[3]===1)return `${tg}に(パワー × ${a[6]})のダメージを与える`;
    return `${op4(REF_NAME[a[4]]||'',a[5],a[6])} のダメージを${tg}に与える`;
  }
  if(type===3){
    const tg=T[a[1]]||'',sys=SYS_NAME[a[2]]||'',pct=a[2]<=3;
    if(a[3]===4)return `${tg}の${sys}を ${op4(REF_NAME[a[4]]||'',a[5],a[6])} にする`;
    if(pct&&a[3]===0)return `${tg}の${sys}を ${a[6]}%にする`;
    if(pct&&a[3]===1)return `${tg}の${sys}を ${a[6]}%減少させる`;
    return `${tg}の${sys}${['に '+a[6]+' 加算する','から '+a[6]+' 減算する','を '+a[6]+' 倍にする','を '+a[6]+' で割る'][a[3]]||''}`;
  }
  if(type===4){
    const tg=T[a[1]]||'';
    if(a[2]===0){
      const st=a[3]===6?'全ステータス合計':STAT_NAME[a[3]]||'';
      const val=a[4]===0?'自分の数値':`${a[4]}`;
      return `【条件】${tg}の${st}が ${val} ${['以上','以下','超過','未満','等しい'][a[5]]||''} の場合、以降のコマンドを実行`;
    }
    const list=Array.isArray(a[6])?a[6]:[];
    if(a[2]===1){
      const names=list.map(i=>(PLACES[i-1]||{}).name||i).join('・')||'(なし)';
      return `【条件】現在の場所が ${names} ${a[7]===0?'のいずれか':'以外'}の場合、以降のコマンドを実行`;
    }
    return `【条件】相手のIDが ${list.join(',')||'(なし)'} に${a[7]===0?'含まれる':'含まれない'}場合、以降のコマンドを実行`;
  }
  if(type===9)return `例外コード ${a[1]} を呼び出す`;
  return '(不明なコマンド)';
}
function describeTrigger(a){
  if(a[0]===4||a[0]===9)return '';
  const prob=a[7],turn=a[11];
  if(a[8]===1){
    return turn>0?`最初の${turn}ターン、毎ターン${prob}%の確率で発動`:`毎ターン${prob}%の確率で発動`;
  }
  if(a[8]===2){
    const who=a[9]===1?'相手':'自分';
    return `${who}のHPが${a[10]}%以下のとき、毎ターン${prob}%の確率で発動`;
  }
  const dur=a[0]===2?(turn>1?`${turn}ターン連続で`:''):(turn===0?'以後ずっと':`${turn}ターンの間`);
  return `メーター満タン時に${prob}%の確率で${dur}発動`;
}
function describeCmd(a){
  const t=describeTrigger(a);
  return t?`${describeMain(a)}。(${t})`:`${describeMain(a)}。`;
}

/* ---------- 条件分岐(種別4) ----------
   「条件分岐より下のコマンド」だけが対象。毎ターン判定する(複数あれば AND)。
   体力の判定は、設定 gateHp が有効なら「現在のHP」、無効なら「データ上の体力値」(原作どおり) */
function statOf(p,k){
  if(k===6)return (p.hp+p.pw+p.gd+p.com+p.gaku)*(p.iq/100);
  return [p.hp,p.pw,p.gd,p.com,p.gaku,p.iq][k]||0;
}
function gateStat(side,k){
  if(k===0&&S.settings.gateHp!==false)return side.hp;
  return statOf(side.p,k);
}
function evalGate(a,s,o,place){
  const tgt=a[1]===1?o:s,menu=a[2];
  if(menu===0){
    const v=gateStat(tgt,a[3]);
    const cmp=a[4]===0?gateStat(s,a[3]):a[4];
    switch(a[5]){case 0:return v>=cmp;case 1:return v<=cmp;case 2:return v>cmp;case 3:return v<cmp;case 4:return v===cmp;}
    return true;
  }
  const list=Array.isArray(a[6])?a[6]:[];
  const val=menu===1?PLACES.indexOf(place)+1:o.p.id;
  const has=list.includes(val);
  return a[7]===0?has:!has;
}
function compileCmds(p){
  const {cmds}=parseCommands(p.cmd);
  const out=[],gates=[];
  for(const c of cmds){
    const a=c.a,t=a[0];
    if(t===4){gates.push(a);continue;}
    if(t===9){out.push({t,a,exc:true,trig:-1,gates:[]});continue;}
    if(t!==1&&t!==2&&t!==3)continue;
    out.push({t,a,trig:a[8],prob:a[7],dur:a[11],active:0,now:false,logged:false,gates:gates.slice()});
  }
  return out;
}
function gateOK(r,s,o,ctx){
  for(const g of r.gates)if(!evalGate(g,s,o,ctx.place))return false;
  return true;
}

/* ---------- 戦闘用の状態 ---------- */
function mkSide(p,place,key){
  const base=condRoll();let c=base;
  if(place.key===p.fav)c*=1.2;
  else if(place.key===p.bad)c*=0.8;
  if(S.settings.superMode&&SUPER_IDS.has(p.id))c+=50;
  return {key,p,base,c,hp:p.hp,max:p.hp,maxHp:p.hp,prevBonus:0,meter:0,hasMeter:false,cmds:[],last:0,
    v:null,critO:null,missO:null,defO:null,critMult:DEF_CRIT_MULT};
}
function resetVars(s){
  const p=s.p;
  s.v={pw:p.pw,gd:p.gd,iq:p.iq,com:p.com,gaku:p.gaku};
  s.maxHp=p.hp;s.critO=null;s.missO=null;s.defO=null;s.critMult=DEF_CRIT_MULT;
}
/* 体力(最大体力)の増減を現在HPへ反映: 上限を超えた分は切り捨て、増えた分は加算。
   効果が切れても「減らした分」は戻らない */
function syncHp(s){
  if(s.hp>s.maxHp)s.hp=s.maxHp;
  const bonus=Math.max(0,s.maxHp-s.p.hp);
  if(bonus>s.prevBonus)s.hp+=bonus-s.prevBonus;
  s.prevBonus=bonus;
}
function getStat(s,k){return k===0?s.maxHp:[0,s.v.pw,s.v.gd,s.v.com,s.v.gaku,s.v.iq][k];}
function setStat(s,k,v){
  if(k===0)s.maxHp=v;else s.v[['','pw','gd','com','gaku','iq'][k]]=v;
}
function curDefense(s){
  let d=s.defO!=null?s.defO:guardRateV(s.v.gd,s.c);
  if(d<0)d=0;if(1-d<0)d=0.99;return d;
}
function curCrit(s){const q=s.v.iq*s.c;return s.critO!=null?s.critO:(q-70)/q;}
function curMiss(s){
  if(s.missO!=null)return s.missO;
  const q=s.v.iq*s.c,ratio=((q-70)/(q+200))*100;
  return ratio<=0?Infinity:1/ratio;
}
/* 「相手参照」の値: 実行者の相手の値に計算(idx5, idx6)を掛ける */
function refValue(a,s,o){
  const k=a[4];
  const base=[o.maxHp,o.v.pw,o.v.gd,o.v.com,o.v.gaku,o.v.iq,o.last,o.hp][k]||0;
  return calc(base,a[5],a[6]);
}

/* ---------- 戦闘ログ ---------- */
function emit(ctx,e){
  const A=ctx.A,B=ctx.B;
  ctx.ev.push(Object.assign({t:ctx.t,hpA:A.hp,hpB:B.hp,mA:A.hasMeter?A.meter:null,mB:B.hasMeter?B.meter:null},e));
}
const fm=n=>Math.round(n).toLocaleString('ja-JP');
function ko(s){if(Math.ceil(s.hp)<1)s.hp=0;}
function sideOf(ctx,key){return key==='A'?ctx.A:ctx.B;}
function targetsOf(idx1,s,o){return idx1===0?[s]:idx1===1?[o]:[s,o];}

/* ---------- 効果の適用(種別1・3) ---------- */
function effStat(s,o,x,a){
  const keys=a[2]===6?[0,1,2,3,4,5]:[a[2]];
  for(const k of keys){
    const cur=getStat(x,k);
    const nv=a[3]===4?refValue(a,s,o):calc(cur,a[3],a[6]);
    setStat(x,k,Math.max(0,nv));
  }
}
function effSys(ctx,s,o,x,a){
  const sys=a[2];
  if(sys===4){                                   // 実行時の体力(現在HPそのもの)
    const before=x.hp;
    const nv=Math.max(0,a[3]===4?refValue(a,s,o):calc(x.hp,a[3],a[6]));
    x.hp=Math.min(x.maxHp,nv);ko(x);
    const d=x.hp-before;
    if(Math.abs(d)>=0.5)emit(ctx,{s:s.key,tgt:x.key,kind:'hp',delta:d,
      text:d>0?`${x.p.name}は体力が ${fm(d)} 回復した`:`${x.p.name}は体力が ${fm(-d)} 減った`});
    return;
  }
  const pct=sys<=2;                              // 0:防御力 1:クリ率 2:ミス率 は%、3:クリ倍率は倍率(%表記)
  const cur=sys===0?curDefense(x)*100:sys===1?curCrit(x)*100:sys===2?(Number.isFinite(curMiss(x))?curMiss(x)*100:100):x.critMult;
  let nv;
  if(a[3]===4)nv=refValue(a,s,o);
  else if(a[3]===0)nv=a[6];                      // 加算(固定値) = その値にする
  else nv=calc(cur,a[3],a[6]);                   // 1:減算 2:乗算 3:除算
  nv=Math.max(0,nv);
  if(sys===0)x.defO=Math.min(1,nv/100);
  else if(sys===1)x.critO=Math.min(1,nv/100);
  else if(sys===2)x.missO=Math.min(1,nv/100);
  else x.critMult=nv;
}
function applyEffect(ctx,s,o,r,announce){
  const a=r.a;
  for(const x of targetsOf(a[1],s,o)){
    if(r.t===1)effStat(s,o,x,a);else effSys(ctx,s,o,x,a);
  }
  syncHp(s);syncHp(o);
  if(announce&&!(r.t===3&&a[2]===4))
    emit(ctx,{s:s.key,kind:'fx',text:`✦ ${s.p.name}: ${describeMain(a)}`});
}

/* ---------- 攻撃(種別2・通常攻撃) ---------- */
function hurt(ctx,s,x,raw,label,kind){
  const d=curDefense(x);
  const fin=raw*(1-d);
  x.hp-=fin;ko(x);
  emit(ctx,{s:s.key,tgt:x.key,kind,type:'hit',dmg:fin,guard:d,
    text:`${label}${x.p.name}に ${fm(fin)} ダメージ${d>0.005?`(防御${Math.round(d*100)}%軽減)`:''}`});
  return fin;
}
function doAttack(ctx,s,o,r,kind){
  const a=r.a;
  let raw=a[3]===0?a[6]:a[3]===1?s.v.pw*a[6]:refValue(a,s,o);
  raw=Math.max(0,Number.isFinite(raw)?raw:0);
  let dealt=0;
  for(const x of targetsOf(a[1],s,o)){
    if(x.hp<=0)continue;
    const label=x===s?`✦ ${s.p.name}は反動で `:kind==='sp'?`✦ ${s.p.name}の必殺! `:`✦ ${s.p.name}の追撃! `;
    const f=hurt(ctx,s,x,raw,label,'sp');
    if(x===o)dealt+=f;
  }
  return dealt;
}
function normalAttack(ctx,s,o){
  const q=s.v.iq*s.c;
  const crit=curCrit(s),miss=curMiss(s);
  const base=s.v.pw*s.c/6;
  let dmg=0,type='miss';
  if(Math.random()<crit){
    if(Math.random()>miss){dmg=base*s.critMult/100;type='crit';}
  }else if(Math.random()>miss){dmg=base;type='hit';}
  // 防御は「攻撃側のIQ由来の確率」で有効。能力で防御を固定している場合は常に有効(原作どおり)
  let d;
  if(o.defO!=null)d=o.defO;
  else d=Math.random()<(q-70)/q?guardRateV(o.v.gd,o.c):0;
  if(d<0)d=0;if(1-d<0)d=0.99;
  const fin=dmg*(1-d);
  o.hp-=fin;ko(o);
  emit(ctx,{s:s.key,tgt:o.key,kind:'atk',type,dmg:fin,guard:d,
    text:type==='miss'?`${s.p.name}の攻撃は外れた`:
      `${s.p.name}の${type==='crit'?'会心の一撃! ':'攻撃 '}${fm(fin)}ダメージ${d>0?`(防御${Math.round(d*100)}%軽減)`:''}`});
  return fin;
}

/* ---------- ターン進行 ---------- */
function inWindow(r,turn){return r.dur===0||turn<=r.dur;}
function hpCond(r,s,o){
  const t=r.a[9]===1?o:s;
  return t.hp/t.p.hp*100<=r.a[10];
}
/* メーター増加量。暫定: 毎ターン一定量(設定値)。
   原作は コミュ力・能力評価値・体力差で変動するので、差し替える場合はここだけ直す */
function meterGain(s,o,ctx){
  const r=S.settings.meterRate;
  return Number.isFinite(r)?r:25;
}
function passivePhase(ctx,s,o){
  if(s.hp<=0)return;
  for(const r of s.cmds){
    if(r.exc||(r.t!==1&&r.t!==3))continue;
    if(r.gates.length&&!gateOK(r,s,o,ctx))continue;
    let go=false;
    if(r.trig===0)go=r.active>0&&!r.now;
    else if(r.trig===1)go=inWindow(r,ctx.t)&&roll(r.prob);
    else if(r.trig===2)go=inWindow(r,ctx.t)&&hpCond(r,s,o)&&roll(r.prob);
    if(!go)continue;
    const loud=r.trig!==0&&(r.prob<100||!r.logged);
    if(r.trig!==0)r.logged=true;
    applyEffect(ctx,s,o,r,loud);
  }
}
function act(ctx,s,o){
  if(s.hp<=0||o.hp<=0)return;
  if(s.hasMeter&&s.meter>=METER_MAX){
    const cand=s.cmds.filter(r=>r.trig===0&&r.active!==Infinity&&gateOK(r,s,o,ctx));   // 永続化済みのものは再発動しない
    if(cand.length){
      s.meter=0;ctx.sp++;
      emit(ctx,{s:s.key,kind:'trig',text:`✦✦ ${s.p.name}のメーターが満タン! 特殊能力発動!`});
      let fired=0;
      for(const r of s.cmds){if(r.trig===0)r.now=false;}
      for(const r of cand){
        if(roll(r.prob)){
          r.active=r.t===2?Math.max(1,r.dur):(r.dur===0?Infinity:r.dur);
          r.now=true;fired++;
        }
      }
      if(!fired)emit(ctx,{s:s.key,kind:'fx',text:`  …しかし不発に終わった`});
      for(const r of cand)if(r.now&&(r.t===1||r.t===3))applyEffect(ctx,s,o,r,true);
    }
  }
  const special=s.cmds.filter(r=>r.trig===0&&r.t===2&&r.active>0&&gateOK(r,s,o,ctx));
  const extra=s.cmds.filter(r=>(r.trig===1||r.trig===2)&&r.t===2&&inWindow(r,ctx.t)&&gateOK(r,s,o,ctx)&&(r.trig===1||hpCond(r,s,o))&&roll(r.prob));
  let dealt=0;
  for(const r of special.concat(extra)){
    if(s.hp<=0||o.hp<=0)break;
    dealt+=doAttack(ctx,s,o,r,special.includes(r)?'sp':'ex');
  }
  if(!special.length&&s.hp>0&&o.hp>0)dealt+=normalAttack(ctx,s,o);
  s.last=dealt;
}
function tick(s){
  for(const r of s.cmds){
    r.now=false;
    if(r.trig===0&&r.active>0&&Number.isFinite(r.active))r.active--;
  }
}

/* ---------- 1試合 ---------- */
function simulate(a,b,place){
  const A=mkSide(a,place,'A'),B=mkSide(b,place,'B');
  const useSp=S.settings.special!==false;
  A.cmds=useSp?compileCmds(a):[];
  B.cmds=useSp?compileCmds(b):[];
  A.hasMeter=A.cmds.some(r=>r.trig===0);
  B.hasMeter=B.cmds.some(r=>r.trig===0);
  const ctx={A,B,ev:[],t:0,sp:0,place};
  for(const [s,o] of [[A,B],[B,A]])
    for(const r of s.cmds)if(r.exc&&EXC_HANDLERS[r.a[1]])EXC_HANDLERS[r.a[1]](ctx,s,o);
  let turn=0;
  while(A.hp>0&&B.hp>0&&turn<TURN_LIMIT){
    turn++;ctx.t=turn;
    resetVars(A);resetVars(B);
    syncHp(A);syncHp(B);
    if(A.hasMeter)A.meter=Math.min(METER_MAX,A.meter+meterGain(A,B,ctx));
    if(B.hasMeter)B.meter=Math.min(METER_MAX,B.meter+meterGain(B,A,ctx));
    passivePhase(ctx,A,B);passivePhase(ctx,B,A);
    syncHp(A);syncHp(B);
    if(A.hp<=0||B.hp<=0)break;
    act(ctx,A,B);
    if(A.hp>0&&B.hp>0)act(ctx,B,A);
    tick(A);tick(B);
  }
  let win;
  if(B.hp<=0&&A.hp>0)win='A';else if(A.hp<=0&&B.hp>0)win='B';
  else win=(A.hp/A.max>=B.hp/B.max)?'A':'B';
  return {A,B,ev:ctx.ev,turns:turn,sp:ctx.sp,win,winner:win==='A'?a:b,loser:win==='A'?b:a};
}

/* =====================================================================
   キャラクターデータの更新(GAS → CSV)
   - 取得は「更新ボタンを押したときだけ」。起動時の自動取得はしない
   - 取得結果はブラウザに保存し、次回以降の起動ではそれを使う
   - 取得前に差分を表示し、確認してから適用する
   ===================================================================== */
const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbz5dvjxUvQWo9aTro6vwkj9u6-CtWvt7GQs39bFg_nhYDqPtpeTVOknse19UUupGOWQ/exec';
const DB_KEY='banzuke_chardb_v1',PEND_KEY='banzuke_pending_v1',URL_KEY='banzuke_gasurl_v1',LAST_KEY='banzuke_lastfetch_v1';
const COOLDOWN_MS=30000, MIN_ROWS=20, TIMEOUT_MS=25000;

function lsGet(k){try{const t=localStorage.getItem(k);return t?JSON.parse(t):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function getGasUrl(){const u=lsGet(URL_KEY);return (typeof u==='string'&&u.startsWith('https://'))?u:GAS_DEFAULT;}
function getDB(){const d=lsGet(DB_KEY);return d&&Array.isArray(d.rows)&&d.rows.length?d:null;}
function dbRows(){
  const d=getDB();if(!d)return DATA;
  if(d.rows[0]&&d.rows[0].length>=15)return d.rows;
  const by=new Map(DATA.map(r=>[nameKey(r[1]),r]));   // 旧形式のDBにコミュ力・学力を補う
  return d.rows.map(r=>{const o=by.get(nameKey(r[1]));const x=r.slice();x[13]=o?o[13]:0;x[14]=o?o[14]:0;return x;});
}
function getPending(){const d=lsGet(PEND_KEY);return d&&Array.isArray(d.rows)?d:null;}
function fmtDate(ts){
  if(!ts)return '-';
  const d=new Date(ts),z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ---------- 取得(ページ分割+再試行) ----------
   GASは ?page=1,2,3… でCSVを分割して返す。空のレスポンスが返ったら全ページ取得完了。
   途中のページが取得できなかった場合は、中途半端なデータで名簿を壊さないよう全体を失敗扱いにする。 */
const PAGE_RETRY=3, MAX_PAGES=200, PAGE_GAP_MS=300;

let UPD_DIAG='';   // 取得状況のメモ(失敗時の「詳細」に表示)
const headOf=t=>String(t).trim().slice(0,200).replace(/\s+/g,' ');

async function fetchPageOnce(url,page){
  const u=new URL(url);
  u.searchParams.set('page',page);
  u.searchParams.set('_',Date.now());   // 途中のキャッシュ回避
  // AbortSignal は環境によって fetch に渡せない(DataCloneError)ため使わず、Promise.race でタイムアウトを実現する
  let timer;
  const timeout=new Promise((_,rej)=>{timer=setTimeout(()=>{const e=new Error('タイムアウト');e.name='AbortError';rej(e);},TIMEOUT_MS);});
  const run=(async()=>{
    const r=await fetch(u.toString());
    const text=await r.text();
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;e.head=headOf(text);throw e;}
    return text;
  })();
  run.catch(()=>{});   // タイムアウト後に遅れて失敗しても未処理エラーにしない
  try{return await Promise.race([run,timeout]);}
  finally{clearTimeout(timer);}
}

async function fetchPageWithRetry(url,page,maxRetry=PAGE_RETRY){
  const log=[];
  for(let attempt=1;;attempt++){
    try{
      const csv=await fetchPageOnce(url,page);
      if(csv.trimStart().startsWith('<')){   // CSVではなくHTMLが返った(GASの一時エラーや権限エラー)
        const e=new Error('CSVではなくHTMLが返りました');e.html=true;e.head=headOf(csv);throw e;
      }
      return csv;
    }catch(e){
      console.warn(`page=${page} の取得に失敗 (${attempt}/${maxRetry})`,e);
      log.push(`${page}ページ目 ${attempt}回目: ${e.name}: ${e.message}`+(e.head?` / 応答の先頭: ${e.head}`:''));
      if(attempt>=maxRetry){
        let msg=`${page}ページ目の取得に失敗しました(${maxRetry}回試行)。`,hint;
        if(e.html){msg=`${page}ページ目で、CSVではなくWebページが返ってきました。`;
          hint='下の「詳細」の応答内容を確認してください。権限エラーなら「アクセスできるユーザー」が「全員」か、デプロイURLが最新かを確認してください。';}
        else if(e.name==='AbortError')hint='タイムアウトしました。GAS側の処理が重い可能性があります。1ページあたりの件数を減らしてみてください。';
        else if(e.status)hint=`サーバーがエラー(HTTP ${e.status})を返しました。GASがこのページ番号でエラーを起こしている可能性があります。`;
        else hint='通信が遮断されました。GASが例外を出した場合などはブラウザ側では通信エラーとして見えることがあります。ブラウザで「URL?page='+page+'」を直接開いて結果を確認してください。';
        throw new UpdateError(msg,hint,log.join('\n'));
      }
      await sleep(attempt*1000);   // 1秒→2秒…と間隔をあけて再試行
    }
  }
}

async function fetchCharText(url,onProgress){
  const parts=[],pageLog=[];let prev=null,page=1,done=false;
  for(;page<=MAX_PAGES;page++){
    if(onProgress)onProgress(page);
    const csv=await fetchPageWithRetry(url,page);
    pageLog.push(`${page}ページ目: ${csv.length}文字 / 先頭: ${headOf(csv).slice(0,60)}`);
    UPD_DIAG='取得できたページ:\n'+pageLog.join('\n');
    if(!csv.trim()){done=true;break;}          // 空 = 全取得完了
    if(csv===prev){done=true;break;}           // 同じ内容が続く = page非対応の旧GAS(全件が返っている)
    parts.push(csv.replace(/^\uFEFF/,'').replace(/[\r\n]+$/,''));
    prev=csv;
    await sleep(PAGE_GAP_MS);                  // 連続アクセスを少し間引く
  }
  if(!done)throw new UpdateError(`ページ数が多すぎます(${MAX_PAGES}ページ以上)。`,'GAS側が空のレスポンスを返して終了できていない可能性があります。');
  if(!parts.length)throw new UpdateError('取得したデータが空でした。','スプレッドシートにデータがあるか、GASの処理を確認してください。');
  return parts.join('\n');
}

/* ---------- CSV解析(引用符・改行・BOM対応) ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}
      else f+=c;
    }else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function toNum(s){
  if(s==null)return NaN;
  const t=String(s).replace(/[,\s\u3000]/g,'');
  if(t==='')return NaN;
  const n=Number(t);return Number.isFinite(n)?n:NaN;
}
class UpdateError extends Error{constructor(msg,hint,detail){super(msg);this.hint=hint||'';this.detail=detail||'';}}

/* CSV文字列 → 取り込める行(名前・能力値) */
function parseChars(text){
  const head=text.trimStart().slice(0,200).toLowerCase();
  if(head.startsWith('<!doctype')||head.startsWith('<html')||head.startsWith('<'))
    throw new UpdateError('CSVではなくWebページが返ってきました。',
      'GASのデプロイ設定で「アクセスできるユーザー」が「全員」になっているか、デプロイURLが最新かを確認してください。');
  const rows=parseCSV(text);
  let hi=rows.findIndex((r,i)=>i<5&&r.some(c=>c.trim()==='名前'));
  if(hi<0)throw new UpdateError('ヘッダー行(「名前」列)が見つかりません。','GASが返すCSVの1行目に列名が含まれているか確認してください。');
  const header=rows[hi].map(c=>c.trim());
  const col=n=>header.indexOf(n);
  const need=['名前','体力','パワー','ガード','IQ','能力評価値'];
  const miss=need.filter(n=>col(n)<0);
  if(miss.length)throw new UpdateError('必要な列がありません: '+miss.join('、'),'スプレッドシートの列名(体力・パワー・ガード・IQ・能力評価値)が変わっていないか確認してください。');
  const opt={fav:col('得意場所'),bad:col('苦手場所'),inc:col('場所収入'),cmd:col('特殊能力コマンド'),com:col('コミュ力'),gaku:col('学力'),img:col('画像URL')};
  const out=[],skipped=[],dups=[];const seen=new Set();
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];
    const name=(r[col('名前')]||'').trim();
    if(!name||name==='名前')continue;   // 空行・ページ先頭の繰り返しヘッダーは無視
    const v={hp:toNum(r[col('体力')]),pw:toNum(r[col('パワー')]),gd:toNum(r[col('ガード')]),iq:toNum(r[col('IQ')]),ab:toNum(r[col('能力評価値')])};
    if(Object.values(v).some(Number.isNaN)||v.hp<=0){skipped.push(name);continue;}
    const key=nameKey(name);
    if(seen.has(key)){dups.push(name);continue;}
    seen.add(key);
    const o=x=>x<0?undefined:norm((r[x]||'').trim());   // (null) は空欄扱い
    const nn=x=>{const n=x<0?NaN:toNum(r[x]);return Number.isNaN(n)?undefined:n;};
    out.push({name,...v,fav:o(opt.fav),bad:o(opt.bad),inc:o(opt.inc),cmd:o(opt.cmd),com:nn(opt.com),gaku:nn(opt.gaku),img:o(opt.img)});
  }
  if(out.length<MIN_ROWS)throw new UpdateError(`有効なキャラが${out.length}人しかありません(最低${MIN_ROWS}人)。`,'取得内容がおかしい可能性があるため、データは変更していません。');
  return {chars:out,skipped,dups};
}

/* 取得結果 × 現在のデータ → 新しい名簿と差分 */
function buildMerge(text){
  const {chars,skipped,dups}=parseChars(text);
  const oldRows=dbRows();
  const oldByKey=new Map(oldRows.map(r=>[nameKey(r[1]),r]));
  const liveByKey=new Map(S.people.map(p=>[nameKey(p.name),p]));
  let maxId=0;
  for(const r of oldRows)maxId=Math.max(maxId,r[0]);
  for(const p of S.people)maxId=Math.max(maxId,p.id);
  for(const id of Object.keys(S.retired))maxId=Math.max(maxId,+id);
  const rows=[],added=[],changed=[];let same=0;
  const newKeys=new Set();
  for(const c of chars){
    const key=nameKey(c.name);newKeys.add(key);
    const live=liveByKey.get(key),old=oldByKey.get(key);
    const id=live?live.id:(old?old[0]:++maxId);
    const rk=old?old[7]:9999;
    // 列がある場合は空欄も「なし」として尊重し、列が無い場合は現在の設定を引き継ぐ
    const pick=(v,ov,lv)=>v!==undefined?v:(lv!==undefined?lv:ov);
    const fav=pick(c.fav,old?old[8]:'',live?live.fav:undefined);
    const bad=pick(c.bad,old?old[9]:'',live?live.bad:undefined);
    const inc=c.inc!==undefined&&c.inc!==''&&!Number.isNaN(toNum(c.inc))?toNum(c.inc):(live?live.inc:(old?old[10]:100));
    const cmd=pick(c.cmd,old?old[11]:'',live?live.cmd:undefined);
    const com=c.com!==undefined?c.com:(live?live.com:(old?(old[13]||0):0));
    const gaku=c.gaku!==undefined?c.gaku:(live?live.gaku:(old?(old[14]||0):0));
    const img=c.img!==undefined?imgUrl(c.img):(live?(live.img||''):(old?(old[15]||''):''));   // 列があれば空欄も「画像なし」
    rows.push([id,c.name,c.hp,c.pw,c.gd,c.iq,c.ab,rk,fav||'',bad||'',inc,cmd||'',old?old[12]:0,com,gaku,img]);
    if(!live&&!old)added.push(c.name);
    else if(!live)added.push(c.name+'(再登場)');
    else if(live.hp!==c.hp||live.pw!==c.pw||live.gd!==c.gd||live.iq!==c.iq||Math.abs(live.ab-c.ab)>0.05||live.com!==com||live.gaku!==gaku||(live.cmd||'')!==(cmd||'')||(live.img||'')!==img)changed.push(c.name);
    else same++;
  }
  const removed=S.people.filter(p=>!newKeys.has(nameKey(p.name)));
  const topRemoved=removed.filter(p=>['大将','副将','先鋒','旗頭','戦士'].includes(p.div)).map(p=>`${p.name}(${rankLabel(p)})`);
  return {rows,added,changed,same,removed:removed.map(p=>p.name),topRemoved,skipped,dups,total:rows.length,fetchedAt:Date.now()};
}

/* ---------- 適用 ---------- */
function canApplyNow(){return S.basho.day===0||S.basho.phase==='done';}
function commitUpdate(rows,fetchedAt){
  const r=applyRoster(rows);
  const ok=lsSet(DB_KEY,{fetchedAt,rows});
  lsDel(PEND_KEY);
  UI.watch=new Set([...UI.watch].filter(id=>S.byId.has(id)));
  saveNow();renderAll();
  if(!ok)toast('更新は反映しましたが、データの保存に失敗しました(次回起動時は元のデータに戻ります)');
  else toast(`データを更新しました(追加${r.added.length}人・整理${r.removed.length}人・現在${S.people.length}人)`);
}
function applyPendingIfAny(){
  const pd=getPending();
  if(pd){commitUpdate(pd.rows,pd.fetchedAt);return true;}
  return false;
}
function goNextBasho(){
  applyPendingIfAny();
  nextBasho();stage.idle();renderAll();saveSoon();
}

/* ---------- 画面 ---------- */
function setUpdBusy(b){$('bUpd').disabled=b;$('bUpd').textContent=b?'取得中…':updLabel();}
function updLabel(){return getPending()?'⟳ 更新を適用待ち':'⟳ データ更新';}
function dlgOpen(html){
  $('dlgBody').innerHTML=html;
  if(!$('dlg').open)$('dlg').showModal();
}
function nameList(arr,n=12){
  if(!arr.length)return '<span class="dim">なし</span>';
  const shown=arr.slice(0,n).map(esc).join('、');
  return arr.length>n?`${shown} <span class="dim">…ほか${arr.length-n}人</span>`:shown;
}
function showUpdateError(e){
  let msg,hint='';
  if(e instanceof UpdateError){msg=e.message;hint=e.hint;}
  else if(e&&e.name==='AbortError'){msg='取得がタイムアウトしました。';hint='時間をおいて、もう一度お試しください。';}
  else if(e instanceof TypeError){msg='データを取得できませんでした(通信またはアクセス権の問題)。';
    hint='ネット接続と、GASのデプロイ設定(「アクセスできるユーザー」が「全員」)を確認してください。ゲームを開いている場所(ファイルを直接開いている等)によって制限される場合もあります。';}
  else{msg='取得に失敗しました: '+(e&&e.message?e.message:e);}
  const detail=[(e&&e.detail)||'',UPD_DIAG,'['+(e&&e.name||'Error')+'] '+(e&&e.message||'')].filter(Boolean).join('\n\n');
  dlgOpen(`<h2>更新できませんでした</h2><p>${esc(msg)}</p>${hint?`<p class="dim">${esc(hint)}</p>`:''}
  <p class="dim">現在のデータはそのままです。</p>
  <details><summary class="dim">詳細(原因調査用)</summary>
    <pre id="uDetail" style="white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:200px;overflow:auto;user-select:text">${esc(detail)}</pre>
    <button id="uCopy">詳細をコピー</button></details>
  <div class="row"><button id="uClose">閉じる</button></div>`);
  $('uClose').onclick=()=>$('dlg').close();
  $('uCopy').onclick=()=>{try{navigator.clipboard.writeText(detail).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした。手動で選択してください'));}catch(_){toast('コピーできませんでした。手動で選択してください');}};
}
function showUpdateDialog(m){
  const noChange=!m.added.length&&!m.removed.length&&!m.changed.length;
  const now=canApplyNow();
  if(noChange){
    lsSet(DB_KEY,{fetchedAt:m.fetchedAt,rows:dbRows()});   // 最終確認日時だけ更新
    dlgOpen(`<h2>最新です</h2><p>取得した${m.total}人は、現在のデータと同じでした。</p><div class="row"><button id="uClose">閉じる</button></div>`);
    $('uClose').onclick=()=>{$('dlg').close();if(UI.tab==='settings')renderSettings();};
    return;
  }
  dlgOpen(`<h2>データ更新の確認</h2>
  <p>取得: <b>${m.total}人</b> / 現在: <b>${S.people.length}人</b></p>
  <div class="stats">
    <div><small>新規追加</small><b>${m.added.length}</b></div>
    <div><small>整理(削除)</small><b>${m.removed.length}</b></div>
    <div><small>変更あり</small><b>${m.changed.length}</b></div>
  </div>
  ${m.added.length?`<p><small class="dim">追加(前相撲から開始)</small><br>${nameList(m.added)}</p>`:''}
  ${m.removed.length?`<p><small class="dim">整理される人(番付から外れます)</small><br>${nameList(m.removed)}</p>`:''}
  ${m.topRemoved.length?`<p class="up" style="color:var(--bad)">⚠ 戦士以上の番付者が含まれます: ${nameList(m.topRemoved,8)}</p>`:''}
  ${m.changed.length?`<p><small class="dim">能力・画像などが変わる人</small><br>${nameList(m.changed,8)}</p>`:''}
  ${m.skipped.length?`<p class="dim"><small>能力値が空のため取り込まなかった行: ${m.skipped.length}件</small></p>`:''}
  <p class="dim"><small>得意/苦手場所・特殊能力は、同名のキャラは現在の設定を引き継ぎます。優勝などの記録は引き継がれ、整理された人の名前は歴代記録にだけ残ります。</small></p>
  ${now?'':'<p class="dim">⚠ 場所の途中のため、今は反映できません。次の場所の開始時に自動で適用できます。</p>'}
  <div class="row">${now?'<button class="primary" id="uApply">今すぐ適用</button>':'<button class="primary" id="uLater">次の場所の開始時に適用</button>'}<button id="uClose">キャンセル</button></div>`);
  $('uClose').onclick=()=>$('dlg').close();
  if(now)$('uApply').onclick=()=>{$('dlg').close();commitUpdate(m.rows,m.fetchedAt);};
  else $('uLater').onclick=()=>{
    lsSet(PEND_KEY,{fetchedAt:m.fetchedAt,rows:m.rows,sum:{a:m.added.length,r:m.removed.length,c:m.changed.length}});
    $('dlg').close();renderStatus();if(UI.tab==='settings')renderSettings();
    toast('次の場所の開始時にデータを更新します');
  };
}
async function checkUpdate(){
  if(UI.updating)return;
  if(UI.busy){toast('進行中は更新できません。いったん停止してからお試しください');return;}
  const left=COOLDOWN_MS-(Date.now()-(+localStorage.getItem(LAST_KEY)||0));
  if(left>0){toast(`続けて更新はできません。あと${Math.ceil(left/1000)}秒お待ちください`);return;}
  UI.updating=true;setUpdBusy(true);
  try{
    try{localStorage.setItem(LAST_KEY,String(Date.now()));}catch(e){}
    UPD_DIAG='';
    const text=await fetchCharText(getGasUrl(),pg=>{$('bUpd').textContent=`取得中… ${pg}ページ目`;});
    UPD_DIAG+=`\n結合後: ${text.length}文字 / 先頭: ${headOf(text).slice(0,150)}`;
    showUpdateDialog(buildMerge(text));
  }catch(e){showUpdateError(e);}
  finally{UI.updating=false;setUpdBusy(false);}
}

  <div class="set"><button id="oUpd" class="primary">⟳ 最新データに更新</button> <small class="dim">押したときだけ取得します。起動時の自動取得はしません(連続更新は30秒あける必要があります)。</small></div>

}
function bindUpdateInfo(){
  $('oUpd').onclick=checkUpdate;

function serialize(){
  const B=S.basho;
  return {v:1,thirdStart:S.thirdStart,maxSlot:S.maxSlot,history:S.history,logs:S.logs.slice(-120),
    settings:S.settings,watch:[...UI.watch],ui:{mode:UI.mode,speed:UI.speed,scope:UI.scope,autoNext:UI.autoNext},
    retired:S.retired,
    people:S.people.map(p=>({id:p.id,name:p.name,hp:p.hp,pw:p.pw,gd:p.gd,iq:p.iq,ab:p.ab,rk:p.rk,fav:p.fav,bad:p.bad,inc:p.inc,cmd:p.cmd,com:p.com,gaku:p.gaku,img:p.img,res:p.res||[],div:p.div,slot:p.slot,pre:p.pre,pk:p.pk,w:p.w,l:p.l,met:p.met,rec:p.rec,titles:p.titles,tsuna:p.tsuna,demoted:p.demoted})),
    basho:{no:B.no,day:B.day,mi:B.mi,phase:B.phase,titles:B.titles,playoffs:B.playoffs,changes:B.changes||[],
      byes:B.byes.map(p=>p.id),
      matches:B.matches.map(m=>[m.a.id,m.b.id,m.w,m.gi,m.swiss?1:0,m.turns||0,m.condA||1,m.condB||1,m.sp||0,m.dbg||null])}};
}
function restore(d){
  initPeople();
  const legacy=new Map(DATA.map(r=>[r[0],r]));
  S.people=d.people.map(x=>Object.assign(mkPerson(legacy.get(x.id)||[x.id,'?',0,0,0,0,0,0,'','',0,'',0]),x));
  S.byId=new Map(S.people.map(p=>[p.id,p]));
  S.retired=d.retired||{};
  S.thirdStart=d.thirdStart;S.maxSlot=d.maxSlot;S.history=d.history||[];S.logs=d.logs||[];
  Object.assign(S.settings,d.settings||{});
  UI.watch=new Set((d.watch||[]).filter(id=>S.byId.has(id)));
  if(d.ui){UI.mode=d.ui.mode||UI.mode;UI.speed=d.ui.speed||UI.speed;UI.scope=d.ui.scope||UI.scope;if(d.ui.autoNext!=null)UI.autoNext=d.ui.autoNext;}
  const b=d.basho;
  S.basho={no:b.no,place:PLACES[(b.no-1)%PLACES.length],day:b.day,mi:b.mi,phase:b.phase,titles:b.titles,
    playoffs:b.playoffs||[],changes:b.changes||[],byes:(b.byes||[]).map(id=>S.byId.get(id)).filter(Boolean),
    matches:b.matches.filter(r=>S.byId.has(r[0])&&S.byId.has(r[1])).map(r=>({a:S.byId.get(r[0]),b:S.byId.get(r[1]),w:r[2],gi:r[3],swiss:!!r[4],turns:r[5],condA:r[6],condB:r[7],sp:r[8]||0,dbg:r[9]||null}))};
  if(S.basho.mi>S.basho.matches.length)S.basho.mi=S.basho.matches.length;
}
let saveTimer=0;
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,600);}
function saveNow(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(serialize()));}catch(e){}}
function loadSaved(){
  try{const t=localStorage.getItem(SAVE_KEY);if(!t)return false;restore(JSON.parse(t));return true;}catch(e){return false;}
}

const STAGE_BG_URL='';   // 背景画像のURL(例: 'bg/town.png')。空ならデフォルトのグラデーション背景
const SIDE_TPL=`<div class="who"><span class="rk">-</span><span class="nm">-</span><span class="mv"></span></div>
<div class="cond"></div>
<div class="hpt"></div>
<div class="bar"><i></i></div>
<div class="portrait"><div class="pimg"><div class="ph"></div><img alt="" referrerpolicy="no-referrer" hidden></div><div class="vm off"><i></i></div></div>
<div class="spt" hidden></div>
<div class="chips"></div>
<div class="st"></div>`;
function mvIcon(p){
  const k=rankSortKey(p);
  if(p.rec.length===0||p.pk===k||p.div==='前相撲')return '';
  return k<p.pk?'<span class="mv" title="前場所より昇進">⤴</span>':'<span class="mv dn" title="前場所より降下">⤵</span>';
}
function nameHue(n){let h=0;for(const c of String(n))h=(h*31+c.codePointAt(0))%360;return h;}
const stage={
  init(){
    $('sideL').innerHTML=SIDE_TPL;$('sideR').innerHTML=SIDE_TPL;
    this.el={L:$('sideL'),R:$('sideR'),feed:$('feed'),turn:$('turn'),res:$('res'),gs:$('gameset'),
      basho:$('duelBasho'),day:$('duelDay'),sub:$('duelSub')};
    this.el.L.onclick=()=>this.cur&&this.cur.a&&openProfile(this.cur.a.id);
    this.el.R.onclick=()=>this.cur&&this.cur.b&&openProfile(this.cur.b.id);
    this.el.gs.onclick=e=>{e.stopPropagation();this.el.gs.hidden=true;};
    if(STAGE_BG_URL)$('duel').style.setProperty('--stage-bg',`url("${STAGE_BG_URL}") center/cover no-repeat`);
  },
  head(m){
    const B=S.basho;
    if(m&&m.practice){this.el.basho.textContent='練習戦';this.el.day.textContent='';this.el.sub.textContent='';return;}
    this.el.basho.textContent=`第${B.no}場所 ・ ${B.place.name}`;
    this.el.day.textContent=B.phase==='done'?'終了':(B.day?`${B.day}日目`:'開幕前');
    this.el.sub.textContent=(m&&B.matches.includes(m))?`${GROUPS[m.gi]?GROUPS[m.gi].key:''} ・ ${B.matches.indexOf(m)+1}/${B.matches.length}番`:'';
  },
  idle(){
    $('stageBody').classList.add('idle');this.cur=null;
    this.el.gs.hidden=true;this.head(null);this.el.turn.textContent='';this.el.res.textContent='';
    this.el.feed.innerHTML='<div class="dim">取組を始めるとここに戦闘が表示されます。</div>';
  },
  daysOf(m){return m.practice?0:Math.max(1,(GROUPS[m.gi]||{days:7}).days);},
  portrait(el,p,m){
    const box=el.querySelector('.portrait'),img=box.querySelector('img'),ph=box.querySelector('.ph');
    box.dataset.tier=m.practice?'norm':TOP_DIVS.includes(p.div)?'top':p.div==='戦士'?'sen':p.div==='闘士'?'toshi':'norm';
    const h=nameHue(p.name);
    ph.textContent=[...String(p.name).replace(/\s/g,'')][0]||'?';
    ph.style.background=`linear-gradient(135deg,hsl(${h},50%,62%),hsl(${(h+45)%360},50%,38%))`;
    const url=imgUrl(p.img);
    const showPh=()=>{img.hidden=true;ph.hidden=false;};
    const showImg=()=>{img.hidden=false;ph.hidden=true;};
    img.onload=showImg;img.onerror=showPh;
    if(!url){img.removeAttribute('src');showPh();return;}
    showPh();                                   // 読み込めるまでは頭文字の仮画像
    if(img.getAttribute('src')!==url)img.src=url;
    if(img.complete&&img.naturalWidth)showImg();
  },
  chips(el,p,m,full){
    const box=el.querySelector('.chips'),days=this.daysOf(m);
    if(!days){box.hidden=true;return;}
    box.hidden=false;
    const all=p.res||[];
    const done=full?all:all.slice(0,-1);        // 戦闘中は、この一番の結果をまだ見せない
    const n=Math.max(days,done.length+(full?0:1));
    let h='';
    for(let i=0;i<n;i++){
      const r=done[i];
      h+=r?`<span class="${r.w?'w':'l'}" data-s="${r.w?'W':'L'}">${r.w?'Win':'Lose'}</span>`:`<span${!full&&i===done.length?' class="now"':''}></span>`;
    }
    box.innerHTML=h;
  },
  setup(m,A,B){
    this.cur=m;
    $('stageBody').classList.remove('idle');
    this.el.gs.hidden=true;
    this.head(m);
    const put=(el,s,p)=>{
      const rk=el.querySelector('.rk');
      rk.textContent=m.practice?'(練習戦)':`(${rankLabel(p)})`;
      rk.style.setProperty('--dc',TOP_DIVS.includes(p.div)?'#ffc83d':(DIV_COLOR[p.div]||'#aaa'));
      el.querySelector('.nm').textContent=p.name;
      const mv=el.querySelector('.who .mv');mv.outerHTML=m.practice?'<span class="mv"></span>':(mvIcon(p)||'<span class="mv"></span>');
      const cl=COND_LABEL[s.base]||'普通';
      const ps=s.c/s.base;
      const place=ps>1.001?' ・得意場所':ps<0.999?' ・苦手場所':'';
      const sp=s.c>10?' ・超絶好調!':'';
      el.querySelector('.cond').textContent=cl+place+sp;
      el.querySelector('.cond').dataset.c=s.base;
      el.querySelector('.st').textContent=`体${fmt(p.hp)} 力${fmt(p.pw)} 守${fmt(p.gd)} IQ${p.iq}`;
      const tag=el.querySelector('.spt');
      const n=s.cmds.length;
      tag.hidden=!n;tag.textContent=n?`✦ 特殊能力(${n})`:'';
      el.querySelector('.vm').classList.toggle('off',!s.hasMeter);
      this.hp(el,s.hp,s.max);this.meter(el,0);
      el.classList.remove('win','lose','hit','cast');
      this.portrait(el,p,m);
      this.chips(el,p,m,false);
    };
    put(this.el.L,A,m.a);put(this.el.R,B,m.b);
    this.el.turn.textContent='開始';this.el.res.textContent='';this.el.feed.innerHTML='';
    // 次の取組の画像を先読みして、切り替え時のちらつきを減らす
    const Bs=S.basho,nx=!m.practice&&Bs.matches[Bs.mi];
    if(nx)for(const q of [nx.a,nx.b]){const u=imgUrl(q.img);if(u)(new Image()).src=u;}
  },
  hp(el,hp,max){
    const shown=Math.min(Math.max(0,hp),max);     // 一時的な体力増加は表示上は上限で止める
    const r=shown/max;
    const bar=el.querySelector('.bar i');
    bar.style.width=(r*100)+'%';
    bar.dataset.lv=r>.5?'hi':r>.2?'mid':'lo';
    el.querySelector('.hpt').textContent=`HP:${fmt(shown)}/${fmt(max)}`;
  },
  meter(el,v){
    if(v==null)return;
    const i=el.querySelector('.vm i');i.style.height=Math.min(100,v)+'%';
    i.dataset.full=v>=100?'1':'0';
  },
  log(txt,cls){
    const d=document.createElement('div');d.textContent=txt;if(cls)d.className=cls;
    this.el.feed.appendChild(d);
    while(this.el.feed.children.length>60)this.el.feed.removeChild(this.el.feed.firstChild);
    this.el.feed.scrollTop=this.el.feed.scrollHeight;
  },
  pop(el,txt,cls){
    const s=document.createElement('span');s.className='pop '+cls;s.textContent=txt;
    (el.querySelector('.portrait')||el).appendChild(s);
    setTimeout(()=>s.remove(),1100);
  },
  flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);},
  gameset(m,res){
    const part=(p)=>{
      const w=res.winner===p;
      const rec=m.practice?(w?'WIN':'LOSE'):`${p.w}勝${p.l}敗`;
      return `<div class="gsn ${w?'w':'l'}"><div class="n">${esc(p.name)}</div><div class="r">${rec}</div></div>`;
    };
    this.el.gs.innerHTML=part(m.a)+'<div class="gst">Game<br>Set!</div>'+part(m.b);
    this.el.gs.hidden=false;
  },
  finish(m,res){
    this.hp(this.el.L,res.A.hp,res.A.max);this.hp(this.el.R,res.B.hp,res.B.max);
    const W=res.win==='A'?this.el.L:this.el.R,Lo=res.win==='A'?this.el.R:this.el.L;
    W.classList.add('win');Lo.classList.add('lose');
    this.chips(this.el.L,m.a,m,true);this.chips(this.el.R,m.b,m,true);
    this.el.turn.textContent=`${res.turns}ターン`;
    this.el.res.textContent=`勝者 ${res.winner.name}`;
    this.gameset(m,res);
  }
};
const DELAY={1:1000,2:650,3:400,4:230,5:110};
function evClass(e){
  if(e.kind==='trig')return 'trig';
  if(e.kind==='fx')return 'fx';
  if(e.kind==='sp')return 'spk';
  if(e.kind==='hp')return e.delta>0?'heal':'fx';
  return e.type||'';
}
async function showBattle(m,res,animate){
  stage.setup(m,res.A,res.B);
  const ini={A:res.A.max,B:res.B.max};
  if(!animate){
    stage.log(`${m.a.name} vs ${m.b.name}`,'dim');
    for(const e of res.ev.slice(-8))stage.log(e.text,evClass(e));
    stage.finish(m,res);return;
  }
  UI.skip=false;
  for(const e of res.ev){
    if(UI.skip||UI.stop)break;
    const side=e.s==='A'?stage.el.L:stage.el.R;
    const tgtEl=(e.tgt||(e.s==='A'?'B':'A'))==='A'?stage.el.L:stage.el.R;
    stage.el.turn.textContent=`${e.t}ターン`;
    stage.log(e.text,evClass(e));
    stage.hp(stage.el.L,e.hpA,ini.A);stage.hp(stage.el.R,e.hpB,ini.B);
    stage.meter(stage.el.L,e.mA);stage.meter(stage.el.R,e.mB);
    let wait=DELAY[UI.speed];
    if(e.kind==='trig'){stage.flash(side,'cast');}
    else if(e.kind==='fx'){stage.pop(side,'✦','pf');wait*=.6;}
    else if(e.kind==='hp'){
      if(e.delta>0)stage.pop(tgtEl,'+'+fmt(e.delta),'pg');else{stage.pop(tgtEl,fmt(e.delta),'ph');stage.flash(tgtEl,'hit');}
    }
    else if(e.type==='miss')stage.pop(tgtEl,'MISS','pm');
    else{
      stage.pop(tgtEl,'-'+fmt(e.dmg),e.kind==='sp'?'ps':e.type==='crit'?'pc':'ph');
      if(e.kind==='sp')stage.pop(tgtEl,'Special!','pspec');
      else if(e.type==='crit')stage.pop(tgtEl,'Critical Hit!','pcrit');
      stage.flash(tgtEl,'hit');
    }
    await sleep(wait);
  }
  stage.finish(m,res);
  if(!UI.skip&&!UI.stop)await sleep(Math.max(900,DELAY[UI.speed]*2));   // Game Set表示を読める時間
}
