<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SE戦闘ゲームII</title>
<meta name="theme-color" content="#c78fe3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='225 195 675 665'%3E%3Cpath d='M605.4 241.4A290 290 0 1 0 829.6 620' fill='none' stroke='%23c78fe3' stroke-width='55'/%3E%3Ccircle cx='738' cy='427' r='118' fill='none' stroke='%23585858' stroke-width='56'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* SE CHARACTERS ロゴの配色: ラベンダー #c78fe3 / チャコール #585858 / 白 */
  --lav:#c78fe3;--gray:#585858;
  --bg:#faf6fe;--panel:#ffffff;--ink:#3b3542;--dim:#8a8296;--line:#eadff5;
  --accent:#9b57c9;--accent2:#8a4fb8;--on-accent:#fff;--btn1:#b476dc;--btn2:#9b57c9;
  --good:#1f9c78;--bad:#d9466f;--bar:#2f9e5a;--barmid:#d9a21b;--barlow:#c4372b;--chip:#f4ebfb;
  --shadow:0 6px 24px rgba(155,87,201,.12);--shadow-sm:0 2px 8px rgba(155,87,201,.10);
  --disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --latin:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1b1623;--panel:#251e31;--ink:#f0eaf6;--dim:#aaa0ba;--line:#3b3150;
  --accent:#d6a9f0;--accent2:#c995e8;--on-accent:#2a1740;--btn1:#d6a9f0;--btn2:#c78fe3;
  --gray:#c9c1d4;--good:#5fd4ae;--bad:#ff8aa8;--chip:#31283f;--shadow:0 6px 24px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.3);}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--lav) transparent}
[hidden]{display:none!important}
html,body{margin:0}
::selection{background:#e6cdf5;color:#3b3542}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
input[type=range],input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
body{background:
    radial-gradient(900px 520px at 108% -8%,rgba(199,143,227,.24),transparent 62%),
    radial-gradient(700px 440px at -12% 24%,rgba(199,143,227,.13),transparent 62%),
    var(--bg);background-attachment:fixed;
  color:var(--ink);font:14px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* ロゴの輪をモチーフにした背景の飾り */
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
body::before{right:-130px;bottom:-130px;width:400px;height:400px;border:46px solid var(--lav);opacity:.10}
body::after{left:-46px;bottom:90px;width:150px;height:150px;border:24px solid var(--gray);opacity:.045}
h1,h2,h3{font-family:var(--disp);margin:0}
h3{font-size:15px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:13px;height:13px;border:3.5px solid var(--lav);border-radius:50%;flex:none}
button,select,input{font:inherit;color:inherit}
button,.btn{padding:7px 15px;border:1px solid var(--line);background:var(--panel);border-radius:999px;cursor:pointer;display:inline-block;
  transition:border-color .15s,color .15s,transform .15s,box-shadow .15s,filter .15s}
button:hover:not(:disabled),.btn:hover{border-color:var(--lav);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:linear-gradient(135deg,var(--btn1),var(--btn2));border-color:transparent;color:var(--on-accent);font-weight:700;box-shadow:0 3px 10px rgba(155,87,201,.28)}
button.primary:hover:not(:disabled){color:var(--on-accent);border-color:transparent;filter:brightness(1.07)}
button.danger{color:var(--bad)}
button.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
select,input[type=search],input[type=text],input[type=number]{padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
select:focus,input[type=search]:focus,input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 3px rgba(199,143,227,.25)}
input[type=search],input[type=text]{width:100%}
.dim{color:var(--dim)} small{font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px 40px;position:relative;z-index:1}

/* ヘッダ */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:10px 0 12px;padding-top:max(10px,env(safe-area-inset-top,0px));box-shadow:0 6px 22px rgba(155,87,201,.10)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--lav),#ecd9f8 50%,var(--lav))}
.top .in{max-width:1180px;margin:0 auto;padding:0 12px;display:grid;gap:9px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none}
.brand .tt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand h1{font-size:22px;font-weight:900;letter-spacing:.05em}
.brand .wm{font-family:var(--latin);font-size:10.5px;font-weight:500;letter-spacing:.36em;color:var(--dim);margin-top:3px}
.status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.status div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 11px;min-width:0;box-shadow:var(--shadow-sm)}
.status small{display:block;color:var(--dim)}
.status b{display:block;font-family:var(--disp);font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.ctl .grow{flex:1}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.modes label{padding:6px 14px;cursor:pointer;transition:background .15s}
.modes input{display:none}
.modes label:has(input:checked){background:linear-gradient(135deg,var(--btn1),var(--btn2));color:var(--on-accent);font-weight:700}
#speedBox{display:inline-flex;align-items:center;gap:4px}
#bSnd{padding:7px 13px;font-weight:700}
#bSnd.off{opacity:.5;text-decoration:line-through}
#speed{width:80px}

/* バトルステージ(前作のUIをベースに刷新) */
.stage{margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.stagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stagehead h2{font-size:16px;font-weight:900;letter-spacing:.04em}
.duel{position:relative;border-radius:18px;overflow:hidden;padding:12px 10px 12px;color:#fff;
  background:var(--stage-bg,linear-gradient(180deg,#b79ef2 0%,#d8c3f6 54%,#f3e7fb 100%));background-size:cover;background-position:center}
.arena{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);gap:10px;align-items:start}
.side{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0;max-width:360px;width:100%;cursor:pointer;transition:opacity .25s}
#sideR{margin-left:auto}
.who{display:flex;align-items:baseline;justify-content:center;gap:4px;flex-wrap:wrap;background:rgba(74,46,106,.55);border-radius:12px;padding:3px 10px;text-align:center}
.who .rk{font-size:13px;font-weight:800;color:color-mix(in srgb,var(--dc,#ccc) 45%,#fff)}
.who .nm{font-size:clamp(16px,2.6vw,22px);font-weight:800;overflow-wrap:anywhere;text-shadow:0 1px 3px #0008}
.who .mv{font-size:15px;font-weight:900;color:#5dff9a}.who .mv.dn{color:#ff8a80}
.cond{text-align:center;font-size:12px;text-shadow:0 1px 3px #000a}
.cond:not(:empty){align-self:center;background:rgba(74,46,106,.6);border-radius:99px;padding:1px 12px;color:#fff;text-shadow:none}
.cond[data-c="fav"]{color:#ffe27a}.cond[data-c="bad"]{color:#ffc2cf}.cond[data-c="sup"]{color:#ffd23f;font-weight:700;box-shadow:0 0 10px rgba(255,157,0,.7)}
.nl .sup{margin-left:2px}
.hpt{text-align:center;font-weight:800;font-size:clamp(13px,2.2vw,18px);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000a}
.bar{height:18px;background:rgba(18,18,22,.88);border-radius:99px;overflow:hidden;border:2px solid #111}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(180deg,#9bff5a,#5fd23a);transition:width .25s}
.bar i[data-lv=mid]{background:linear-gradient(180deg,#ffd35a,#d9a21b)} .bar i[data-lv=lo]{background:linear-gradient(180deg,#ff6a5a,#c4372b)}
.portrait{position:relative;width:100%;aspect-ratio:1/1;border:6px solid var(--fr,#fff);background:#2a2433;border-radius:18px;overflow:visible;box-shadow:0 6px 16px rgba(74,46,106,.35)}
.pimg{border-radius:12px}
.portrait[data-tier=top]{--fr:#f7c948}.portrait[data-tier=sen]{--fr:#c9a6f0}.portrait[data-tier=toshi]{--fr:#8fdad3}
.portrait[data-tier=top]::before,.portrait[data-tier=top]::after{content:"✨";position:absolute;top:-17px;font-size:17px;animation:twk 1.6s infinite alternate;pointer-events:none}
.portrait[data-tier=top]::before{left:-8px}.portrait[data-tier=top]::after{right:-8px;animation-delay:.6s}
@keyframes twk{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
.pimg{position:absolute;inset:0;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
.pimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:clamp(48px,9vw,96px);font-weight:700;color:#ffffffd0;text-shadow:0 2px 8px #0006}
.vm{position:absolute;top:10%;bottom:10%;width:14px;background:rgba(18,18,22,.78);border:2px solid #111;border-radius:99px;overflow:hidden;transition:opacity .2s}
#sideL .vm{right:6px}#sideR .vm{left:6px}
.vm.off{opacity:.18}
.vm i{position:absolute;left:0;right:0;bottom:0;height:0;background:#3a1cff;transition:height .25s}
.vm i[data-full="1"]{background:#ff9d1c;animation:glow 1s infinite alternate}
.spt{align-self:center;font-size:11px;color:#ffe27a;border:1px solid #ffe27a;border-radius:99px;padding:0 10px;background:rgba(74,46,106,.5)}
.chips{display:flex;gap:2px}
.chips span{flex:1 1 0;min-width:0;height:26px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#454545;border:2px solid #1c1c1c;font-size:min(11px,2.5vw);font-weight:800;color:transparent}
.chips span.w{background:#f8dd55;border-color:#ee9a2c;color:#e98a14}
.chips span.l{background:#8c4fe0;border-color:#5a2ca8;color:#3a1478}
.chips span.now{border-color:#fff;animation:glow .7s infinite alternate}
.side .st{font-size:11px;text-align:center;text-shadow:0 1px 3px #000a}
.side.win .portrait{--fr:#ffd23f;box-shadow:0 0 0 3px #ffd23f66,0 3px 14px #0006}
.side.lose .pimg img,.side.lose .pimg .ph{filter:grayscale(.85) brightness(.75)}
.side.hit{animation:shake .28s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mid{text-align:center;padding-top:6px;text-shadow:0 2px 6px #0007}
#duelBasho{font-size:12px;opacity:.95;white-space:pre-line;line-height:1.35}
#duelDay.po{font-size:clamp(20px,2.4vw,26px);white-space:nowrap;letter-spacing:.06em}
#duelDay{font-size:clamp(26px,5vw,42px);font-weight:900;line-height:1.1;font-family:var(--disp)}
#duelSub{font-size:11px;opacity:.9}
.mid .vs{font-family:var(--disp);font-size:24px;color:#ffe27a;font-weight:800;margin-top:10px}
.mid .turn{font-size:12px} .mid .res{font-size:12px;font-weight:700;margin-top:4px}
/* 合い口(戦士以上同士の対戦成績) */
.aiai{display:inline-block;min-width:116px;margin:6px auto 0;padding:3px 12px 4px;border-radius:12px;background:rgba(74,46,106,.6);color:#fff;text-shadow:none;line-height:1.3}
.aiai small{display:block;font-size:10px;opacity:.85;letter-spacing:.08em}
.aiai .ab{font-family:var(--disp);font-weight:900;font-size:clamp(16px,2.4vw,20px);font-variant-numeric:tabular-nums;white-space:nowrap}
.aiai .ab b{font-weight:900;opacity:.75}.aiai .ab b.aw{color:#ffe27a;opacity:1}
.aiai .at{font-size:11px;font-weight:700;white-space:nowrap}
.aiai.upd{animation:glow .7s 2 alternate}
.aiaiP{margin:12px 0}
.race{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:12px 0}
.race h3{margin:0 0 6px}
.race .hd{margin:8px 0 2px;font-size:13px;font-weight:700}
.race .hd.lead{color:var(--accent2)}
.race ul{margin:2px 0 6px;padding-left:1.4em}
.race li{margin:2px 0}
.race li em{font-style:normal;color:var(--dim);font-size:12px;margin-left:6px}
/* 番付表: 東・西の欄の真ん中に番付を書く */
.bz{width:100%;table-layout:fixed;border-collapse:collapse}
.bz th,.bz td{white-space:normal}
.bz thead th{text-align:center;font-size:13px;letter-spacing:.3em}
.bz td.e,.bz td.w{padding:4px 8px;vertical-align:middle;overflow-wrap:anywhere}
.bz td.c{width:19%;text-align:center;font-family:var(--disp);font-weight:900;font-size:13px;color:var(--dc,var(--ink));background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.bz tr.dvs>td{border-top:2px solid var(--dc,var(--line))}
.bz .cell{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.bz td.e .cell{justify-content:flex-end;text-align:right}
.bz td.w .cell{justify-content:flex-start;text-align:left}
.bz .mt{font-size:11px;color:var(--dim);white-space:nowrap}
.bz .none{color:var(--dim);opacity:.5}
.aiaiP .pair{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:8px 0}
.aiaiP h4{margin:12px 0 4px;font-size:14px;font-family:var(--disp)}
.aiaiP .gl{display:flex;gap:8px;align-items:baseline;margin:3px 0;flex-wrap:wrap}
.aiaiP .gl>b{flex:none;min-width:5.5em;font-size:12px}
.aiaiP .gl.g>b{color:var(--good)}.aiaiP .gl.b>b{color:var(--bad)}
.aiaiP .chip{padding:2px 10px}.aiaiP .chip em{font-style:normal;color:var(--dim);font-size:12px}
.pop{position:absolute;right:8px;top:6px;font-weight:800;font-size:18px;pointer-events:none;animation:up .9s forwards;z-index:3;text-shadow:0 1px 3px #000c}
.pop.ph{color:#ff5a4d} .pop.pc{color:#ffb020;font-size:26px} .pop.pm{color:#e6e6e6;font-size:15px}
.pop.pcrit,.pop.pspec{left:0;right:0;top:auto;bottom:8px;text-align:center;font-size:clamp(20px,4.6vw,40px);font-weight:900;font-style:italic;
  color:transparent;background:linear-gradient(90deg,#ff3b3b,#c030d0);-webkit-background-clip:text;background-clip:text;text-shadow:none;-webkit-text-stroke:1.5px #fff;filter:drop-shadow(0 1px 2px #000c);animation-duration:1.1s}
.pop.pspec{background:linear-gradient(90deg,#ffd23f,#ff7a1c)}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
.gameset{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;
  padding:10px 14px;background:linear-gradient(90deg,rgba(84,52,128,.95),rgba(138,79,184,.95),rgba(84,52,128,.95));cursor:pointer;animation:gsin .35s}
@keyframes gsin{from{opacity:0;transform:translateY(-50%) scaleY(.2)}to{opacity:1;transform:translateY(-50%) scaleY(1)}}
.gsn{text-align:center;min-width:0}
.gsn .n{font-size:clamp(13px,2.6vw,24px);font-weight:800;overflow-wrap:anywhere}
.gsn .r{font-size:clamp(20px,5vw,44px);font-weight:900;line-height:1.1}
.gsn.w{color:#ffe27a;text-shadow:0 1px 4px #0006}.gsn.l{color:#c8c8c8}
.gsb{margin-top:6px;font-size:clamp(12px,2.2vw,18px);font-weight:700;font-variant-numeric:tabular-nums}.gsb b{font-size:1.3em;color:#ffe27a}
/* 名札(プレート): 対戦画面の名前欄(.who)に装備中のものを反映。豪華なほど派手に */
.who.pl-wood{background:repeating-linear-gradient(92deg,#8a5a2b 0 9px,#7a4c22 9px 13px,#9a6a35 13px 22px);border:2px solid #4a2c12;color:#fff6e0}
.who.pl-silver{background:linear-gradient(135deg,#f4f7fb,#b9c2cc 45%,#eef2f7 60%,#9aa5b1);border:2px solid #7d8794;color:#1d2530}
.who.pl-silver .nm,.who.pl-silver .rk{text-shadow:none}
.who.pl-ruby{background:linear-gradient(135deg,#7a0a14,#d7263d 50%,#5a0710);border:2px solid #ffb3b3;box-shadow:0 0 12px #ff4d4d88;color:#fff}
.who.pl-gold{background:linear-gradient(120deg,#8a6a12,#ffd95a 40%,#fff3b0 50%,#c8961e 70%,#7d5a0c);border:2px solid #fff0a0;box-shadow:0 0 14px #ffd95a99;color:#2a1a00}
.who.pl-gold .nm,.who.pl-gold .rk{text-shadow:none}
.who.pl-rainbow{background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff,#ff6b6b);background-size:300% 100%;animation:plShine 4s linear infinite;border:2px solid #fff;box-shadow:0 0 16px #c77dffaa;color:#1a1030}
.who.pl-rainbow .nm{text-shadow:0 0 3px #fff}
.who.pl-king{background:linear-gradient(135deg,#0d0d0d,#2a2a2a 50%,#0d0d0d);border:2px solid #ffd45c;box-shadow:0 0 0 2px #0008,0 0 18px #ffd45c88;color:#ffe27a}
.who.pl-king .nm,.who.pl-king .rk{color:#ffe27a}
@keyframes plShine{from{background-position:0% 50%}to{background-position:100% 50%}}
.shop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.shop-item>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.shop-prev{align-self:flex-start;display:inline-flex;padding:3px 12px}
.who .np,.who .nq{font-size:.6em;font-weight:800;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2);color:#fff8dc;white-space:nowrap}
.who.pl-silver .np,.who.pl-silver .nq,.who.pl-gold .np,.who.pl-gold .nq{background:rgba(0,0,0,.12);color:inherit}
.nick-edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.nick-edit input{width:9em}
.nick-prev{width:100%;font-size:13px}
.fxlayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}
.fx-canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(28px,6vw,64px);font-weight:900;color:#ffe27a;text-shadow:0 3px 0 #7a3fb0,0 0 18px #000a;animation:fxBanner 3.2s ease forwards;opacity:0}
@keyframes fxBanner{0%{opacity:0;transform:scale(1.5)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.fx-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fxFlash 1.2s ease-out 2}
@keyframes fxFlash{0%{opacity:0}8%{opacity:.85}30%{opacity:0}100%{opacity:0}}
.fx-bolts{position:absolute;inset:0;width:100%;height:100%}
.fx-bolt{fill:none;stroke:#fff8c4;stroke-width:1.4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #ffe066);opacity:0;animation:fxBolt .9s steps(2) 2}
@keyframes fxBolt{0%{opacity:0}10%{opacity:1}40%{opacity:.2}60%{opacity:1}100%{opacity:0}}
.fx-petal{position:absolute;top:-24px;width:12px;height:9px;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#ffe3ec,#f7a8c0);opacity:.95;animation-name:fxPetal;animation-timing-function:linear;animation-fill-mode:both}
@keyframes fxPetal{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--sw),calc(100vh + 60px)) rotate(var(--rot))}}
.fx-zab{position:absolute;left:50%;bottom:14%;width:58px;height:58px;margin-left:-29px;border-radius:9px;background:radial-gradient(circle at 40% 35%,#d9432f,#9e1f14 70%);border:3px solid #ffd45c;box-shadow:inset 0 0 0 3px #7a1208,0 4px 10px #0007;opacity:0;animation:fxZab 1.7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxZab{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.gst{font-size:clamp(26px,6vw,56px);font-weight:900;line-height:.95;text-align:center;color:#fff;text-shadow:0 2px 0 #7a3fb0,0 0 14px #0006}
.feed{margin-top:12px;height:116px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-size:12.5px}
.feed .crit{color:#e08a00;font-weight:700} .feed .miss{color:var(--dim)}
.idle .arena{opacity:.45}
.pfimg{display:block;width:100%;max-width:220px;aspect-ratio:1/1;object-fit:cover;border-radius:18px;margin:8px auto;border:4px solid var(--line)}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tabs button{padding:7px 17px}
.tabs button.on{background:linear-gradient(135deg,var(--btn1),var(--btn2));border-color:transparent;color:var(--on-accent);font-weight:700;box-shadow:0 3px 10px rgba(155,87,201,.3)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:240px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

.mlist{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:16px}
.m{display:grid;grid-template-columns:62px 1fr 22px 20px 22px 1fr 62px;gap:4px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--line);font-size:13px}
.mlist>.m:last-child{border-bottom:none}
.m .r{font-size:11px;color:var(--dim)} .m .r:last-child{text-align:right}
.m a.nl:last-of-type{text-align:right}
.m i{font-style:normal;color:var(--dim);font-size:11px;text-align:center}
.m b{text-align:center}.m b.w{color:var(--good)}.m b.x{color:var(--dim)}
.m.cur{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:2px solid var(--accent);outline-offset:-2px}
/* 検索タブ用: 行が1要素のとき */
#tab_search .m{grid-template-columns:70px 1fr auto}
a.nl{color:inherit;cursor:pointer;text-decoration:underline dotted var(--dim);text-underline-offset:3px;overflow-wrap:anywhere}
a.nl:hover{color:var(--accent)}

.tbl{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:16px}
.tbl.small{max-height:220px;margin:8px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td:nth-child(3){white-space:normal}
th{position:sticky;top:0;background:var(--chip);font-size:12px;color:var(--accent2)}
.up{color:var(--good)} .dn{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:16px;padding:9px 12px;background:var(--bg)}
.card small{display:block} .card b{font-family:var(--disp);font-size:16px;display:block}
.chg{margin:0;padding-left:20px;font-size:13px}
ol.rk{margin:0;padding-left:22px}
.logbox{max-height:520px;overflow:auto;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.logbox div{padding:1px 0;border-bottom:1px dashed var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:99px;padding:3px 6px 3px 10px;display:inline-flex;gap:4px;align-items:center}
.chip button{padding:0 6px;border-radius:99px;border:none;background:transparent}
.set{margin:10px 0}.set.btns{display:flex;gap:8px;flex-wrap:wrap}
.memo{font-size:13px;color:var(--dim);padding-left:20px}

dialog{border:none;border-radius:26px;background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 24px);padding:20px;box-shadow:0 24px 70px rgba(60,30,90,.38)}
dialog::backdrop{background:rgba(50,30,70,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog h2{font-size:22px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:7px 10px}
.stats small{display:block;color:var(--dim)} .stats b{font-size:16px}
.sb{display:block;height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:3px}
.sb i{display:block;height:100%;background:var(--accent2)}
code{font-size:11px;word-break:break-all}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);
  padding:10px 20px;border-radius:99px;box-shadow:0 8px 24px rgba(60,30,90,.3);opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}


/* メーター・特殊能力 */
.mt{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--dim)}
.mbar{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.mbar i{display:block;height:100%;width:0;background:#8b7be0;transition:width .25s}
.mbar i[data-full="1"]{background:#e08a00;animation:glow 1s infinite alternate}
@keyframes glow{from{opacity:.65}to{opacity:1}}
.spt{display:inline-block;margin-top:4px;font-size:11px;color:var(--accent2);border:1px solid var(--accent2);border-radius:99px;padding:0 8px}
.side.cast .portrait{animation:cast .7s}
@keyframes cast{0%{box-shadow:0 0 0 0 #e08a0099}60%{box-shadow:0 0 0 12px #e08a0000}100%{box-shadow:none}}
.pop.ps{color:#ff6a3d;font-size:28px} .pop.pg{color:#6dff9c;font-size:20px} .pop.pf{color:#bcd4ff;font-size:16px}
.feed .trig{color:#e08a00;font-weight:800} .feed .fx{color:#4a7fd1} .feed .spk{color:#c0301f;font-weight:700} .feed .heal{color:var(--good)}
.duel .spt{margin-top:0;color:#fff;border-color:rgba(255,255,255,.75);background:rgba(74,46,106,.6)}
a.btn{color:var(--ink);text-decoration:none}
/* Supabase 大会結果送信パネル */
.sbx{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--lav);border-radius:16px;padding:8px 14px;box-shadow:var(--shadow-sm);font-size:13px}
.sbx.err{border-left-color:var(--bad)}
.sbx .bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;margin:6px 0}
.sbx .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--btn1),var(--btn2));transition:width .2s}
.sbx ul{margin:4px 0;padding-left:1.4em}.sbx li{margin:1px 0}
.sp{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin:8px 0}
.sp ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.sp li.gate{color:var(--accent2)} .sp li.atk{color:#c0301f}
.sp details{margin-top:4px}

@media(max-width:720px){
  .top{padding:7px 0 9px}.top .in{gap:6px}
  .brand .logo{width:38px;height:38px}.brand h1{font-size:19px}
  .status{gap:5px}.status div{padding:3px 9px;border-radius:12px}.status b{font-size:14px}
  .ctl{gap:5px}.ctl button{padding:5px 12px;font-size:13px}.modes label{padding:5px 12px;font-size:13px}
  .tabs button{padding:6px 13px}
  .status{grid-template-columns:repeat(3,minmax(0,1fr))}
  .aiai{margin:0}
  .arena{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;order:-1;padding:0;display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:center;align-items:baseline}.mid .vs{margin-top:0;font-size:18px}.vm{width:11px}
  .who{min-height:50px;align-content:center}
  .chips span{height:24px}.chips span.w,.chips span.l{font-size:0}.chips span.w::after,.chips span.l::after{content:attr(data-s);font-size:12px}
  .m{grid-template-columns:1fr 20px 18px 20px 1fr}.m .r{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg class="logo" viewBox="225 195 675 665" role="img" aria-label="SE CHARACTERS"><path d="M605.4 241.4A290 290 0 1 0 829.6 620" fill="none" stroke="#c78fe3" stroke-width="55"/><circle cx="738" cy="427" r="118" fill="none" style="stroke:var(--gray)" stroke-width="56"/></svg><div class="tt"><h1>SE戦闘ゲームII</h1><span class="wm">SE CHARACTERS</span></div></div>
  <div class="status">
    <div><small>大会</small><b id="stNo">-</b></div>
    <div><small>開催地</small><b id="stPlace">-</b></div>
    <div><small>日程</small><b id="stDay">-</b></div>
    <div><small>残り取組</small><b id="stLeft">-</b></div>
    <div><small>総合優勝</small><b id="stChamp">-</b></div>
  </div>
  <div class="ctl">
    <button class="primary" id="bOne">▶ 次の1番</button>
    <button id="bDay">今日を進める</button>
    <button id="bBasho">大会を最後まで</button>
    <button id="bAuto">▶ 自動で進める</button>
    <button class="danger" id="bStop" hidden>■ 停止</button>
    <button class="primary" id="bNext" hidden>次の大会へ ▶</button>
    <button id="bUpd" title="スプレッドシートから最新のキャラクターデータを取得">⟳ データ更新</button>
    <span class="grow"></span>
    <button id="bSnd" title="BGM・効果音のオン/オフ">♪</button>
    <div class="modes" title="戦闘の見せ方">
      <label><input type="radio" name="mode" value="fast">高速</label>
      <label><input type="radio" name="mode" value="anim">観戦</label>
    </div>
    <span id="speedBox">速さ<input type="range" id="speed" min="1" max="5" step="1" value="3"></span>
  </div>
  <div class="sbx" id="sbBox" hidden></div>
</div></header>

<main class="wrap">
  <section class="stage" id="stageBody">
    <div class="stagehead"><h2>本日の一番</h2><span><small class="dim" id="stNext"></small> <button id="bSkip">スキップ</button></span></div>
    <div class="duel" id="duel">
      <div class="arena">
        <div class="side" id="sideL"></div>
        <div class="mid"><div id="duelBasho"></div><div id="duelDay"></div><div id="duelSub"></div><div class="vs">VS</div><div class="aiai" id="duelAiai" hidden></div><div class="turn" id="turn"></div><div class="res" id="res"></div></div>
        <div class="side" id="sideR"></div>
      </div>
      <div class="gameset" id="gameset" hidden></div>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <nav class="tabs">
    <button data-tab="matches">取組</button>
    <button data-tab="banzuke">番付</button>
    <button data-tab="standings">成績</button>
    <button data-tab="titles">優勝</button>
    <button data-tab="search">検索・観戦</button>
    <button data-tab="shop">ショップ</button>
    <button data-tab="duel">練習戦</button>
    <button data-tab="log">ログ</button>
    <button data-tab="settings">設定</button>
  </nav>
  <div class="pane" id="tab_matches"></div>
  <div class="pane" id="tab_banzuke" hidden></div>
  <div class="pane" id="tab_standings" hidden></div>
  <div class="pane" id="tab_titles" hidden></div>
  <div class="pane" id="tab_search" hidden></div>
  <div class="pane" id="tab_shop" hidden></div>
  <div class="pane" id="tab_duel" hidden></div>
  <div class="pane" id="tab_log" hidden></div>
  <div class="pane" id="tab_settings" hidden></div>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast"></div>

/* =====================================================================
   エンジン部(画面に依存しない)
   - 戦闘式: TurboWarp版「対戦処理」を移植
   - 番付スコア: TurboWarp版「番付編成」の評価点テーブルを移植
   - 昇進ルール: 旗頭→先鋒→副将→大将
   ===================================================================== */
const PLACES=[
  {key:'舞愛',name:'舞愛'},{key:'御卦原',name:'みけ原'},{key:'エアロ',name:'エアロ'},
  {key:'三花',name:'三花'},{key:'ブルテ',name:'ブルテ'},{key:'檸檬',name:'檸檬'}
];
/* 得意場所・苦手場所の表記ゆれを、開催地のkeyにそろえる。
   戻り値: key(認識できた) / ''(空欄・なし・(null)) / null(認識できない表記) */
function placeKey(s){
  const t=String(s==null?'':s).replace(/[\s\u3000]/g,'');
  if(t===''||t==='なし'||t==='(null)'||t==='null')return '';
  const p=PLACES.find(x=>x.key===t||x.name===t);
  return p?p.key:null;
}
function placeLabel(key){const p=PLACES.find(x=>x.key===key);return p?p.name:(key||'');}
/* 大会は年6回。PLACESの並びがそのまま 1・3・5・7・9・11月 の開催地に対応(7回目は2年目1月大会) */
const TOURN_MONTHS=[1,3,5,7,9,11];
function tYear(no){return Math.floor((no-1)/TOURN_MONTHS.length)+1;}
function tMonth(no){return TOURN_MONTHS[(no-1)%TOURN_MONTHS.length];}
function tName(no){return `${tYear(no)}年目${tMonth(no)}月大会`;}
const HYO=[-13,-9,-5,-2,2,5,10,15];       // 評価点(7日制・番付37未満)
const MID=[-13,-9,-5,5,10,15];            // 評価値(中位)
const LOW=[-20,-12,-5,5,20,30];           // 評価値(下位)
const LOWEST=[0,2,5,10,20,30];            // 評価値(最下位)
const PRE=[0,2,5,7,9,12];                 // 前相撲評価点
const SUPER_BOOST=0.5;     // 超絶好調: 調子値に+0.5(+50%)。基本値×得意苦手補正のあとに加算
const SUPER_PROB_DEF=1;    // 大会前の抽選確率(%)の初期値
const TOP_NAMES={1:'大将',2:'副将',3:'先鋒',4:'旗頭'};
const TOP_DIVS=['大将','副将','先鋒','旗頭'];
const LAYOUT=[['戦士',5,34],['闘士',22,30],['上等兵',37,80],['一等兵',77,150]]; // [名称,開始番号,定員(2人1枚)]
const LOW_START=152, THIRD_COUNT=68;
const GROUPS=[
  {key:'総合',label:'総合優勝',divs:['大将','副将','先鋒','旗頭','戦士'],days:7},
  {key:'闘士',label:'闘士優勝',divs:['闘士'],days:7},
  {key:'上等兵',label:'上等兵優勝',divs:['上等兵'],days:5},
  {key:'一等兵',label:'一等兵優勝',divs:['一等兵'],days:5},
  {key:'二等兵',label:'二等兵優勝',divs:['二等兵'],days:5},
  {key:'三等兵',label:'三等兵優勝',divs:['三等兵','前相撲'],days:5},
];
const DIV_COLOR={大将:'#b3261e',副将:'#c4551b',先鋒:'#b8892b',旗頭:'#7d6a2c',戦士:'#2457a6',闘士:'#1f7a78',上等兵:'#6a4fa3',一等兵:'#5e6b7a',二等兵:'#85745a',三等兵:'#9a8f80',前相撲:'#a3a3a3'};

const S={people:[],byId:new Map(),basho:null,history:[],logs:[],thirdStart:0,
  settings:{soundOn:true,bgmVol:60,seVol:80,superOn:true,superProb:1,special:true,gateHp:true,mmT6:40,mmF5:20,mmF6:50}};

function L(msg){S.logs.push(msg);if(S.logs.length>400)S.logs.shift();}
function norm(x){return (x==='(null)'||x==='なし'||x==null)?'':x;}
/* 画像URL: GitHubの表示ページ(.../blob/main/xxx.png)は画像ファイルではないので、直接読み込める raw 形式に変換する */
function imgUrl(u){
  u=norm(String(u==null?'':u).trim());
  if(!u)return '';
  const m=u.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/(?:blob|raw)\/(.+)$/);
  if(m)return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
  return /^https?:\/\//.test(u)?u:'';
}

/* ---------- データ初期化 ---------- */
function mkPerson(r){
  return {id:r[0],name:r[1],hp:r[2],pw:r[3],gd:r[4],iq:r[5],ab:r[6],rk:r[7],
    fav:placeKey(norm(r[8]))||'',bad:placeKey(norm(r[9]))||'',inc:r[10],cmd:r[11]||'',pre:!!r[12],com:r[13]||0,gaku:r[14]||0,img:imgUrl(r[15]),
    div:'',slot:0,ord:NaN,pk:0,w:0,l:0,met:[],res:[],rec:[],titles:[],tsuna:false,demoted:false,money:0,plates:[],plate:'',boost:{},effects:[],effect:'',nick:null};
}
function initPeople(rows){
  rows=rows||DATA;
  S.people=rows.map(mkPerson);
  S.byId=new Map(S.people.map(p=>[p.id,p]));
  S.retired={};S.aiai={};
  const rest=[];
  for(const p of S.people){
    if(p.pre){p.div='前相撲';p.slot=9999;}
    else if(p.rk>=1&&p.rk<=4){p.div=TOP_NAMES[p.rk];p.slot=p.rk;}
    else rest.push(p);
  }
  rest.sort((a,b)=>a.rk-b.rk||b.ab-a.ab||a.id-b.id);
  layout(rest);
  normalizeTopOrd();     // 大将〜旗頭の最初の並びは、能力評価値の高い順
  S.people.forEach(p=>p.pk=p.slot);
  S.history=[];S.logs=[];
  startBasho(1);
}
/* 成績クリア: 累計の勝敗(大会ごとの記録)と優勝歴を0に戻す。
   番付の位置・大会の進行・キャラクターデータ・設定は変えない(番付サーバーとずれないように)。 */
function clearCareer(){
  S.people.forEach(p=>{p.rec=[];p.titles=[];});
  S.history=[];
  L('成績をクリアしました(累計勝敗・優勝回数を0に戻しました)');
}
function nameKey(s){return String(s).replace(/[\s\u3000]/g,'');}
function pname(id){const p=S.byId.get(id);return p?p.name:(S.retired[id]||'(不明)');}
/* キャラクターデータの更新を進行中のゲームへ反映する(大会の合間のみ呼ぶこと)。
   rows: [id,名前,体力,パワー,ガード,IQ,能力評価値,初期番付,得意,苦手,収入,特殊能力,前相撲] */
function applyRoster(rows){
  const B=S.basho;
  const keep=new Set(),added=[],removed=[];
  for(const r of rows){
    const p=S.byId.get(r[0]);   // IDで照合(IDはスプレッドシートのID列が正)
    if(p){
      keep.add(p);
      p.name=r[1];p.hp=r[2];p.pw=r[3];p.gd=r[4];p.iq=r[5];p.ab=r[6];
      p.fav=placeKey(norm(r[8]))||'';p.bad=placeKey(norm(r[9]))||'';p.inc=r[10];p.cmd=r[11]||'';p.com=r[13]||0;p.gaku=r[14]||0;p.img=imgUrl(r[15]);
    }else{
      const np=mkPerson(r);
      np.div='前相撲';np.slot=9999;np.ord=0;np.pre=true;np.pk=9999;
      S.people.push(np);keep.add(np);added.push(np);
    }
  }
  for(const p of S.people)if(!keep.has(p)){removed.push(p);S.retired[p.id]=p.name;}
  S.people=S.people.filter(p=>keep.has(p));
  S.byId=new Map(S.people.map(p=>[p.id,p]));
  // 空いた枠を詰めて番付を再配置(大将〜旗頭と前相撲は据え置き)
  const nonTop=S.people.filter(p=>!p.pre&&!TOP_DIVS.includes(p.div));
  layout(nonTop.slice().sort(bzCmp));     // 東西の並びを保ったまま、空いた枠を詰める
  normalizeTopOrd();
  S.people.forEach(p=>{p.pk=rankSortKey(p);});
  // 表示中の取組から、いなくなった人を外す
  B.matches=B.matches.filter(m=>S.byId.has(m.a.id)&&S.byId.has(m.b.id));
  if(B.mi>B.matches.length)B.mi=B.matches.length;
  B.byes=B.byes.filter(p=>S.byId.has(p.id));
  L(`キャラデータ更新: 追加${added.length}人 / 整理${removed.length}人 / 現在${S.people.length}人`);
  return {added,removed};
}

/* 並び順(良い順)から番付枠へ流し込む。1枚につき2人(東西) */
function layout(list,fromDiv){
  let idx=0;
  const fi=fromDiv?LAYOUT.findIndex(x=>x[0]===fromDiv):0;
  for(const [name,start,cap] of LAYOUT.slice(Math.max(0,fi))){
    for(let k=0;k<cap&&idx<list.length;k++,idx++){
      const p=list[idx];p.div=name;p.slot=start+Math.floor(k/2);p.ord=idx;p.pre=false;p.demoted=false;   // ordは東西の並び(小さいほうが東)
    }
  }
  const rest=list.slice(idx),n=rest.length,ord0=idx;
  let third=Math.min(THIRD_COUNT,n);
  if((n-third)%2)third++;
  third=Math.min(third,n);
  S.thirdStart=LOW_START+Math.floor((n-third)/2);
  rest.forEach((p,k)=>{
    p.slot=LOW_START+Math.floor(k/2);p.ord=ord0+k;
    p.div=k<n-third?'二等兵':'三等兵';
    p.pre=false;p.demoted=false;
  });
  S.maxSlot=LOW_START+Math.ceil(n/2);
}
function slotBase(div){
  if(div==='二等兵')return LOW_START-1;
  if(div==='三等兵')return S.thirdStart-1;
  const e=LAYOUT.find(x=>x[0]===div);return e?e[1]-1:0;
}
/* ---------- 番付表の並び(東西) ----------
   大将・副将・先鋒・旗頭: 同じ番付の中の順位が p.ord(0から)。東→西→次の行の東…の順に埋める。
   戦士以下: 1枚(slot)に東と西の2人。ordが小さいほうが東。 */
function bzCmp(a,b){
  const pa=a.div==='前相撲',pb=b.div==='前相撲';
  if(pa!==pb)return pa?1:-1;
  if(pa)return b.ab-a.ab||a.id-b.id;
  return a.slot-b.slot||(a.ord-b.ord)||a.id-b.id;
}
/* 大将〜旗頭の並びを0,1,2…に詰め直す(ordが未設定の人は能力評価値の高い順) */
function normalizeTopOrd(){
  const o=p=>Number.isFinite(p.ord)?p.ord:1e9;
  for(const div of TOP_DIVS){
    S.people.filter(p=>p.div===div).sort((a,b)=>o(a)-o(b)||b.ab-a.ab||a.id-b.id).forEach((p,i)=>{p.ord=i;});
  }
}
/* 古いセーブデータなど、並び順が無いときの補完 */
function ensureOrd(){
  if(S.people.some(p=>p.div!=='前相撲'&&!Number.isFinite(p.ord))){
    sortRank(S.people.filter(p=>!TOP_DIVS.includes(p.div)&&p.div!=='前相撲')).forEach((p,i)=>{p.ord=i;});
  }
  S.people.forEach(p=>{if(p.div==='前相撲'&&!Number.isFinite(p.ord))p.ord=0;});
  normalizeTopOrd();
}
function rankLabel(p){
  if(p.div==='前相撲')return '前相撲';
  if(TOP_DIVS.includes(p.div))return p.div;
  return p.div+(p.slot-slotBase(p.div));
}
function groupIndex(p){return GROUPS.findIndex(g=>g.divs.includes(p.div));}
function rankSortKey(p){return p.div==='前相撲'?99999:p.slot;}

/* ---------- 大会の進行 ---------- */
function startBasho(no){
  S.people.forEach(p=>{p.w=0;p.l=0;p.met=[];p.res=[];});
  S.basho={no,place:PLACES[(no-1)%PLACES.length],day:0,matches:[],mi:0,phase:'ready',
    titles:null,playoffs:[],byes:[],supers:rollSupers()};
  if(S.basho.supers.length)L(`${tName(no)} 超絶好調: ${S.basho.supers.map(id=>pname(id)).join('、')}`);
}
/* 大会前に全員が抽選。当たった人はその大会中ずっと超絶好調(調子値+0.5) */
function superProb(){const v=+S.settings.superProb;return Number.isFinite(v)&&S.settings.superProb!==''&&S.settings.superProb!=null?Math.max(0,Math.min(100,v)):SUPER_PROB_DEF;}
function rollSupers(){
  if(S.settings.superOn===false)return [];
  const pr=superProb();
  return S.people.filter(()=>Math.random()*100<pr).map(p=>p.id);
}
function isSuper(p){const B=S.basho;return !!(B&&B.supers&&B.supers.includes(p.id));}
function maxDays(){return 7;}
function met(a,b){return a.met.includes(b.id);}
function ordKey(p){return rankSortKey(p)*10000-p.ab;}   // 小さいほど上位
function sortRank(list){return list.slice().sort((a,b)=>ordKey(a)-ordKey(b)||a.id-b.id);}

/* =====================================================================
   取組編成エンジン(取組編成ロジック仕様表 v1.1 準拠)
   処理の流れ(仕様書§21):
     出場者取得 → 固定対戦(7日目) → ハード禁止判定 isMatchAllowed
     → 解禁抽選 → rank_fit/record_fit → 重要対戦ボーナス・再戦ペナルティ
     → 全体マッチング(個別に最善手を選ばず、ペア全体の合計点を最大化)
   ===================================================================== */
const MM={
  // 基本ウェイト [番付適合度, 成績適合度] ×日数(仕様書§6)。キーはClass(1:大将 2:副将・先鋒・旗頭 3:戦士 4:闘士 5:上等兵以下)
  W:{
    1:[[90,10],[85,15],[80,20],[70,30],[55,45],[35,65],[20,80]],
    2:[[85,15],[80,20],[75,25],[65,35],[50,50],[35,65],[20,80]],
    3:[[65,35],[60,40],[55,45],[50,50],[45,55],[30,70],[20,80]],
    4:[[55,45],[50,50],[45,55],[40,60],[30,70],[20,80],[10,90]],
    5:[[60,40],[50,50],[40,60],[25,75],[10,90]]
  },
  REC_FIT:[100,75,45,20,5],                                   // 勝ち数差0,1,2,3,4以上(§8)
  RANK_FIT:[[2,100],[5,90],[10,75],[20,55],[30,35],[50,20]],  // 番付距離の上限→適合度。51以上は5(§9)
  ADJ:70, FAR:25,                                             // 隣接クラス / 2クラス以上離れ(§10)
  // 重要対戦ボーナス(§18)。T=大将 F=副将 S=先鋒
  BONUS:{TT:{5:70,6:90,7:200},TF:{5:50,6:75,7:120},FF:{5:50,6:75,7:110},
         TS:{5:30,6:45,7:70},FS:{5:25,6:40,7:60},SS:{5:20,6:35,7:50}},
  REMATCH1:-1000, REMATCH2:-3000,                             // 再戦ペナルティ(§19)
  NOISE:3,                                                    // ランダム補正 ±3(§23)
  RESTARTS:4,
  DEF:{mmT6:40,mmF5:20,mmF6:50}                               // 解禁確率の初期値(%)(§14,§15)。設定画面で変更可
};
const isTaisho=p=>p.div==='大将';
const isFukusho=p=>p.div==='副将';
const isSenpo=p=>p.div==='先鋒';
const isHatagashira=p=>p.div==='旗頭';
const isSanyakuUp=p=>isTaisho(p)||isFukusho(p)||isSenpo(p);      // 先鋒以上
const isTaishoOrFukusho=p=>isTaisho(p)||isFukusho(p);
function topKind(p){return p.div==='大将'?'T':p.div==='副将'?'F':p.div==='先鋒'?'S':'';}
function mmClass(p){
  switch(p.div){
    case '大将':return 1;
    case '副将':case '先鋒':case '旗頭':return 2;
    case '戦士':return 3;
    case '闘士':return 4;
    default:return 5; // 上等兵・一等兵・二等兵・三等兵・前相撲
  }
}
function mmProb(key){const v=+S.settings[key];return Number.isFinite(v)&&S.settings[key]!==''&&S.settings[key]!=null?Math.max(0,Math.min(100,v)):MM.DEF[key];}
function topPairKey(a,b){
  const ka=topKind(a),kb=topKind(b);if(!ka||!kb)return '';
  const o={T:0,F:1,S:2};return o[ka]<=o[kb]?ka+kb:kb+ka;
}

/* その日・その取組グループの文脈(大将/副将の人数と解禁抽選結果) */
function mmContext(list,day,notes){
  const nT=list.filter(isTaisho).length,nF=list.filter(isFukusho).length;
  const ul={T6:false,F5:false,F6:false,info:[]};
  const lot=(flag,label,key)=>{
    const p=mmProb(key),ok=Math.random()*100<p;ul[flag]=ok;
    const s=`${label} 解禁確率${p}% → ${ok?'解禁':'解禁せず'}`;ul.info.push(s);notes&&notes.push(s);
  };
  if(nT>=3&&day===6)lot('T6','大将3人以上・6日目','mmT6');
  if(nF>=3&&day===5)lot('F5','副将3人以上・5日目','mmF5');
  if(nF>=3&&day===6)lot('F6','副将3人以上・6日目','mmF6');
  return {nT,nF,unlock:ul};
}

/* isMatchAllowed の本体: 許可なら null、禁止なら理由の文字列を返す(§12〜§16,§25) */
function mmHard(a,b,day,ctx){
  const k=topPairKey(a,b);if(!k)return null;            // 先鋒以上同士でなければ制限なし
  if(day<=3)return '先鋒以上同士は1〜3日目禁止';
  if(k==='TT'){
    if(ctx.nT===2)return day===7?null:'大将2人: 大将同士は7日目に固定(温存)';
    if(day<=5)return `大将${ctx.nT}人: 大将同士は1〜5日目禁止`;
    if(day===6)return ctx.unlock.T6?null:`大将${ctx.nT}人: 6日目の解禁抽選に外れ`;
    return null;
  }
  if(k==='FF'){
    if(ctx.nF===2)return day===7?null:'副将2人: 副将同士は7日目に固定(温存)';
    if(day<=4)return `副将${ctx.nF}人: 副将同士は1〜4日目禁止`;
    if(day===5)return ctx.unlock.F5?null:`副将${ctx.nF}人: 5日目の解禁抽選に外れ`;
    if(day===6)return ctx.unlock.F6?null:`副将${ctx.nF}人: 6日目の解禁抽選に外れ`;
    return null;
  }
  if(k==='TF')return day<=4?'大将↔副将は1〜4日目禁止':null;
  return null;                                           // 大将/副将/先鋒↔先鋒は4日目から解禁
}
function isMatchAllowed(a,b,day,ctx){return mmHard(a,b,day,ctx)===null;}

/* 通常スコア(§7〜§10,§18,§19)。禁止判定は呼び出し側で先に行うこと */
function mmEval(a,b,day,ctx){
  const ca=mmClass(a),cb=mmClass(b);
  let rf,dist=null;
  if(ca!==cb)rf=Math.abs(ca-cb)===1?MM.ADJ:MM.FAR;
  else{dist=Math.abs(a.slot-b.slot);rf=5;for(const [mx,v] of MM.RANK_FIT)if(dist<=mx){rf=v;break;}}
  const diff=Math.abs(a.w-b.w),cf=MM.REC_FIT[Math.min(diff,MM.REC_FIT.length-1)];
  const tbl=MM.W[Math.min(ca,cb)],[rw,cw]=tbl[Math.min(day,tbl.length)-1];   // 上位クラス側の表を使う
  const base=(rf*rw+cf*cw)/100;
  const k=topPairKey(a,b);
  const bonus=(k&&MM.BONUS[k]&&MM.BONUS[k][day])||0;
  const n=a.met.filter(x=>x===b.id).length;
  const rem=n===0?0:n===1?MM.REMATCH1:MM.REMATCH2;
  return {rf,cf,rw,cw,dist,diff,base,bonus,rem,final:base+bonus+rem};
}

/* 7日目の固定・最優先対戦(§14〜§17,§26,§27) */
function mmFixed(list,day,ctx){
  const fx=[];if(day!==7)return fx;
  const T=list.filter(isTaisho),F=list.filter(isFukusho);
  const best=arr=>{
    let r=null;
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      if(mmHard(arr[i],arr[j],day,ctx))continue;
      const e=mmEval(arr[i],arr[j],day,ctx);
      if(!r||e.final>r.e.final)r={a:arr[i],b:arr[j],e};
    }
    return r;
  };
  if(T.length===2)fx.push({a:T[0],b:T[1],tier:0,why:'大将2人 → 7日目の大将同士は固定(Tier0)'});
  else if(T.length>=3){const x=best(T);if(x)fx.push({a:x.a,b:x.b,tier:1,why:`大将${T.length}人 → 7日目の大将同士を最優先で1組確保(Tier1)`});}
  if(F.length===2)fx.push({a:F[0],b:F[1],tier:0,why:'副将2人 → 7日目の副将同士は固定(Tier0)'});
  else if(F.length>=3){const x=best(F);if(x)fx.push({a:x.a,b:x.b,tier:2,why:`副将${F.length}人 → 7日目の副将同士を高優先で1組確保(Tier2)`});}
  return fx;
}

/* 全体マッチング: 重み行列W(null=禁止)から合計点が最大になるペアの組を求める。
   貪欲法(高得点順)で初期解を作り、2組の相手を入れ替える改善(2-opt)で磨く。数回やり直して最良を採用。 */
function mmSolve(n,W){
  let m=0;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(W[i][j]!=null)m++;
  const ci=new Int32Array(m),cj=new Int32Array(m),cs=new Float64Array(m);
  for(let i=0,k=0;i<n;i++)for(let j=i+1;j<n;j++)if(W[i][j]!=null){ci[k]=i;cj[k]=j;cs[k]=W[i][j];k++;}
  const fixLeft=mate=>{
    for(;;){
      const L=[];for(let i=0;i<n;i++)if(mate[i]===-1)L.push(i);
      if(L.length<2)return;
      let best=null;
      const x=L[0];
      for(const y of L){ // 余り同士で組む
        if(y!==x&&W[x][y]!=null&&(!best||W[x][y]>best.s))best={s:W[x][y],t:0,y};
      }
      for(const y of L){ // 既存のペア(u,v)を解いて (x,u)+(y,v) / (x,v)+(y,u) に組み直す
        if(y===x)continue;
        for(let u=0;u<n;u++){
          const v=mate[u];if(v<0||u>v)continue;
          if(W[x][u]!=null&&W[y][v]!=null){const s=W[x][u]+W[y][v]-W[u][v];if(!best||s>best.s)best={s,t:1,y,u,v,o:0};}
          if(W[x][v]!=null&&W[y][u]!=null){const s=W[x][v]+W[y][u]-W[u][v];if(!best||s>best.s)best={s,t:1,y,u,v,o:1};}
        }
      }
      if(!best){mate[x]=-2;continue;}            // どうしても組めない人は一旦保留
      if(best.t===0){mate[x]=best.y;mate[best.y]=x;}
      else{
        const {y,u,v,o}=best;
        if(o===0){mate[x]=u;mate[u]=x;mate[y]=v;mate[v]=y;}
        else{mate[x]=v;mate[v]=x;mate[y]=u;mate[u]=y;}
      }
    }
  };
  const improve=mate=>{
    for(let pass=0,ch=true;ch&&pass<40;pass++){
      ch=false;
      for(let a=0;a<n;a++){
        if(mate[a]<a)continue;                       // 各ペアは小さい番号側からだけ調べる
        for(let c=a+1;c<n;c++){
          const b=mate[a],d=mate[c];
          if(d<c||b===c)continue;                    // d<c は 保留(負)または相方が先に調べた側
          const cur=W[a][b]+W[c][d];let bs=cur,opt=0;
          if(W[a][c]!=null&&W[b][d]!=null){const s=W[a][c]+W[b][d];if(s>bs+1e-9){bs=s;opt=1;}}
          if(W[a][d]!=null&&W[b][c]!=null){const s=W[a][d]+W[b][c];if(s>bs+1e-9){bs=s;opt=2;}}
          if(opt===1){mate[a]=c;mate[c]=a;mate[b]=d;mate[d]=b;ch=true;}
          else if(opt===2){mate[a]=d;mate[d]=a;mate[b]=c;mate[c]=b;ch=true;}
        }
      }
    }
  };
  let bestRes=null;
  for(let r=0;r<MM.RESTARTS;r++){
    const key=new Float64Array(m);
    for(let k=0;k<m;k++)key[k]=cs[k]+(r===0?0:Math.random()*15);
    const order=new Uint32Array(m);for(let k=0;k<m;k++)order[k]=k;
    order.sort((x,y)=>key[y]-key[x]);
    const mate=new Array(n).fill(-1);
    for(let t=0;t<m;t++){const k=order[t],i=ci[k],j=cj[k];if(mate[i]===-1&&mate[j]===-1){mate[i]=j;mate[j]=i;}}
    fixLeft(mate);improve(mate);
    let tot=0,left=0;
    for(let i=0;i<n;i++){if(mate[i]<0)left++;else if(mate[i]>i)tot+=W[i][mate[i]];}
    if(!bestRes||left<bestRes.left||(left===bestRes.left&&tot>bestRes.tot))bestRes={mate:mate.slice(),tot,left};
  }
  const pairs=[],left=[];
  bestRes.mate.forEach((m,i)=>{if(m>i)pairs.push([i,m]);else if(m<0)left.push(i);});
  return {pairs,left};
}

/* 先鋒以上の選手が「誰とは組めなかったか」を理由つきで記録(§28) */
function mmBlocked(p,list,day,ctx){
  const by=new Map();
  for(const o of list){
    if(o===p||!isSanyakuUp(o))continue;
    const why=mmHard(p,o,day,ctx);if(!why)continue;
    if(!by.has(why))by.set(why,[]);by.get(why).push(`${o.name}(${rankLabel(o)})`);
  }
  return [...by].map(([w,ns])=>`${w}:${ns.slice(0,6).join('、')}${ns.length>6?` ほか${ns.length-6}人`:''}`);
}

function mmDbg(a,b,day,ctx,e,tier,fixedWhy,noise,pool){
  const k=topPairKey(a,b);
  const d={day,ra:rankLabel(a),rb:rankLabel(b),wa:a.w,wb:b.w,
    rf:e.rf,cf:e.cf,rw:e.rw,cw:e.cw,dist:e.dist,base:+e.base.toFixed(1),bonus:e.bonus,rem:e.rem,
    noise:+(noise||0).toFixed(1),final:+(e.final+(noise||0)).toFixed(1),
    hard:'OK',tier:tier,fx:fixedWhy||'',ul:ctx.unlock.info.slice()};
  if(isSanyakuUp(a))d.blkA=mmBlocked(a,pool,day,ctx);
  if(isSanyakuUp(b))d.blkB=mmBlocked(b,pool,day,ctx);
  if(k)d.kind=k;
  return d;
}
function mmTier(a,b,day,fixedTier){
  if(fixedTier!=null)return fixedTier;
  const k=topPairKey(a,b);
  if(k==='TT')return 1;
  if(k==='FF')return 2;
  if(k==='TF'&&day>=5)return 3;
  if((k==='TS'||k==='FS'||k==='SS')&&day>=4)return 4;
  return 5;
}

function planDay(day){
  const B=S.basho;B.byes=[];
  const pools=[];
  GROUPS.forEach((g,gi)=>{
    if(day>g.days)return;
    const list=sortRank(S.people.filter(p=>g.divs.includes(p.div)));
    pools.push({g,gi,list});
  });
  // 奇数なら下の階級から1人借りて偶数にする。最後が奇数なら1人は休み
  for(let i=0;i<pools.length;i++){
    if(pools[i].list.length%2){
      if(i+1<pools.length&&pools[i+1].list.length){pools[i].list.push(pools[i+1].list.shift());}
      else{B.byes.push(pools[i].list.pop());}
    }
  }
  const out=[],notes=[];
  for(const {g,gi,list} of pools){
    const ctx=mmContext(list,day,notes);
    const fixed=mmFixed(list,day,ctx);
    const used=new Set();fixed.forEach(f=>{used.add(f.a);used.add(f.b);});
    const rest=list.filter(p=>!used.has(p));
    const n=rest.length;
    const pairs=fixed.map(f=>({a:f.a,b:f.b,fx:f}));
    if(n>=2){
      const W=Array.from({length:n},()=>new Array(n).fill(null));
      const E=Array.from({length:n},()=>new Array(n).fill(null));
      for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
        if(!isMatchAllowed(rest[i],rest[j],day,ctx))continue;       // 禁止はスコア計算の対象にしない(§25)
        const e=mmEval(rest[i],rest[j],day,ctx);
        const nz=(Math.random()*2-1)*MM.NOISE;
        E[i][j]=E[j][i]={e,nz};
        W[i][j]=W[j][i]=e.final+nz;
      }
      const {pairs:ps,left}=mmSolve(n,W);
      ps.forEach(([i,j])=>pairs.push({a:rest[i],b:rest[j],ev:E[i][j]}));
      // 禁止ルールを破らずには組めない人は休みにする(絶対禁止は緩和しない §22)
      left.forEach(i=>{B.byes.push(rest[i]);notes.push(`${rest[i].name}は禁止ルールを破らずに組める相手がなく休み`);});
    }
    for(const pr of pairs){
      let {a,b}=pr;
      if(Math.random()<.5)[a,b]=[b,a];     // 先攻(画面左=a)は編成時にランダム。以前は番付が上の方が先攻だった
      let e,nz=0,tier,why='';
      if(pr.fx){e=mmEval(a,b,day,ctx);tier=pr.fx.tier;why=pr.fx.why;notes.push(`${a.name}↔${b.name}: ${why}`);}
      else{e=pr.ev.e;nz=pr.ev.nz;tier=mmTier(a,b,day,null);}
      const dbg=mmDbg(a,b,day,ctx,e,tier,why,nz,list);
      out.push({a,b,gi,w:null,swiss:false,dbg});
    }
    if(g.key==='総合'&&(ctx.nT||ctx.nF)){
      notes.unshift(`大将${ctx.nT}人・副将${ctx.nF}人`);
    }
  }
  // 下位の取組から順に。最後が最上位(結び)
  const top=m=>Math.min(ordKey(m.a),ordKey(m.b));            // 取組の並びは、組の上位側の番付で決める
  out.sort((x,y)=>y.gi-x.gi||top(y)-top(x));
  B.mmNotes=notes;
  return out;
}
function beginDay(){
  const B=S.basho;
  B.day++;B.mi=0;B.phase='days';
  B.matches=planDay(B.day);
  L(`${tName(B.no)} ${B.day}日目:${B.matches.length}番の取組を編成`+((B.mmNotes&&B.mmNotes.length)?`(${B.mmNotes.join(' / ')})`:''));
}

/* ---------- 合い口(戦士以上同士の対戦成績) ----------
   S.aiai['小さいID-大きいID']=[小さいIDの勝ち数,大きいIDの勝ち数]
   記録するのは、本場所の取組(決定戦を含む)で、対戦時点の番付が両者とも戦士以上のとき。練習戦は記録しない。 */
const AIAI_DIVS=['大将','副将','先鋒','旗頭','戦士'];
const AIAI_BIG=2;     // 勝ち数の差がこの数以上なら「得意/苦手」、1勝差は「やや得意/やや苦手」
function aiaiEligible(a,b){return AIAI_DIVS.includes(a.div)&&AIAI_DIVS.includes(b.div);}
function aiaiKey(x,y){return x<y?x+'-'+y:y+'-'+x;}
function aiaiGet(a,b){      // aから見た [aの勝ち, bの勝ち]。記録がなければnull
  const r=(S.aiai||{})[aiaiKey(a.id,b.id)];if(!r)return null;
  return a.id<b.id?[r[0],r[1]]:[r[1],r[0]];
}
function aiaiRecord(win,lose){
  if(!aiaiEligible(win,lose))return false;
  if(!S.aiai)S.aiai={};
  const k=aiaiKey(win.id,lose.id),r=S.aiai[k]||(S.aiai[k]=[0,0]);
  r[win.id<lose.id?0:1]++;return true;
}
function aiaiOf(p){         // pの合い口一覧(現役の相手のみ): [{o,w,l}]
  const out=[];
  for(const k in (S.aiai||{})){
    const [x,y]=k.split('-').map(Number);
    if(x!==p.id&&y!==p.id)continue;
    const o=S.byId.get(x===p.id?y:x);if(!o)continue;
    const r=S.aiai[k];out.push({o,w:x===p.id?r[0]:r[1],l:x===p.id?r[1]:r[0]});
  }
  return out;
}
function aiaiLabel(w,l){    // 自分から見た評価
  const d=w-l;if(!d)return '互角';
  return (Math.abs(d)>=AIAI_BIG?(d>0?'得意':'苦手'):(d>0?'やや得意':'やや苦手'));
}
/* ---------- 懸賞金・場所収入(通貨: pt) ----------
   前作の設定を移植。
   - 場所収入: 大会が終わるたびに、全員がデータの「場所収入」の額を受け取る(大会1回につき1回)
   - 懸賞金: 戦士(前頭)以上同士の総合の取組だけ発生。勝者が全額もらう(敗者は受け取らない)
     基礎スコア = 100 × (東のランク + 西のランク) × 格上補正(ランク差2以上なら1.5倍)
     懸賞金 = 基礎スコア × 期待値倍率(1.0〜5.0倍)
     期待値倍率 = 1.0 + 全勝同士(+2.0)/1敗同士(+1.0)(4日目以降) + 相星決戦(千秋楽・優勝決定戦 +1.5)
                      + 大将が絡む注目カード(+1.0)
   ※ 「因縁カード」の加算は自動判定できないため未実装 */
const BOUNTY_BASE=100, BOUNTY_GIANT=1.5, BOUNTY_MULT_MAX=5.0, BOUNTY_MIN_DAY=4;
const BOUNTY_TOP_RANK={大将:6,副将:5,先鋒:4,旗頭:3};   // 番付ランク値(三役以上)
const BOUNTY_SEN_NEAR_MAX=6;                             // 戦士のうち、この番号以下(旗頭の直下)はランク2、それ以外は1
function bountyRank(p){
  if(p.div==='戦士')return p.slot<=BOUNTY_SEN_NEAR_MAX?2:1;
  return BOUNTY_TOP_RANK[p.div]||0;
}
/* 取組の懸賞金を計算する。対象外なら null。記録は取組の前の値で計算する(勝敗を反映する前に呼ぶこと) */
function calcBounty(m,res){
  if(m.practice)return null;
  const ra=bountyRank(m.a),rb=bountyRank(m.b);
  if(!ra||!rb)return null;
  const day=S.basho.day,last=maxDays();
  let base=BOUNTY_BASE*(ra+rb);
  const giant=Math.abs(ra-rb)>=2;
  if(giant)base*=BOUNTY_GIANT;
  let mult=1.0;const why=[];
  if(!m.playoff&&day>=BOUNTY_MIN_DAY){
    if(m.a.l===0&&m.b.l===0){mult+=2.0;why.push('全勝同士+2.0');}
    else if(m.a.l===1&&m.b.l===1){mult+=1.0;why.push('1敗同士+1.0');}
  }
  if(m.playoff||(day===last&&m.a.w===m.b.w&&m.a.l===m.b.l)){mult+=1.5;why.push('相星決戦+1.5');}
  if((ra===6)!==(rb===6)){mult+=1.0;why.push('大将が絡む注目カード+1.0');}
  mult=Math.min(mult,BOUNTY_MULT_MAX);
  const amount=Math.round(base*mult);
  const tip=`基礎 ${fmt(base)}pt${giant?'(格上補正×1.5)':''} × 倍率 ${mult.toFixed(1)}`+(why.length?`(${why.join(' / ')})`:'');
  return {amount,base:Math.round(base),mult,tip};
}
/* 取組の懸賞金額を先に決めて m に入れる(GameSet 演出で使う。支払いはしない) */
function setBounty(m,res){const bi=calcBounty(m,res);m.bountyInfo=bi;m.bounty=bi?bi.amount:0;}
/* 懸賞金を勝者に支払う(全額) */
function payBounty(winner,m){
  if(!m.bounty)return;
  (S.basho.bounties=S.basho.bounties||[]).push([winner.id,m.bounty]);   // 大会の終わりにまとめて支払う
  L(`懸賞金: ${winner.name} に ${fmt(m.bounty)}pt(${m.a.name} vs ${m.b.name}、大会終了時に支払い)`);
}
/* 場所収入: 大会が終わったとき、全員にデータの「場所収入」の額を支払う(大会ごとに1回) */
function payBashoIncome(){
  const B=S.basho;
  if(B.fastUsed){
    B.bounties=[];
    L(`${tName(B.no)} 高速モードで進めたため、場所収入・懸賞金はありません`);
    toast(`${tName(B.no)} 高速モードで進めたため、場所収入・懸賞金はありません`);
    return;
  }
  let total=0;
  S.people.forEach(p=>{const v=+p.inc||0;if(v>0){p.money=(p.money||0)+v;total+=v;}});
  L(`${tName(S.basho.no)} 場所収入: 全員に計 ${fmt(total)}pt を支払い`);
  toast(`${tName(S.basho.no)} 場所収入を支払いました(計 ${fmt(total)}pt)`);
  let bsum=0;(B.bounties||[]).forEach(([id,amt])=>{const w=S.byId.get(id);if(w){w.money=(w.money||0)+amt;bsum+=amt;}});
  B.bounties=[];
  if(bsum)L(`${tName(B.no)} 懸賞金: 計 ${fmt(bsum)}pt を支払い`);
}

function applyResult(m,res){
  m.aiaiPre=aiaiGet(m.a,m.b)||[0,0];     // この一番の前までの合い口(対戦画面で結果を先に見せないため)
  setBounty(m,res);                      // 懸賞金は勝敗を反映する前の記録で計算する
  aiaiRecord(res.winner,res.loser);
  m.w=res.winner===m.a?'A':'B';
  m.turns=res.turns;m.sp=res.sp;m.condA=res.A.c;m.condB=res.B.c;
  m.hpA=res.A.hp;m.hpB=res.B.hp;
  const win=res.winner,lose=res.loser;
  win.w++;lose.l++;
  payBounty(win,m);
  win.met.push(lose.id);lose.met.push(win.id);
  (win.res=win.res||[]).push({o:lose.id,w:1});(lose.res=lose.res||[]).push({o:win.id,w:0});
  sbRecord(m,res);        // 大会結果送信用に、取組ごとのIDを控えるだけ(ここでは通信しない)
}
function playNextFast(){
  const B=S.basho;if(B.mi>=B.matches.length)return null;
  const m=B.matches[B.mi++];
  const res=simulate(m.a,m.b,B.place);applyResult(m,res);return {m,res};
}
function dayDone(){return S.basho.mi>=S.basho.matches.length;}
function bashoDaysDone(){return S.basho.day>=maxDays()&&dayDone();}

/* ---------- 優勝・決定戦 ---------- */
/* 日程終了後、最多勝が複数いる取組グループはトーナメント方式の優勝決定戦を行う。
   1番ずつ進めて観戦できるよう、進行状態(B.po)をIDだけで持つ(保存・復元に対応) */
const shuffleIds=a=>a.slice().sort(()=>Math.random()-.5);
function setTitle(g,ch,first,playoff){
  const B=S.basho;
  B.titles[g.key]={id:ch.id,w:ch.w,l:ch.l,playoff,n:first};
  ch.titles.push({b:B.no,key:g.key});
  L(`${tName(B.no)} ${g.label}:${ch.name}(${ch.w}勝${ch.l}敗)${playoff?' 決定戦':''}`);
}
function playoffInit(){
  const B=S.basho;B.titles={};B.playoffs=[];B.po={groups:[],g:0};
  GROUPS.forEach((g,gi)=>{
    const mem=S.people.filter(p=>g.divs.includes(p.div));
    if(!mem.length)return;
    const mx=Math.max(...mem.map(p=>p.w));
    const cand=mem.filter(p=>p.w===mx);
    if(cand.length===1){setTitle(g,cand[0],1,false);return;}
    B.po.groups.push({key:g.key,gi,first:cand.length,cand:shuffleIds(cand.map(p=>p.id)),round:1,nxt:[],pos:0});
  });
}
/* 次の決定戦の取組を返す(なければnull)。不戦勝やラウンド・グループの区切りもここで処理する */
function playoffPending(){
  const B=S.basho,po=B.po;if(!po)return null;
  while(po.g<po.groups.length){
    const G=po.groups[po.g],g=GROUPS[G.gi];
    if(G.pos>=G.cand.length){                       // ラウンド終了
      G.cand=G.nxt;G.nxt=[];G.pos=0;G.round++;
      if(G.cand.length===1){setTitle(g,S.byId.get(G.cand[0]),G.first,true);po.g++;continue;}
      G.cand=shuffleIds(G.cand);continue;
    }
    if(G.pos+1>=G.cand.length){G.nxt.push(G.cand[G.pos]);G.pos++;continue;}   // 余った1人は不戦勝
    const a=S.byId.get(G.cand[G.pos]),b=S.byId.get(G.cand[G.pos+1]);
    return {G,m:{a,b,gi:G.gi,playoff:true,key:G.key,round:G.round,final:G.cand.length===2}};
  }
  return null;
}
function playoffApply(G,m,res){
  if(m.bountyInfo===undefined)setBounty(m,res);
  payBounty(res.winner,m);
  aiaiRecord(res.winner,res.loser);
  S.basho.playoffs.push({key:G.key,round:G.round,a:m.a.id,b:m.b.id,win:res.winner.id});
  G.nxt.push(res.winner.id);G.pos+=2;
}
function playoffDrain(){   // 残りの決定戦を演出なしで一気に消化
  for(let pp;(pp=playoffPending());){const res=simulate(pp.m.a,pp.m.b,S.basho.place);if(UI.mode==='fast')S.basho.fastUsed=true;playoffApply(pp.G,pp.m,res);}
}

/* ---------- 番付編成 ---------- */
function nextBasho(){
  S.history.push({no:S.basho.no,place:S.basho.place.name,titles:S.basho.titles,playoffs:S.basho.playoffs});
  if(S.history.length>200)S.history.shift();
  startBasho(S.basho.no+1);
}
/* =====================================================================
   Supabase 大会結果送信
   大会の日程(と優勝決定戦)が終わったあと、キャラクターごとに submit_tournament_result() を呼んで結果を提出する。
   全員の提出が済むまで番付の作成(サーバーの finalize)は行わない。通信は取組ごとではなく、大会終了時のみ。
   url と anonKey が空のあいだは、送信せずこれまで通りの動きになる。
   ===================================================================== */
const SUPABASE_CONFIG={
  url:'https://bkgnagwsmmbvgyjhfulj.supabase.co',   // プロジェクトURL(末尾に /rest/v1/ が付いていても自動で外す)
  anonKey:'sb_publishable_o5VIg4C1BuMngiwN3EL3gg_wJgS_lti',   // publishable(anon)キー。公開前提のキーなので、HTMLに書いてよい(secretキーは絶対に書かない)
  tournamentId:null,      // null=大会番号(第N場所→id=N) / 数値=固定(テスト用) / 関数 b=>数値
  rpc:'submit_tournament_result',
  params:{tournament:'p_tournament_id',character:'p_character_id',submission:'p_submission_id',results:'p_matches',bye:'p_bye'},   // ★RPCの引数名に合わせる
  timeoutMs:20000,concurrency:4,
  testIds:[]              // 空でなければ、このIDのキャラだけ送信(少人数テスト用)
};
function sbEnabled(){return !!(SUPABASE_CONFIG.url&&SUPABASE_CONFIG.anonKey);}
function sbUuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  const b=new Uint8Array(16);(window.crypto||{getRandomValues:a=>a.map(()=>Math.random()*256)}).getRandomValues(b);
  b[6]=b[6]&15|64;b[8]=b[8]&63|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
/* B.sb = {tid:大会ID, ev:[[characterA,characterB,勝者ID,client_event_id],…], s:{キャラID:{sid:submission_id, st:状態, msg}}}
   st: ''=未送信 / 'ok'=成功 / 'net'=通信エラー / 'rej'=受付拒否 */
function sbState(B){return B.sb||(B.sb={tid:null,ev:[],s:{}});}
/* 提出先の大会ID(番付サーバーの tournaments.id)。分からなければ null を返す。大会番号を代わりに使うと、別の大会に送ってしまうため使わない */
function sbTid(B){if(B.sb&&B.sb.tid!=null)return B.sb.tid;const c=SUPABASE_CONFIG.tournamentId;const v=typeof c==='function'?c(B):c;return Number.isInteger(v)?v:null;}
function sbRecord(m,res){
  if(!sbEnabled())return;
  m.clientEventId=m.clientEventId||sbUuid();
  sbState(S.basho).ev.push([m.a.id,m.b.id,res.winner.id,m.clientEventId]);
}
/* 通常の取組の記録が足りないとき(送信機能の導入前から進んでいた大会など)、各人の対戦結果(p.res)から補う */
function sbSyncEvents(){
  const sb=sbState(S.basho),have=new Map(),want=new Map();
  const key=(x,y,w)=>(x<y?x+'-'+y:y+'-'+x)+':'+w;
  for(const e of sb.ev){const k=key(e[0],e[1],e[2]);have.set(k,(have.get(k)||0)+1);}
  for(const p of S.people)for(const r of (p.res||[])){if(r.w!==1)continue;const k=key(p.id,r.o,p.id);want.set(k,(want.get(k)||0)+1);}
  for(const [k,n] of want){
    for(let i=have.get(k)||0;i<n;i++){const [pr,w]=k.split(':'),[x,y]=pr.split('-').map(Number);sb.ev.push([x,y,+w,sbUuid()]);}
  }
}
function sbTargets(){const t=SUPABASE_CONFIG.testIds;return S.people.filter(p=>!t.length||t.includes(p.id));}
/* RPCを1回呼ぶ。戻り値 {ok:true} / {ok:false,kind:'net'|'rej',msg} */
async function sbCall(tid,cid,sid,results,bye){
  const C=SUPABASE_CONFIG,P=C.params,ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),C.timeoutMs);
  try{
    const base=C.url.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');     // 末尾の /rest/v1/ は付いていてもいなくてもよい
    const headers={'Content-Type':'application/json',apikey:C.anonKey};
    if(!/^sb_/.test(C.anonKey))headers.Authorization='Bearer '+C.anonKey;   // 新形式(sb_publishable_…)のキーはJWTではないので apikey だけを送る
    const res=await fetch(`${base}/rest/v1/rpc/${C.rpc}`,{method:'POST',signal:ctl.signal,headers,
      body:JSON.stringify({[P.tournament]:tid,[P.character]:cid,[P.submission]:sid,[P.results]:results,[P.bye]:bye})});
    if(res.ok)return {ok:true};
    let body={};try{body=await res.json();}catch(e){}
    const msg=[body.message,body.details,body.hint].filter(Boolean).join(' / ')||`HTTP ${res.status}`;
    if(/already submitted a tournament result/.test(msg))return {ok:true,dup:true};   // 同じキャラの提出が既にサーバーにある(他の人の提出を採用)
    if(res.status>=500||res.status===429||res.status===408)return {ok:false,kind:'net',msg:`サーバーエラー: ${msg}`};
    return {ok:false,kind:'rej',msg};
  }catch(e){return {ok:false,kind:'net',msg:e.name==='AbortError'?'タイムアウト':'通信できませんでした'};}
  finally{clearTimeout(to);}
}
let sbJob=null;
function sbStart(){if(!sbJob)sbJob=sbRun().finally(()=>{sbJob=null;sbPaint();});return sbJob;}
const SB_BATCH=40;   // 1回にまとめて送る件数(サーバーの上限は100件)
/* まとめ送信を1回呼ぶ。戻り値: {ok:true,results:Map(キャラID→{ok,message})} / {ok:false,kind:'net'|'rej',msg} */
async function sbCallBatch(tid,items){
  const C=SUPABASE_CONFIG,ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),C.timeoutMs*3);
  try{
    const base=C.url.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
    const headers={'Content-Type':'application/json',apikey:C.anonKey};
    if(!/^sb_/.test(C.anonKey))headers.Authorization='Bearer '+C.anonKey;
    const res=await fetch(`${base}/rest/v1/rpc/submit_tournament_results_batch`,{method:'POST',signal:ctl.signal,headers,
      body:JSON.stringify({p_tournament_id:tid,p_items:items})});
    let body={};try{body=await res.json();}catch(e){}
    if(!res.ok){
      const msg=[body.message,body.details,body.hint].filter(Boolean).join(' / ')||`HTTP ${res.status}`;
      if(res.status>=500||res.status===429||res.status===408)return {ok:false,kind:'net',msg:`サーバーエラー: ${msg}`};
      return {ok:false,kind:'rej',msg};
    }
    return {ok:true,results:new Map((body.results||[]).map(x=>[String(x.character_id),x]))};
  }catch(e){return {ok:false,kind:'net',msg:e.name==='AbortError'?'タイムアウト':'通信できませんでした'};}
  finally{clearTimeout(to);}
}
async function sbRun(){
  const B=S.basho;if(B.phase!=='submit')return;
  if(!sbEnabled()){toast('Supabaseの送信設定がありません');return;}
  const sb=sbState(B);
  sbSyncEvents();
  // 送信の直前に、番付サーバーの「今の大会」を取り直す(保存済みの大会IDに頼ると、終了した大会へ送ってしまうため)
  const cur=await sbApi('GET','/current');
  if(!cur.ok||cur.tournament_no==null){sb.abort='番付サーバーに接続できませんでした。通信を確かめてから「送信を再開」してください';toast(sb.abort);saveSoon();sbPaint();return;}
  if(cur.tournament_no!==B.no){sb.abort=`第${B.no}場所は既に終了しています(今は大会${cur.tournament_no})。この結果は送れません。再読み込みすると最新の大会に合わせます`;toast(sb.abort);saveSoon();sbPaint();return;}
  sb.tid=cur.tournament_id;
  delete sb.abort;
  const idx=new Map();
  for(const [a,b,w,e] of sb.ev){
    const r={character_a:a,character_b:b,winner_id:w,client_event_id:e};
    for(const id of [a,b]){if(!idx.has(id))idx.set(id,[]);idx.get(id).push(r);}
  }
  // 取組のclient_event_idは、双方のキャラの提出で同じものを使う。重複していないかを、送る前に確認する
  const seenE=new Set();
  for(const e of sb.ev){
    if(seenE.has(e[3])){sb.abort=`取組のclient_event_idがローカルで重複しています(${e[3]}):送信を中止しました`;toast(sb.abort);saveSoon();return;}
    seenE.add(e[3]);
  }
  // まだ ok でないキャラを用意する。取組数が合わないものは、送る前に拒否扱いにする
  const items=[];
  for(const p of sbTargets()){
    const s=sb.s[p.id];if(s&&s.st==='ok')continue;
    const sub=sb.s[p.id]||(sb.s[p.id]={sid:sbUuid(),st:'',msg:''});   // submission_idは初回に作って保存し、再送でも同じものを使う
    const results=idx.get(p.id)||[];
    if(results.length!==p.w+p.l){sub.st='rej';sub.msg=`取組数が一致しません(記録${results.length}件 / 勝敗${p.w+p.l}戦)`;continue;}
    items.push({p,s:sub,results});
  }
  sbPaint();
  for(let i=0;i<items.length&&!UI.stop;i+=SB_BATCH){
    const part=items.slice(i,i+SB_BATCH);
    const r=await sbCallBatch(sb.tid,part.map(x=>({character_id:x.p.id,submission_id:x.s.sid,matches:x.results,bye:x.results.length===0})));   // 大会を通して1番も取組がなければ完全休場(bye)
    if(!r.ok){   // 呼び出し自体の失敗(通信・サーバー・関数が無い等)は、受付拒否ではなく「未送信」として止める
      part.forEach(x=>{x.s.st='net';x.s.msg=r.msg;});
      sb.abort='送信を中断しました。「送信を再開」で続きから送れます: '+r.msg;
      sbPaint();saveSoon();break;
    }else{
      part.forEach(x=>{
        const one=r.results.get(String(x.p.id));
        if(!one){x.s.st='net';x.s.msg='応答に含まれていませんでした';return;}
        if(one.ok||/already submitted a tournament result/.test(one.message||'')){x.s.st='ok';x.s.msg='';}   // 送信済み(他の人の提出を採用)も成功扱い
        else{x.s.st='rej';x.s.msg=one.message||'受付拒否';}
      });
    }
    sbPaint();saveSoon();
  }
  // 受付拒否のキャラは未提出として扱い、番付を作る。通信エラーなどで未送信の人がいる間は作らない
  const pendingNet=sbTargets().filter(p=>{const s=sb.s[p.id];return !s||s.st===''||s.st==='net';});
  const rejected=sbTargets().filter(p=>{const s=sb.s[p.id];return s&&s.st==='rej';});
  // 大会が既に終了している(他の人が先に次の大会へ進めた)ときは、この端末の結果は送れない。番付も作らず止める
  const stale=rejected.some(p=>/not active|does not exist/.test(sb.s[p.id].msg||''));
  if(stale&&!sb.abort){sb.abort='この大会は既に終了しています(他の人が先に進めました)。番付は作らず、この端末の大会結果は送れません。ページを再読み込みすると最新の大会に合わせられます';toast(sb.abort);saveSoon();sbPaint();return;}
  // 1人も受け付けられていないのに番付を作ると、全員未提出の大会が出来てしまうので作らない
  const accepted=sbTargets().filter(p=>{const s=sb.s[p.id];return s&&s.st==='ok';});
  if(!sb.abort&&!UI.stop&&!pendingNet.length&&!accepted.length&&rejected.length){sb.abort='受け付けられた提出が1件もないため、番付は作りません';toast(sb.abort);saveSoon();sbPaint();return;}
  if(!sb.abort&&!UI.stop&&!pendingNet.length){
    if(rejected.length)toast(`受付拒否の${rejected.length}人は未提出として番付を作ります`);
    await sbFinalize();return;
  }
  const left=sbTargets().filter(p=>{const s=sb.s[p.id];return !s||s.st!=='ok';});
  if(!UI.stop)toast(`大会結果の送信が完了していません(${left.length}人)。番付はまだ更新していません`);
  saveSoon();
}
/* 全員の提出が済んだので、既存の番付編成へ進む */
/* ---------- 番付エンジン(Supabase Edge Function ranking-engine)との通信 ---------- */
function sbFnUrl(path){const base=SUPABASE_CONFIG.url.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');return `${base}/functions/v1/ranking-engine${path}`;}
async function sbApi(method,path,body){
  const C=SUPABASE_CONFIG,headers={'Content-Type':'application/json',apikey:C.anonKey};
  if(!/^sb_/.test(C.anonKey))headers.Authorization='Bearer '+C.anonKey;
  let res;
  try{res=await fetch(sbFnUrl(path),{method,headers,body:body?JSON.stringify(body):undefined});}
  catch(e){return {ok:false,status:0,error:'通信できませんでした'};}
  let data={};try{data=await res.json();}catch(e){}
  if(!res.ok)return {...data,ok:false,status:res.status,error:data.error||`HTTP ${res.status}`};
  return {...data,ok:true};
}
/* 番付エンジンが返した番付(大会の開始時点の位置)を画面の番付に入れる */
function sbApplyPositions(rows,tno){
  for(const r of rows){
    const p=S.byId.get(r.character_id);if(!p)continue;
    p.div=r.div;p.slot=r.slot;p.ord=r.ord==null?NaN:r.ord;p.tsuna=!!r.tsuna;p.pre=r.div==='前相撲';p.demoted=false;
    // 番付表の位置(全体の順番)。1大会前の位置は、前の大会に対応していたときだけ残す
    if(tno!=null&&p.posNo!==tno){const prev=p.posNo===tno-1;p.prevPos=prev?p.pos:null;p.prevLabel=prev?p.label:null;p.posNo=tno;}
    p.pos=r.rank_position==null?null:r.rank_position;p.label=r.rank||null;   // 番付名+数字(例: 戦士3)
  }
  const third=rows.filter(r=>r.div==='三等兵').map(r=>r.slot);
  if(third.length)S.thirdStart=Math.min(...third);
  S.people.forEach(p=>{p.pk=rankSortKey(p);});
}
/* 大会の終了: 全員の提出が済んでいれば、サーバーに次の大会の番付を作らせ、その結果を画面に反映する */
async function sbFinalize(){
  const B=S.basho;if(B.phase!=='submit')return;
  const sb=B.sb,champ=B.titles&&B.titles['総合']?B.titles['総合'].id:null;
  const fail=msg=>{if(sb)sb.abort=msg;toast(msg);saveSoon();sbPaint();};
  const fin=await sbApi('POST','/finalize',{tournament_no:B.no,champion_id:champ});
  if(!fin.ok&&fin.code==='already_advanced'){await sbAdopt();return;}   // 他の人が先に次の大会へ進めていた
  if(!fin.ok){
    const why=fin.error==='not all results submitted'?`未提出のキャラがいます(${fin.missing_count}人)`:fin.error;
    fail(`番付の作成に失敗しました: ${why}`);return;
  }
  const got=await sbApi('GET',`/rankings?tournament_no=${fin.next_tournament_no}`);
  if(!got.ok){fail('次の番付の取得に失敗しました。もう一度お試しください');return;}
  // 今大会の記録を履歴に残してから、次の番付を入れる
  for(const p of S.people){p.rec.push({b:B.no,div:rankLabel(p),w:p.w,l:p.l});if(p.rec.length>40)p.rec.shift();}
  sbApplyPositions(got.rankings,fin.next_tournament_no);
  B.changes=(fin.changes||[]).map(c=>c.replace(/#(\d+)/g,(m,id)=>pname(+id)));
  B.changes.filter(c=>/大将|副将|先鋒/.test(c)).slice(0,12).forEach(c=>L('番付 '+c));
  B.sb=sb?{tid:sb.tid,ids:Object.keys(sb.s).length}:null;   // 送信用の細かい記録は捨てて、要約だけ残す
  B.phase='done';
  saveSoon();
}
/* 他の人が先に次の大会へ進めていた場合: 手元の未確定の大会は捨てて、サーバーの進行中の大会に合わせる */
async function sbAdopt(){
  toast('他の人がこの大会を先に終えたため、最新の大会に合わせます');
  const cur=await sbApi('GET','/current');
  if(!cur.ok||cur.tournament_no==null){toast('最新の大会を取得できませんでした');return;}
  startBasho(cur.tournament_no);
  await sbSyncLineup();
}
/* 進行中の大会(番付がある最後の大会)をサーバーから取って合わせる。
   無ければ初期配置を作る。手元が未開始で古い番号なら、サーバーの番号に進める */
async function sbSyncLineup(){
  const B0=S.basho;if(!B0||B0.phase!=='ready'||!sbEnabled())return;
  let cur=await sbApi('GET','/current');
  if(!cur.ok){toast(`番付サーバーに接続できませんでした(${cur.error||'原因不明'})`);return;}
  if(cur.tournament_no==null){   // まだ1つも番付が無い: 手元の大会番号で初期配置を作る(同時に作られた場合も含む)
    const i=await sbApi('POST','/lineup/init',{tournament_no:B0.no});
    if(!i.ok&&i.code!=='already_started'){toast(`大会${B0.no}の番付を用意できませんでした(${i.error})`);return;}
    cur=await sbApi('GET','/current');
    if(!cur.ok||cur.tournament_no==null){toast('番付を取得できませんでした');return;}
  }
  if(S.basho!==B0||B0.phase!=='ready')return;
  if(cur.tournament_no!==B0.no){
    if(B0.day>0)return;   // 進行中の大会は途中で入れ替えない
    startBasho(cur.tournament_no);
  }
  const B=S.basho;
  const g=await sbApi('GET',`/rankings?tournament_no=${B.no}`);
  if(!g.ok||!g.rankings.length){toast(`大会${B.no}の番付を取得できませんでした`);return;}
  if(S.basho!==B||B.phase!=='ready')return;
  sbState(B).tid=g.tournament_id;   // 提出先はサーバーの大会ID
  sbApplyPositions(g.rankings,B.no);
  renderAll();saveSoon();
}
/* 起動時(再読み込み): 番付サーバーの「今の大会」に合わせる。
   - 同じ大会: 途中の結果はそのまま続ける(大会IDを保存しておく)。未開始なら番付を取り直す
   - 違う大会: 途中の結果は送れないので取り除き、今の大会へ合わせる(終了した大会を進めない) */
async function sbCatchUp(){
  const B=S.basho;if(!B||!sbEnabled())return;
  const cur=await sbApi('GET','/current');
  if(S.basho!==B)return;
  if(!cur.ok||cur.tournament_no==null){if(B.phase==='ready')await sbSyncLineup();return;}
  if(cur.tournament_no===B.no){
    if(B.phase==='ready'){await sbSyncLineup();return;}
    const sb=sbState(B);if(sb.tid==null)sb.tid=cur.tournament_id;
    return;
  }
  if(B.phase==='ready'&&B.day===0){startBasho(cur.tournament_no);await sbSyncLineup();return;}
  startBasho(cur.tournament_no);
  toast(`第${B.no}場所は終了しているため、途中の結果を取り除き、今の大会(${cur.tournament_no})に合わせました`);
  saveSoon();
  await sbSyncLineup();
}
function sbPaint(){
  const box=$('sbBox');if(!box)return;
  const B=S.basho;
  if(!B||B.phase!=='submit'){box.hidden=true;return;}
  const sb=sbState(B),T=sbTargets();
  let ok=0;const bad=[];
  for(const p of T){const s=sb.s[p.id];if(!s)continue;if(s.st==='ok')ok++;else if(s.st)bad.push([p,s]);}
  const run=!!sbJob,done=ok,fail=bad.length||sb.abort;
  const title=run?'🌐 大会結果をSupabaseへ送信中…':fail?'⚠ 大会結果の送信が完了していません(番付はまだ更新されていません)':'大会結果の送信待ち(番付はまだ更新されていません)';
  box.className='sbx'+(!run&&fail?' err':'');
  box.hidden=false;
  box.innerHTML=`<b>${title}</b> <span class="dim">送信済み ${done}/${T.length}人${SUPABASE_CONFIG.testIds.length?'(テストモード)':''}</span>
  <div class="bar"><i style="width:${T.length?done/T.length*100:0}%"></i></div>
  ${sb.abort?`<div>${esc(sb.abort)}</div>`:''}
  ${bad.length?`<ul>${bad.slice(0,6).map(([p,s])=>`<li>${esc(p.name)}:${s.st==='net'?'通信エラー':'受付拒否'} <span class="dim">${esc(s.msg)}</span></li>`).join('')}${bad.length>6?`<li class="dim">…ほか${bad.length-6}人</li>`:''}</ul>`:''}
  ${run?'':`<div class="row"><button class="primary" id="sbRetry">${done||bad.length?'送信を再開':'送信する'}</button></div>`}`;
}
async function sbResumeUI(){
  if(UI.busy||sbJob)return;
  UI.busy=true;UI.stop=false;setBusy(true);
  try{await sbStart();}finally{UI.busy=false;setBusy(false);renderAll();saveSoon();}
}
