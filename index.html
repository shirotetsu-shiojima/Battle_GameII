function inScope(m){
  if(UI.scope==='all')return true;
  if(UI.scope==='watch'){
    if(UI.watch.size)return UI.watch.has(m.a.id)||UI.watch.has(m.b.id);
    return m.gi===0;
  }
  return m.gi<=1;               // top: 総合+闘士
}
function finishBasho(){
  finishBashoLogic();
  const g=GROUPS.find(g=>S.basho.titles[g.key]);   // 総合が空(リセット直後)なら最上位の優勝者を表示
  if(g){const t=S.basho.titles[g.key];toast(`第${S.basho.no}場所 ${g.label}:${pname(t.id)}(${t.w}勝${t.l}敗)`);}
  UI.tab=(UI.tab==='matches')?'titles':UI.tab;
  saveSoon();
}
/* 1番進める。戻り値: 'ok' | 'dayend' | 'bashoend' | 'done' */
async function playMatch(animate,quiet){
  const B=S.basho;
  if(B.phase==='done')return 'done';
  if(B.day===0||dayDone()){
    if(B.day>=maxDays()&&dayDone()){finishBasho();return 'bashoend';}
    beginDay();renderAll();
    if(!B.matches.length){            // その日に取組がない(リセット直後で上位階級が空など)
      if(B.day>=maxDays()){finishBasho();return 'bashoend';}
      return 'dayend';
    }
  }
  const m=B.matches[B.mi++];
  const res=simulate(m.a,m.b,B.place);
  applyResult(m,res);
  UI.last={m,res};
  if(!quiet)await showBattle(m,res,animate&&UI.mode==='anim');
  if(dayDone()&&B.day>=maxDays()){finishBasho();return 'bashoend';}
  return dayDone()?'dayend':'ok';
}
async function runUntil(kind){
  if(UI.busy)return;
  UI.busy=true;UI.stop=false;setBusy(true);
  try{
    let n=0;
    while(!UI.stop){
      const B=S.basho;
      if(B.phase==='done'){
        if(UI.autoNext&&kind==='auto'){await sleep(1500);if(UI.stop)break;goNextBasho();continue;}
        break;
      }
      const m=(B.day===0||dayDone())?null:B.matches[B.mi];
      const anim=UI.mode==='anim'&&!!m&&inScope(m);
      const r=await playMatch(anim,!anim);
      if(r==='dayend'){
        renderAll();saveSoon();
        if(kind==='day')break;
        if(UI.mode==='anim')await sleep(250);
      }
      if(r==='bashoend'){renderAll();if(kind!=='auto')break;}
      if(++n%40===0){renderLight();await sleep(0);}
    }
  }finally{
    if(UI.last&&UI.mode!=='anim'){showBattle(UI.last.m,UI.last.res,false);}
    UI.busy=false;setBusy(false);renderAll();saveSoon();
  }
}

  $('oScope').onchange=e=>{UI.scope=e.target.value;saveSoon();};
  $('oAuto').onchange=e=>{UI.autoNext=e.target.checked;saveSoon();};
  $('oSave').onclick=()=>{saveNow();toast('保存しました');};
  $('oExport').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(serialize())],{type:'application/json'}));
    a.download=`banzuke_save_basho${S.basho.no}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  $('oImport').onchange=async e=>{
    try{restore(JSON.parse(await e.target.files[0].text()));saveNow();renderAll();toast('読み込みました');}
    catch(err){toast('読み込みに失敗しました');}
  };
  $('oResetProg').onclick=()=>{
    if(UI.busy){toast('進行中です。停止してからリセットしてください');return;}
    if(!confirm('番付・優勝記録・場所ごとの成績をすべて消します。\n全員が上等兵以下に落ち、能力評価値の高い順に上等兵1から並び直します。\n(キャラクターのデータと設定は変わりません)\nよろしいですか?'))return;
    UI.stop=true;resetProgress();stage.idle();renderAll();saveNow();
    toast('番付と記録をリセットしました(第1場所から開始)');
  };
  $('oReset').onclick=()=>{
    if(!confirm('進行状況をすべて消して最初からやり直します。よろしいですか?'))return;
    UI.stop=true;try{localStorage.removeItem(SAVE_KEY);}catch(e){}
    const pd=getPending();if(pd){lsSet(DB_KEY,{fetchedAt:pd.fetchedAt,rows:pd.rows});lsDel(PEND_KEY);}
    UI.watch=new Set();initPeople(dbRows());stage.idle();renderAll();toast('初期状態に戻しました(最新のキャラクターデータで開始)');
  };
}
function renderDuel(){
  const el=$('tab_duel');
  const names=S.people.map(p=>`<option value="${esc(p.name)}">`).join('');
  const D=UI.duel||(UI.duel={a:'',b:'',place:0,spOnly:true});
  el.innerHTML=`<p class="dim">順位や成績に影響しない練習対戦です。特殊能力の動きを確かめるのに使えます。</p>
  <div class="row"><label>左 <input type="search" id="dA" list="dl" placeholder="名前" value="${esc(D.a)}" autocomplete="off"></label>
  <label>右 <input type="search" id="dB" list="dl" placeholder="名前" value="${esc(D.b)}" autocomplete="off"></label></div>
  <datalist id="dl">${names}</datalist>
  <div class="row"><label>場所 <select id="dP">${PLACES.map((x,i)=>`<option value="${i}"${D.place===i?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <label><input type="checkbox" id="dS" ${D.spOnly?'checked':''}> ランダムは特殊能力持ちを優先</label></div>
  <div class="row"><button class="primary" id="dGo">▶ 対戦する</button><button id="dRnd">🎲 ランダムに選ぶ</button><button id="dRep">もう一度</button></div>
  <div id="dMsg" class="dim"></div>
  <h3>特殊能力を持つキャラ(${S.people.filter(p=>p.cmd).length}人)</h3>
  <div class="chips">${S.people.filter(p=>p.cmd).map(p=>`<span class="chip">${rowName(p)}</span>`).join('')}</div>`;
  const find=n=>{const k=nameKey(n);return k?S.people.find(p=>nameKey(p.name)===k):null;};
  const sync=()=>{D.a=$('dA').value;D.b=$('dB').value;D.place=+$('dP').value;D.spOnly=$('dS').checked;};
  $('dRnd').onclick=()=>{
    sync();
    const pool=S.people.filter(p=>!p.pre);
    const sp=pool.filter(p=>p.cmd);
    const pick=l=>l[Math.floor(Math.random()*l.length)];
    const a=D.spOnly&&sp.length?pick(sp):pick(pool);
    let b;do{b=pick(pool);}while(b===a);
    D.a=a.name;D.b=b.name;$('dA').value=D.a;$('dB').value=D.b;
  };
  const go=async()=>{
    sync();
    const a=find(D.a),b=find(D.b);
    if(!a||!b||a===b){$('dMsg').textContent='左右に別々のキャラを、一覧から選んで入力してください。';return;}
    if(UI.busy)return;
    UI.busy=true;UI.stop=false;setBusy(true);$('dMsg').textContent='';
    try{
      const res=simulate(a,b,PLACES[D.place]);
      const m={a,b,practice:true};
      window.scrollTo({top:0,behavior:'smooth'});
      await showBattle(m,res,true);
      $('dMsg').textContent=`${res.winner.name} の勝ち(${res.turns}ターン${res.sp?`・特殊能力の発動 ${res.sp}回`:''})`;
    }finally{UI.busy=false;setBusy(false);}
  };
  $('dGo').onclick=go;$('dRep').onclick=go;
}
const TABS={duel:renderDuel,matches:renderMatches,banzuke:renderBanzuke,standings:renderStandings,titles:renderTitles,search:renderSearch,log:renderLog,settings:renderSettings};
function renderTab(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='tab_'+UI.tab);
  TABS[UI.tab]();
}
function renderAll(){renderStatus();renderTab();syncModeUI();}
function renderLight(){renderStatus();}
function syncModeUI(){
  document.querySelectorAll('[name=mode]').forEach(r=>r.checked=(r.value===UI.mode));
  $('speed').value=UI.speed;$('speedBox').style.opacity=UI.mode==='anim'?1:.4;
}

/* ---------- プロフィール ---------- */
function cmdHTML(p){
  if(!p.cmd)return '';
  const {cmds,errs}=parseCommands(p.cmd);
  const items=cmds.map(c=>{
    const t=c.a[0];
    const cls=t===4?'gate':t===2?'atk':t===3?'sys':'stat';
    return `<li class="${cls}">${esc(describeCmd(c.a))}</li>`;
  }).join('');
  return `<div class="sp"><b>✦ 特殊能力</b><ul>${items}</ul>${errs.length?`<p class="dim">解釈できないコマンドが${errs.length}件あります</p>`:''}
  <details><summary class="dim">コマンドコード</summary><code>${esc(p.cmd)}</code></details></div>`;
}
function openProfile(id){
  const p=S.byId.get(id);if(!p)return;
  const bar=(v,max)=>`<span class="sb"><i style="width:${Math.min(100,v/max*100)}%"></i></span>`;
  const rec=p.rec.slice(-12).reverse().map(r=>`<tr><td>第${r.b}場所</td><td>${esc(r.div)}</td><td>${r.w}勝${r.l}敗</td></tr>`).join('');
  const tl=p.titles.map(t=>`第${t.b}場所 ${t.key}`).slice(-12).join('、');
  const tw=p.rec.reduce((s,r)=>s+r.w,0),tl2=p.rec.reduce((s,r)=>s+r.l,0);
  $('dlgBody').innerHTML=`<h2>${esc(p.name)}</h2>
  ${p.img?`<img class="pfimg" src="${esc(imgUrl(p.img))}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
  <p><b>${rankLabel(p)}</b> ${p.pre?'(前相撲)':''}${p.tsuna?' ・綱取りの場所':''}</p>
  <div class="stats">
   <div><small>体力</small><b>${fmt(p.hp)}</b>${bar(p.hp,25000)}</div>
   <div><small>パワー</small><b>${fmt(p.pw)}</b>${bar(p.pw,26000)}</div>
   <div><small>ガード</small><b>${fmt(p.gd)}</b>${bar(p.gd,27000)}</div>
   <div><small>IQ</small><b>${p.iq}</b>${bar(p.iq,190)}</div>
   <div><small>能力評価値</small><b>${fmt(p.ab)}</b>${bar(p.ab,40000)}</div>
   <div><small>場所収入</small><b>${fmt(p.inc)}</b></div>
  </div>
  <p>得意場所:<b>${esc(p.fav||'なし')}</b> / 苦手場所:<b>${esc(p.bad||'なし')}</b></p>
  ${cmdHTML(p)}
  <p>通算(記録分): ${tw}勝${tl2}敗 ${tl?`<br>優勝歴: ${esc(tl)}`:''}</p>
  ${rec?`<div class="tbl small"><table><thead><tr><th>場所</th><th>番付</th><th>成績</th></tr></thead><tbody>${rec}</tbody></table></div>`:'<p class="dim">まだ場所の記録がありません</p>'}
  <div class="row"><button id="pWatch">${UI.watch.has(id)?'観戦リストから外す':'観戦リストに追加'}</button><button id="pClose">閉じる</button></div>`;
  $('pClose').onclick=()=>$('dlg').close();
  $('pWatch').onclick=()=>{UI.watch.has(id)?UI.watch.delete(id):UI.watch.add(id);saveSoon();openProfile(id);if(UI.tab==='search')renderSearch();};
  if(!$('dlg').open)$('dlg').showModal();
}

/* ---------- 起動 ---------- */
function boot(){
  stage.init();
  if(!loadSaved())initPeople(dbRows());
  stage.idle();
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;renderTab();});
  document.addEventListener('click',e=>{const a=e.target.closest('a.nl');if(a)openProfile(+a.dataset.id);});
  document.addEventListener('click',e=>{if(e.target.closest('a.nl'))return;const r=e.target.closest('.m[data-mi]');if(r)openMatchInfo(+r.dataset.mi);});
  document.querySelectorAll('[name=mode]').forEach(r=>r.onchange=()=>{UI.mode=r.value;syncModeUI();saveSoon();});
  $('speed').oninput=e=>{UI.speed=+e.target.value;saveSoon();};
  $('bOne').onclick=()=>{
    if(UI.busy)return;UI.busy=true;UI.stop=false;setBusy(true);
    playMatch(true).finally(()=>{UI.busy=false;setBusy(false);renderAll();saveSoon();});
  };
  $('bDay').onclick=()=>runUntil('day');
  $('bBasho').onclick=()=>runUntil('basho');
  $('bAuto').onclick=()=>{if(!UI.busy)runUntil('auto');};
  $('bStop').onclick=()=>{UI.stop=true;UI.skip=true;};
  $('bSkip').onclick=()=>{UI.skip=true;};
  $('bNext').onclick=goNextBasho;
  $('bUpd').onclick=checkUpdate;
  $('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close();});
  renderAll();setBusy(false);
}
window.addEventListener('DOMContentLoaded',boot);

</script>
</body>
