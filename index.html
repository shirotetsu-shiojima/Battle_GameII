/* =====================================================================
   戦闘エンジン + 特殊能力コマンドエンジン

   コマンド形式: [種別 idx1 idx2 ... idx11]  (12要素。生成ツールの出力と同じ)
     種別 1:能力調整 2:攻撃 3:システム介入 4:条件分岐 9:例外コード
     idx7=発動確率  idx8=発動条件(0:メーター満タン 1:常時 2:HPに応じる)  idx11=継続ターン(0:永続)

   1ターンの流れ
     1. 両者の戦闘用ステータスを基礎値に戻す(体力の増減分だけは現在HPに反映)
     2. メーターを加算(前作Scratchの式: コミュ力・能力評価値・体力差で増加量が変わる)
     3. 常時・HP条件・継続中の「能力調整/システム介入」を先攻→後攻の順に適用
     4. 先攻の行動 → 後攻の行動
        ・メーター満タンなら特殊能力が発動(メーターは0に戻る)
        ・メーター発動の「攻撃」があればそのターンの通常攻撃の代わりになる
        ・常時/HP条件の「攻撃」は通常攻撃に加えて追加ダメージ
     5. 継続ターンを消費
   ===================================================================== */
const STAT_NAME=['体力','パワー','ガード','コミュ力','学力','IQ'];
const SYS_NAME=['防御力','クリティカル率','ミス率','クリティカル倍率','実行時の体力'];
const REF_NAME=['最大体力','パワー','ガード','コミュ力','学力','IQ','前ターンのダメージ量','実行時の体力'];
const TURN_LIMIT=400, METER_MAX=100, DEF_CRIT_MULT=150;
/* 種別9(例外コード呼び出し)の登録先: EXC_HANDLERS[コードID]=(ctx,self,opp)=>{...} 戦闘開始時に1回呼ばれる */
const EXC_HANDLERS={};

/* ---------- 基本計算(TurboWarp版の対戦処理を移植) ---------- */
function condRoll(){
  const r=1+Math.floor(Math.random()*100);
  return r>90?1.2:r>65?1.1:r>35?1:r>10?0.9:0.8;
}
function guardRateV(gd,c){const g=gd*c;return ((g-70)/(g+70))/2;}
function calc(b,op,v){
  let r=b;
  if(op===0)r=b+v;else if(op===1)r=b-v;else if(op===2)r=b*v;else if(op===3&&v!==0)r=b/v;
  return Number.isFinite(r)?r:b;
}
function roll(prob){return Math.random()*100<prob;}

/* ---------- コマンド解析 ---------- */
const _parseCache=new Map();
function parseCommands(str){
  str=str||'';
  if(_parseCache.has(str))return _parseCache.get(str);
  const cmds=[],errs=[];
  const re=/\[([^\]]*)\]/g;let m;
  while((m=re.exec(str))){
    const toks=m[1].match(/\([^)]*\)|[^\s]+/g)||[];
    if(toks.length!==12){errs.push(m[0]);continue;}
    const a=toks.map(t=>{
      if(t[0]==='(')return t.slice(1,-1).split(/[,\s、]+/).filter(x=>x!=='').map(Number).filter(Number.isFinite);
      const n=Number(t);return Number.isFinite(n)?n:0;
    });
    cmds.push({raw:m[0],a});
  }
  const res={cmds,errs};_parseCache.set(str,res);return res;
}

/* ---------- 説明文(コマンド生成ツールの文面に準拠) ---------- */
function describeMain(a){
  const T=['自分','相手','両方'];
  const type=a[0];
  const op4=(ref,calcM,val,who)=>{
    const f=['+','-','×','÷'][calcM]||'+';
    return `(相手の${ref} ${f} ${val})`;
  };
  if(type===1){
    const tg=T[a[1]]||'',st=a[2]===6?'全ステータス':STAT_NAME[a[2]]||'';
    if(a[3]===4)return `${tg}の${st}を ${op4(a[4]===6?'前ターンのダメージ量':STAT_NAME[a[4]]||'',a[5],a[6])} にする`;
    return `${tg}の${st}${['を '+a[6]+' 加算する','を '+a[6]+' 減算する','を '+a[6]+' 倍にする','を '+a[6]+' で割る'][a[3]]||''}`;
  }
  if(type===2){
    const tg=a[1]===0?'自分':a[1]===1?'相手':'両方';
    if(a[3]===0)return `${tg}に ${a[6]}(固定値)のダメージを与える`;
    if(a[3]===1)return `${tg}に(パワー × ${a[6]})のダメージを与える`;
    return `${op4(REF_NAME[a[4]]||'',a[5],a[6])} のダメージを${tg}に与える`;
  }
  if(type===3){
    const tg=T[a[1]]||'',sys=SYS_NAME[a[2]]||'',pct=a[2]<=3;
    if(a[3]===4)return `${tg}の${sys}を ${op4(REF_NAME[a[4]]||'',a[5],a[6])} にする`;
    if(pct&&a[3]===0)return `${tg}の${sys}を ${a[6]}%にする`;
    if(pct&&a[3]===1)return `${tg}の${sys}を ${a[6]}%減少させる`;
    return `${tg}の${sys}${['に '+a[6]+' 加算する','から '+a[6]+' 減算する','を '+a[6]+' 倍にする','を '+a[6]+' で割る'][a[3]]||''}`;
  }
  if(type===4){
    const tg=T[a[1]]||'';
    if(a[2]===0){
      const st=a[3]===6?'全ステータス合計':STAT_NAME[a[3]]||'';
      const val=a[4]===0?'自分の数値':`${a[4]}`;
      return `【条件】${tg}の${st}が ${val} ${['以上','以下','超過','未満','等しい'][a[5]]||''} の場合、以降のコマンドを実行`;
    }
    const list=Array.isArray(a[6])?a[6]:[];
    if(a[2]===1){
      const names=list.map(i=>(PLACES[i-1]||{}).name||i).join('・')||'(なし)';
      return `【条件】現在の開催地が ${names} ${a[7]===0?'のいずれか':'以外'}の場合、以降のコマンドを実行`;
    }
    return `【条件】相手のIDが ${list.join(',')||'(なし)'} に${a[7]===0?'含まれる':'含まれない'}場合、以降のコマンドを実行`;
  }
  if(type===9)return `例外コード ${a[1]} を呼び出す`;
  return '(不明なコマンド)';
}
function describeTrigger(a){
  if(a[0]===4||a[0]===9)return '';
  const prob=a[7],turn=a[11];
  if(a[8]===1){
    return turn>0?`最初の${turn}ターン、毎ターン${prob}%の確率で発動`:`毎ターン${prob}%の確率で発動`;
  }
  if(a[8]===2){
    const who=a[9]===1?'相手':'自分';
    return `${who}のHPが${a[10]}%以下のとき、毎ターン${prob}%の確率で発動`;
  }
  const dur=a[0]===2?(turn>1?`${turn}ターン連続で`:''):(turn===0?'以後ずっと':`${turn}ターンの間`);
  return `メーター満タン時に${prob}%の確率で${dur}発動`;
}
function describeCmd(a){
  const t=describeTrigger(a);
  return t?`${describeMain(a)}。(${t})`:`${describeMain(a)}。`;
}

/* ---------- 条件分岐(種別4) ----------
   「条件分岐より下のコマンド」だけが対象。毎ターン判定する(複数あれば AND)。
   体力の判定は、設定 gateHp が有効なら「現在のHP」、無効なら「データ上の体力値」(原作どおり) */
function statOf(p,k){
  if(k===6)return (p.hp+p.pw+p.gd+p.com+p.gaku)*(p.iq/100);
  return [p.hp,p.pw,p.gd,p.com,p.gaku,p.iq][k]||0;
}
function gateStat(side,k){
  if(k===0&&S.settings.gateHp!==false)return side.hp;
  return statOf(side.p,k);
}
function evalGate(a,s,o,place){
  const tgt=a[1]===1?o:s,menu=a[2];
  if(menu===0){
    const v=gateStat(tgt,a[3]);
    const cmp=a[4]===0?gateStat(s,a[3]):a[4];
    switch(a[5]){case 0:return v>=cmp;case 1:return v<=cmp;case 2:return v>cmp;case 3:return v<cmp;case 4:return v===cmp;}
    return true;
  }
  const list=Array.isArray(a[6])?a[6]:[];
  const val=menu===1?PLACES.indexOf(place)+1:o.p.id;
  const has=list.includes(val);
  return a[7]===0?has:!has;
}
function compileCmds(p){
  const {cmds}=parseCommands(p.cmd);
  const out=[],gates=[];
  for(const c of cmds){
    const a=c.a,t=a[0];
    if(t===4){gates.push(a);continue;}
    if(t===9){out.push({t,a,exc:true,trig:-1,gates:[]});continue;}
    if(t!==1&&t!==2&&t!==3)continue;
    out.push({t,a,trig:a[8],prob:a[7],dur:a[11],active:0,now:false,logged:false,gates:gates.slice()});
  }
  return out;
}
function gateOK(r,s,o,ctx){
  for(const g of r.gates)if(!evalGate(g,s,o,ctx.place))return false;
  return true;
}

/* ---------- 戦闘用の状態 ---------- */
function mkSide(p,place,key,noSuper){
  const base=condRoll();let c=base,pl='';
  if(place.key===p.fav){c*=1.2;pl='fav';}
  else if(place.key===p.bad){c*=0.8;pl='bad';}
  const sup=!noSuper&&isSuper(p);
  if(sup)c+=SUPER_BOOST;
  const mhp=boostedStat(p,'hp');
  return {key,p,base,c,sup,pl,hp:mhp,max:mhp,maxHp:mhp,prevBonus:0,meter:0,hasMeter:false,cmds:[],last:0,
    v:null,critO:null,missO:null,defO:null,critMult:DEF_CRIT_MULT};
}
function resetVars(s){
  const p=s.p;
  s.v={pw:boostedStat(p,'pw'),gd:boostedStat(p,'gd'),iq:boostedStat(p,'iq'),com:p.com,gaku:p.gaku};
  s.maxHp=boostedStat(p,'hp');s.critO=null;s.missO=null;s.defO=null;s.critMult=DEF_CRIT_MULT;
}
/* 体力(最大体力)の増減を現在HPへ反映: 上限を超えた分は切り捨て、増えた分は加算。
   効果が切れても「減らした分」は戻らない */
function syncHp(s){
  if(s.hp>s.maxHp)s.hp=s.maxHp;
  const bonus=Math.max(0,s.maxHp-s.p.hp);
  if(bonus>s.prevBonus)s.hp+=bonus-s.prevBonus;
  s.prevBonus=bonus;
}
function getStat(s,k){return k===0?s.maxHp:[0,s.v.pw,s.v.gd,s.v.com,s.v.gaku,s.v.iq][k];}
function setStat(s,k,v){
  if(k===0)s.maxHp=v;else s.v[['','pw','gd','com','gaku','iq'][k]]=v;
}
function curDefense(s){
  let d=s.defO!=null?s.defO:guardRateV(s.v.gd,s.c);
  if(d<0)d=0;if(1-d<0)d=0.99;return d;
}
function curCrit(s){const q=s.v.iq*s.c;return s.critO!=null?s.critO:(q-70)/q;}
function curMiss(s){
  if(s.missO!=null)return s.missO;
  const q=s.v.iq*s.c,ratio=((q-70)/(q+200))*100;
  return ratio<=0?Infinity:1/ratio;
}
/* 「相手参照」の値: 実行者の相手の値に計算(idx5, idx6)を掛ける */
function refValue(a,s,o){
  const k=a[4];
  const base=[o.maxHp,o.v.pw,o.v.gd,o.v.com,o.v.gaku,o.v.iq,o.last,o.hp][k]||0;
  return calc(base,a[5],a[6]);
}

/* ---------- 戦闘ログ ---------- */
function emit(ctx,e){
  const A=ctx.A,B=ctx.B;
  ctx.ev.push(Object.assign({t:ctx.t,hpA:A.hp,hpB:B.hp,mA:A.hasMeter?A.meter:null,mB:B.hasMeter?B.meter:null},e));
}
const fm=n=>Math.round(n).toLocaleString('ja-JP');
function ko(s){if(Math.ceil(s.hp)<1)s.hp=0;}
function sideOf(ctx,key){return key==='A'?ctx.A:ctx.B;}
function targetsOf(idx1,s,o){return idx1===0?[s]:idx1===1?[o]:[s,o];}

/* ---------- 効果の適用(種別1・3) ---------- */
function effStat(s,o,x,a){
  const keys=a[2]===6?[0,1,2,3,4,5]:[a[2]];
  for(const k of keys){
    const cur=getStat(x,k);
    const nv=a[3]===4?refValue(a,s,o):calc(cur,a[3],a[6]);
    setStat(x,k,Math.max(0,nv));
  }
}
function effSys(ctx,s,o,x,a){
  const sys=a[2];
  if(sys===4){                                   // 実行時の体力(現在HPそのもの)
    const before=x.hp;
    const nv=Math.max(0,a[3]===4?refValue(a,s,o):calc(x.hp,a[3],a[6]));
    x.hp=Math.min(x.maxHp,nv);ko(x);
    const d=x.hp-before;
    if(Math.abs(d)>=0.5)emit(ctx,{s:s.key,tgt:x.key,kind:'hp',delta:d,
      text:d>0?`${x.p.name}は体力が ${fm(d)} 回復した`:`${x.p.name}は体力が ${fm(-d)} 減った`});
    return;
  }
  const pct=sys<=2;                              // 0:防御力 1:クリ率 2:ミス率 は%、3:クリ倍率は倍率(%表記)
  const cur=sys===0?curDefense(x)*100:sys===1?curCrit(x)*100:sys===2?(Number.isFinite(curMiss(x))?curMiss(x)*100:100):x.critMult;
  let nv;
  if(a[3]===4)nv=refValue(a,s,o);
  else if(a[3]===0)nv=a[6];                      // 加算(固定値) = その値にする
  else nv=calc(cur,a[3],a[6]);                   // 1:減算 2:乗算 3:除算
  nv=Math.max(0,nv);
  if(sys===0)x.defO=Math.min(1,nv/100);
  else if(sys===1)x.critO=Math.min(1,nv/100);
  else if(sys===2)x.missO=Math.min(1,nv/100);
  else x.critMult=nv;
}
function applyEffect(ctx,s,o,r,announce){
  const a=r.a;
  for(const x of targetsOf(a[1],s,o)){
    if(r.t===1)effStat(s,o,x,a);else effSys(ctx,s,o,x,a);
  }
  syncHp(s);syncHp(o);
  if(announce&&!(r.t===3&&a[2]===4))
    emit(ctx,{s:s.key,kind:'fx',text:`✦ ${s.p.name}: ${describeMain(a)}`});
}

/* ---------- 攻撃(種別2・通常攻撃) ---------- */
function hurt(ctx,s,x,raw,label,kind){
  const d=curDefense(x);
  const fin=raw*(1-d);
  x.hp-=fin;ko(x);
  emit(ctx,{s:s.key,tgt:x.key,kind,type:'hit',dmg:fin,guard:d,
    text:`${label}${x.p.name}に ${fm(fin)} ダメージ${d>0.005?`(防御${Math.round(d*100)}%軽減)`:''}`});
  return fin;
}
function doAttack(ctx,s,o,r,kind){
  const a=r.a;
  let raw=a[3]===0?a[6]:a[3]===1?s.v.pw*a[6]:refValue(a,s,o);
  raw=Math.max(0,Number.isFinite(raw)?raw:0);
  let dealt=0;
  for(const x of targetsOf(a[1],s,o)){
    if(x.hp<=0)continue;
    const label=x===s?`✦ ${s.p.name}は反動で `:kind==='sp'?`✦ ${s.p.name}の必殺! `:`✦ ${s.p.name}の追撃! `;
    const f=hurt(ctx,s,x,raw,label,'sp');
    if(x===o)dealt+=f;
  }
  return dealt;
}
function normalAttack(ctx,s,o){
  const q=s.v.iq*s.c;
  const crit=curCrit(s),miss=curMiss(s);
  const base=s.v.pw*s.c/6;
  let dmg=0,type='miss';
  if(Math.random()<crit){
    if(Math.random()>miss){dmg=base*s.critMult/100;type='crit';}
  }else if(Math.random()>miss){dmg=base;type='hit';}
  // 防御は「攻撃側のIQ由来の確率」で有効。能力で防御を固定している場合は常に有効(原作どおり)
  let d;
  if(o.defO!=null)d=o.defO;
  else d=Math.random()<(q-70)/q?guardRateV(o.v.gd,o.c):0;
  if(d<0)d=0;if(1-d<0)d=0.99;
  const fin=dmg*(1-d);
  o.hp-=fin;ko(o);
  emit(ctx,{s:s.key,tgt:o.key,kind:'atk',type,dmg:fin,guard:d,
    text:type==='miss'?`${s.p.name}の攻撃は外れた`:
      `${s.p.name}の${type==='crit'?'会心の一撃! ':'攻撃 '}${fm(fin)}ダメージ${d>0?`(防御${Math.round(d*100)}%軽減)`:''}`});
  return fin;
}

/* ---------- ターン進行 ---------- */
function inWindow(r,turn){return r.dur===0||turn<=r.dur;}
function hpCond(r,s,o){
  const t=r.a[9]===1?o:s;
  return t.hp/t.p.hp*100<=r.a[10];
}
/* メーター増加量(前作 Scratch「ゲージ仕組み」の式を移植)。毎ターンの開始時に、生きている側それぞれに加算する。
   原作のゲージは「0〜(能力評価値+3000)」。ここでは満タンを100%として割合で持つ。
     ブースト   = 相手の能力評価値 ÷ 自分の能力評価値(1未満なら1)       … 格上の相手と戦うほど溜まりやすい
                + 自分の体力割合が相手より低いとき、その差の1/3         … 劣勢なほど溜まりやすい
                → さらに (ブースト−1)÷2+1 にならす(効きを半分に)
     増加量     = (コミュ力 + (30000−能力評価値)÷2 の切り捨て) ÷ 5 × ブースト
     満タン値   = (能力評価値の切り捨て + 3000) × METER_CAP_RATE            … 超えた分は満タンで止まる
     METER_CAP_RATE: 原作の容量に対する倍率。0.7なら容量が7割(=約1.4倍の速さで溜まる)。溜まりやすさを調整するときはここだけ変える */
const METER_CAP_RATE=0.7;
function meterGain(s,o,ctx){
  const ps=s.p,po=o.p;
  const abS=Math.max(1,ps.ab),abO=Math.max(1,po.ab);
  let boost=abO/abS>1?abO/abS:1;
  const rS=s.hp/ps.hp,rO=o.hp/po.hp;
  if(rO-rS>0)boost+=(rO-rS)/3;
  boost=(boost-1)/2+1;
  const inc=((s.v.com||0)+Math.floor((30000-abS)/2))/5*boost;
  const cap=(Math.floor(abS)+3000)*METER_CAP_RATE;
  return inc/cap*METER_MAX;
}
/* プロフィール表示用の目安: ブースト1.0(互角の相手)のときの1ターンあたりの増加率(%) */
function meterBaseRate(p){
  const ab=Math.max(1,p.ab);
  return ((p.com||0)+Math.floor((30000-ab)/2))/5/((Math.floor(ab)+3000)*METER_CAP_RATE)*100;
}
function passivePhase(ctx,s,o){
  if(s.hp<=0)return;
  for(const r of s.cmds){
    if(r.exc||(r.t!==1&&r.t!==3))continue;
    if(r.gates.length&&!gateOK(r,s,o,ctx))continue;
    let go=false;
    if(r.trig===0)go=r.active>0&&!r.now;
    else if(r.trig===1)go=inWindow(r,ctx.t)&&roll(r.prob);
    else if(r.trig===2)go=inWindow(r,ctx.t)&&hpCond(r,s,o)&&roll(r.prob);
    if(!go)continue;
    const loud=r.trig!==0&&(r.prob<100||!r.logged);
    if(r.trig!==0)r.logged=true;
    applyEffect(ctx,s,o,r,loud);
  }
}
function act(ctx,s,o){
  if(s.hp<=0||o.hp<=0)return;
  if(s.hasMeter&&s.meter>=METER_MAX){
    const cand=s.cmds.filter(r=>r.trig===0&&r.active!==Infinity&&gateOK(r,s,o,ctx));   // 永続化済みのものは再発動しない
    if(cand.length){
      s.meter=0;ctx.sp++;
      emit(ctx,{s:s.key,kind:'trig',text:`✦✦ ${s.p.name}のメーターが満タン! 特殊能力発動!`});
      let fired=0;
      for(const r of s.cmds){if(r.trig===0)r.now=false;}
      for(const r of cand){
        if(roll(r.prob)){
          r.active=r.t===2?Math.max(1,r.dur):(r.dur===0?Infinity:r.dur);
          r.now=true;fired++;
        }
      }
      if(!fired)emit(ctx,{s:s.key,kind:'fx',text:`  …しかし不発に終わった`});
      for(const r of cand)if(r.now&&(r.t===1||r.t===3))applyEffect(ctx,s,o,r,true);
    }
  }
  const special=s.cmds.filter(r=>r.trig===0&&r.t===2&&r.active>0&&gateOK(r,s,o,ctx));
  const extra=s.cmds.filter(r=>(r.trig===1||r.trig===2)&&r.t===2&&inWindow(r,ctx.t)&&gateOK(r,s,o,ctx)&&(r.trig===1||hpCond(r,s,o))&&roll(r.prob));
  let dealt=0;
  for(const r of special.concat(extra)){
    if(s.hp<=0||o.hp<=0)break;
    dealt+=doAttack(ctx,s,o,r,special.includes(r)?'sp':'ex');
  }
  if(!special.length&&s.hp>0&&o.hp>0)dealt+=normalAttack(ctx,s,o);
  s.last=dealt;
}
function tick(s){
  for(const r of s.cmds){
    r.now=false;
    if(r.trig===0&&r.active>0&&Number.isFinite(r.active))r.active--;
  }
}

/* ---------- 1試合 ---------- */
function simulate(a,b,place,noSuper){
  const A=mkSide(a,place,'A',noSuper),B=mkSide(b,place,'B',noSuper);
  const useSp=S.settings.special!==false;
  A.cmds=useSp?compileCmds(a):[];
  B.cmds=useSp?compileCmds(b):[];
  A.hasMeter=A.cmds.some(r=>r.trig===0);
  B.hasMeter=B.cmds.some(r=>r.trig===0);
  const ctx={A,B,ev:[],t:0,sp:0,place};
  for(const [s,o] of [[A,B],[B,A]])
    for(const r of s.cmds)if(r.exc&&EXC_HANDLERS[r.a[1]])EXC_HANDLERS[r.a[1]](ctx,s,o);
  let turn=0;
  while(A.hp>0&&B.hp>0&&turn<TURN_LIMIT){
    turn++;ctx.t=turn;
    resetVars(A);resetVars(B);
    syncHp(A);syncHp(B);
    if(A.hasMeter)A.meter=Math.min(METER_MAX,A.meter+meterGain(A,B,ctx));
    if(B.hasMeter)B.meter=Math.min(METER_MAX,B.meter+meterGain(B,A,ctx));
    passivePhase(ctx,A,B);passivePhase(ctx,B,A);
    syncHp(A);syncHp(B);
    if(A.hp<=0||B.hp<=0)break;
    act(ctx,A,B);
    if(A.hp>0&&B.hp>0)act(ctx,B,A);
    tick(A);tick(B);
  }
  let win;
  if(B.hp<=0&&A.hp>0)win='A';else if(A.hp<=0&&B.hp>0)win='B';
  else win=(A.hp/A.max>=B.hp/B.max)?'A':'B';
  return {A,B,ev:ctx.ev,turns:turn,sp:ctx.sp,win,winner:win==='A'?a:b,loser:win==='A'?b:a};
}

/* =====================================================================
   キャラクターデータの更新(GAS → CSV)
   - 取得は「更新ボタンを押したときだけ」。起動時の自動取得はしない
   - 取得結果はブラウザに保存し、次回以降の起動ではそれを使う
   - 取得前に差分を表示し、確認してから適用する
   ===================================================================== */
const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbz5dvjxUvQWo9aTro6vwkj9u6-CtWvt7GQs39bFg_nhYDqPtpeTVOknse19UUupGOWQ/exec';
const DB_KEY='banzuke_chardb_v1',PEND_KEY='banzuke_pending_v1',URL_KEY='banzuke_gasurl_v1',LAST_KEY='banzuke_lastfetch_v1',SBR_KEY='banzuke_sbroster_v1';
const COOLDOWN_MS=30000, MIN_ROWS=20, TIMEOUT_MS=25000;

function lsGet(k){try{const t=localStorage.getItem(k);return t?JSON.parse(t):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function getGasUrl(){const u=lsGet(URL_KEY);return (typeof u==='string'&&u.startsWith('https://'))?u:GAS_DEFAULT;}
function getDB(){const d=lsGet(DB_KEY);return d&&Array.isArray(d.rows)&&d.rows.length?d:null;}
function dbRows(){
  const d=getDB();if(!d)return DATA;
  let rows=d.rows;
  if(!(rows[0]&&rows[0].length>=15)){
    const by=new Map(DATA.map(r=>[nameKey(r[1]),r]));   // 旧形式のDBにコミュ力・学力を補う
    rows=rows.map(r=>{const o=by.get(nameKey(r[1]));const x=r.slice();x[13]=o?o[13]:0;x[14]=o?o[14]:0;return x;});
  }
  const idByName=new Map(DATA.map(r=>[nameKey(r[1]),r[0]]));   // 旧版で保存された名簿のIDを、スプレッドシートのIDに名前で読み替える
  rows=rows.map(r=>{const id=idByName.get(nameKey(r[1]));if(id===undefined||id===r[0])return r;const x=r.slice();x[0]=id;return x;});
  return rows.map(r=>{        // 得意/苦手場所の表記ゆれ(例: みけ原)を御卦原にそろえる
    const f=placeKey(norm(r[8]))||'',b=placeKey(norm(r[9]))||'';
    if(f===r[8]&&b===r[9])return r;
    const x=r.slice();x[8]=f;x[9]=b;return x;
  });
}
function getPending(){const d=lsGet(PEND_KEY);return d&&Array.isArray(d.rows)?d:null;}
function fmtDate(ts){
  if(!ts)return '-';
  const d=new Date(ts),z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ---------- 取得(ページ分割+再試行) ----------
   GASは ?page=1,2,3… でCSVを分割して返す。空のレスポンスが返ったら全ページ取得完了。
   途中のページが取得できなかった場合は、中途半端なデータで名簿を壊さないよう全体を失敗扱いにする。 */
const PAGE_RETRY=3, MAX_PAGES=200, PAGE_GAP_MS=300;

let UPD_DIAG='';   // 取得状況のメモ(失敗時の「詳細」に表示)
const headOf=t=>String(t).trim().slice(0,200).replace(/\s+/g,' ');

async function fetchPageOnce(url,page){
  const u=new URL(url);
  u.searchParams.set('page',page);
  u.searchParams.set('_',Date.now());   // 途中のキャッシュ回避
  // AbortSignal は環境によって fetch に渡せない(DataCloneError)ため使わず、Promise.race でタイムアウトを実現する
  let timer;
  const timeout=new Promise((_,rej)=>{timer=setTimeout(()=>{const e=new Error('タイムアウト');e.name='AbortError';rej(e);},TIMEOUT_MS);});
  const run=(async()=>{
    const r=await fetch(u.toString());
    const text=await r.text();
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;e.head=headOf(text);throw e;}
    return text;
  })();
  run.catch(()=>{});   // タイムアウト後に遅れて失敗しても未処理エラーにしない
  try{return await Promise.race([run,timeout]);}
  finally{clearTimeout(timer);}
}

async function fetchPageWithRetry(url,page,maxRetry=PAGE_RETRY){
  const log=[];
  for(let attempt=1;;attempt++){
    try{
      const csv=await fetchPageOnce(url,page);
      if(csv.trimStart().startsWith('<')){   // CSVではなくHTMLが返った(GASの一時エラーや権限エラー)
        const e=new Error('CSVではなくHTMLが返りました');e.html=true;e.head=headOf(csv);throw e;
      }
      return csv;
    }catch(e){
      console.warn(`page=${page} の取得に失敗 (${attempt}/${maxRetry})`,e);
      log.push(`${page}ページ目 ${attempt}回目: ${e.name}: ${e.message}`+(e.head?` / 応答の先頭: ${e.head}`:''));
      if(attempt>=maxRetry){
        let msg=`${page}ページ目の取得に失敗しました(${maxRetry}回試行)。`,hint;
        if(e.html){msg=`${page}ページ目で、CSVではなくWebページが返ってきました。`;
          hint='下の「詳細」の応答内容を確認してください。権限エラーなら「アクセスできるユーザー」が「全員」か、デプロイURLが最新かを確認してください。';}
        else if(e.name==='AbortError')hint='タイムアウトしました。GAS側の処理が重い可能性があります。1ページあたりの件数を減らしてみてください。';
        else if(e.status)hint=`サーバーがエラー(HTTP ${e.status})を返しました。GASがこのページ番号でエラーを起こしている可能性があります。`;
        else hint='通信が遮断されました。GASが例外を出した場合などはブラウザ側では通信エラーとして見えることがあります。ブラウザで「URL?page='+page+'」を直接開いて結果を確認してください。';
        throw new UpdateError(msg,hint,log.join('\n'));
      }
      await sleep(attempt*1000);   // 1秒→2秒…と間隔をあけて再試行
    }
  }
}

async function fetchCharText(url,onProgress){
  const parts=[],pageLog=[];let prev=null,page=1,done=false;
  for(;page<=MAX_PAGES;page++){
    if(onProgress)onProgress(page);
    const csv=await fetchPageWithRetry(url,page);
    pageLog.push(`${page}ページ目: ${csv.length}文字 / 先頭: ${headOf(csv).slice(0,60)}`);
    UPD_DIAG='取得できたページ:\n'+pageLog.join('\n');
    if(!csv.trim()){done=true;break;}          // 空 = 全取得完了
    if(csv===prev){done=true;break;}           // 同じ内容が続く = page非対応の旧GAS(全件が返っている)
    parts.push(csv.replace(/^\uFEFF/,'').replace(/[\r\n]+$/,''));
    prev=csv;
    await sleep(PAGE_GAP_MS);                  // 連続アクセスを少し間引く
  }
  if(!done)throw new UpdateError(`ページ数が多すぎます(${MAX_PAGES}ページ以上)。`,'GAS側が空のレスポンスを返して終了できていない可能性があります。');
  if(!parts.length)throw new UpdateError('取得したデータが空でした。','スプレッドシートにデータがあるか、GASの処理を確認してください。');
  return parts.join('\n');
}

/* ---------- CSV解析(引用符・改行・BOM対応) ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}
      else f+=c;
    }else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function toNum(s){
  if(s==null)return NaN;
  const t=String(s).replace(/[,\s\u3000]/g,'');
  if(t==='')return NaN;
  const n=Number(t);return Number.isFinite(n)?n:NaN;
}
class UpdateError extends Error{constructor(msg,hint,detail){super(msg);this.hint=hint||'';this.detail=detail||'';}}

/* CSV文字列 → 取り込める行(名前・能力値) */
function parseChars(text){
  const head=text.trimStart().slice(0,200).toLowerCase();
  if(head.startsWith('<!doctype')||head.startsWith('<html')||head.startsWith('<'))
    throw new UpdateError('CSVではなくWebページが返ってきました。',
      'GASのデプロイ設定で「アクセスできるユーザー」が「全員」になっているか、デプロイURLが最新かを確認してください。');
  const rows=parseCSV(text);
  let hi=rows.findIndex((r,i)=>i<5&&r.some(c=>c.trim()==='名前'));
  if(hi<0)throw new UpdateError('ヘッダー行(「名前」列)が見つかりません。','GASが返すCSVの1行目に列名が含まれているか確認してください。');
  const header=rows[hi].map(c=>c.trim());
  const col=n=>header.indexOf(n);
  const need=['ID','名前','体力','パワー','ガード','IQ','能力評価値'];
  const miss=need.filter(n=>col(n)<0);
  if(miss.length)throw new UpdateError('必要な列がありません: '+miss.join('、'),'スプレッドシートの列名(体力・パワー・ガード・IQ・能力評価値)が変わっていないか確認してください。');
  const opt={fav:col('得意場所'),bad:col('苦手場所'),inc:col('場所収入'),cmd:col('特殊能力コマンド'),com:col('コミュ力'),gaku:col('学力'),img:col('画像URL')};
  const out=[],skipped=[],dups=[],placeWarn=[];const seen=new Set(),seenId=new Set();
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];
    const name=(r[col('名前')]||'').trim();
    if(!name||name==='名前')continue;   // 空行・ページ先頭の繰り返しヘッダーは無視
    const idRaw=(r[col('ID')]||'').trim(),id=toNum(idRaw);
    if(!Number.isInteger(id)||id<=0)throw new UpdateError(`IDが正しくありません: ${name}(「${idRaw}」)`,'スプレッドシートのID列(正の整数)を確認してください。');
    if(seenId.has(id))throw new UpdateError(`IDが重複しています: ${id}(${name})`,'スプレッドシートのID列で同じ番号が複数あるため、修正してください。');
    seenId.add(id);
    const v={hp:toNum(r[col('体力')]),pw:toNum(r[col('パワー')]),gd:toNum(r[col('ガード')]),iq:toNum(r[col('IQ')]),ab:toNum(r[col('能力評価値')])};
    if(Object.values(v).some(Number.isNaN)||v.hp<=0){skipped.push(name);continue;}
    const key=nameKey(name);
    if(seen.has(key)){dups.push(name);continue;}
    seen.add(key);
    const o=x=>x<0?undefined:norm((r[x]||'').trim());   // (null) は空欄扱い
    const nn=x=>{const n=x<0?NaN:toNum(r[x]);return Number.isNaN(n)?undefined:n;};
    const pl=(x,label)=>{   // 得意/苦手場所: 表記ゆれを開催地のkeyにそろえる。認識できない表記は取り込まず、警告に出す
      if(x<0)return undefined;
      const raw=(r[x]||'').trim(),k=placeKey(raw);
      if(k===null){placeWarn.push(`${name}の${label}「${raw}」`);return undefined;}
      return k;
    };
    const cmd=opt.cmd<0?undefined:(r[opt.cmd]||'').trim().replace(/\*+$/,'').trim();   // 末尾の「*」(区切りの印)は取り除く
    out.push({id,name,...v,fav:pl(opt.fav,'得意場所'),bad:pl(opt.bad,'苦手場所'),inc:o(opt.inc),cmd,com:nn(opt.com),gaku:nn(opt.gaku),img:o(opt.img)});
  }
  if(out.length<MIN_ROWS)throw new UpdateError(`有効なキャラが${out.length}人しかありません(最低${MIN_ROWS}人)。`,'取得内容がおかしい可能性があるため、データは変更していません。');
  return {chars:out,skipped,dups,placeWarn};
}

/* 取得結果 × 現在のデータ → 新しい名簿と差分 */
function buildMerge(text){
  const {chars,skipped,dups,placeWarn}=parseChars(text);
  const oldRows=dbRows();
  const oldById=new Map(oldRows.map(r=>[r[0],r]));
  const rows=[],added=[],changed=[];let same=0;
  const newIds=new Set();
  const pick=(v,ov,lv)=>v!==undefined?v:(lv!==undefined?lv:ov);   // 列があれば列の値、無ければ現在の設定を引き継ぐ
  for(const c of chars){
    newIds.add(c.id);
    const live=S.byId.get(c.id),old=oldById.get(c.id);
    const rk=old?old[7]:9999;
    const fav=pick(c.fav,old?old[8]:'',live?live.fav:undefined);
    const bad=pick(c.bad,old?old[9]:'',live?live.bad:undefined);
    const inc=c.inc!==undefined&&c.inc!==''&&!Number.isNaN(toNum(c.inc))?toNum(c.inc):(live?live.inc:(old?old[10]:100));
    const cmd=pick(c.cmd,old?old[11]:'',live?live.cmd:undefined);
    const com=c.com!==undefined?c.com:(live?live.com:(old?(old[13]||0):0));
    const gaku=c.gaku!==undefined?c.gaku:(live?live.gaku:(old?(old[14]||0):0));
    const img=c.img!==undefined?imgUrl(c.img):(live?(live.img||''):(old?(old[15]||''):''));
    rows.push([c.id,c.name,c.hp,c.pw,c.gd,c.iq,c.ab,rk,fav||'',bad||'',inc,cmd||'',old?old[12]:0,com,gaku,img]);
    if(!live&&!old)added.push(c.name);
    else if(!live)added.push(c.name+'(再登場)');
    else if(live.name!==c.name||live.hp!==c.hp||live.pw!==c.pw||live.gd!==c.gd||live.iq!==c.iq||Math.abs(live.ab-c.ab)>0.05||live.com!==com||live.gaku!==gaku||(live.cmd||'')!==(cmd||'')||(live.img||'')!==img||(live.fav||'')!==(fav||'')||(live.bad||'')!==(bad||''))changed.push(c.name);
    else same++;
  }
  const removed=S.people.filter(p=>!newIds.has(p.id));
  const topRemoved=removed.filter(p=>['大将','副将','先鋒','旗頭','戦士'].includes(p.div)).map(p=>`${p.name}(${rankLabel(p)})`);
  return {rows,added,changed,same,removed:removed.map(p=>p.name),topRemoved,skipped,dups,placeWarn,total:rows.length,fetchedAt:Date.now()};
}

/* Supabase の名簿(A〜S列の全部)を、CSVと同じ形の文字列にして返す。公開読み取りのみ */
async function fetchCharTextSupabase(){
  const C=SUPABASE_CONFIG,base=C.url.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  const headers={apikey:C.anonKey,Accept:'application/json'};
  if(!/^sb_/.test(C.anonKey))headers.Authorization='Bearer '+C.anonKey;
  const get=async path=>{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
    try{
      const res=await fetch(`${base}/rest/v1/${path}`,{headers,signal:ctl.signal});
      if(!res.ok)throw new UpdateError(`Supabaseから取得できませんでした(HTTP ${res.status})。`,'ネット接続と、Supabaseの設定を確認してください。');
      return await res.json();
    }finally{clearTimeout(to);}
  };
  const meta=(await get('master_meta?select=headers,synced_at&id=eq.1'))[0];
  if(!meta||!Array.isArray(meta.headers)||!meta.headers.length)
    throw new UpdateError('Supabaseにまだ名簿がありません。','GASの同期(syncCharacters)を一度実行してください。');
  const rows=(await get('characters?select=id,raw&order=id.asc&limit=5000')).filter(r=>Array.isArray(r.raw));
  if(!rows.length)throw new UpdateError('Supabaseにキャラクターの全列データがありません。','GASの同期を新しい版にして、一度実行してください。');
  const q=c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"';
  const text=[meta.headers.map(q).join(',')].concat(rows.map(r=>r.raw.map(q).join(','))).join('\n');
  return {text,syncedAt:meta.synced_at,count:rows.length};
}

/* ---------- 戦闘ステージ ---------- */
/* 対戦画面の背景: 開催地(開催月)ごとに images フォルダの「1月背景.png」「3月背景.png」…「11月背景.png」を使う。
   画像が無い月は、下の STAGE_BG_URL(空ならデフォルトのグラデーション背景)になる。
   画像は画面いっぱいに表示する(縦横比が合わないときは、短い辺に合わせて拡大し、はみ出す部分は中央を基準に切り取る)。 */
const STAGE_BG_DIR='images/';                                 // 背景画像を入れるフォルダ(index.html からの相対パス)
const STAGE_BG_FILE=month=>`${month}月背景.png`;               // 開催月 → ファイル名
const STAGE_BG_URL='';   // 開催月の画像が無いときの共通背景(例: 'images/共通背景.png')。空ならデフォルトのグラデーション背景
const SIDE_TPL=`<div class="who"><span class="rk">-</span><span class="np" hidden></span><span class="nm">-</span><span class="nq" hidden></span><span class="mv"></span></div>
<div class="cond"></div>
<div class="hpt"></div>
<div class="bar"><i></i></div>
<div class="portrait"><div class="pimg"><div class="ph"></div><img alt="" referrerpolicy="no-referrer" hidden></div><div class="vm off"><i></i></div></div>
<div class="spt" hidden></div>
<div class="chips"></div>
<div class="st"></div>`;
function nameHue(n){let h=0;for(const c of String(n))h=(h*31+c.codePointAt(0))%360;return h;}
const stage={
  init(){
    $('sideL').innerHTML=SIDE_TPL;$('sideR').innerHTML=SIDE_TPL;
    this.el={L:$('sideL'),R:$('sideR'),feed:$('feed'),turn:$('turn'),res:$('res'),gs:$('gameset'),
      basho:$('duelBasho'),day:$('duelDay'),sub:$('duelSub'),aiai:$('duelAiai')};
    this.el.L.onclick=()=>this.cur&&this.cur.a&&openProfile(this.cur.a.id);
    this.el.R.onclick=()=>this.cur&&this.cur.b&&openProfile(this.cur.b.id);
    this.el.gs.onclick=e=>{e.stopPropagation();this.el.gs.hidden=true;};
  },
  /* 開催地に合わせた背景にする。画像を先に読み込んで、あるときだけ差し替える(無ければ共通背景/グラデーション) */
  _bgState:{},_bgWant:'',
  bg(place){
    const duel=$('duel');if(!duel)return;
    const apply=url=>{if(url)duel.style.setProperty('--stage-bg',`url("${url}") center/cover no-repeat`);else duel.style.removeProperty('--stage-bg');};
    const i=PLACES.indexOf(place);
    if(i<0){apply(STAGE_BG_URL);return;}
    const url=encodeURI(STAGE_BG_DIR+STAGE_BG_FILE(TOURN_MONTHS[i]));
    this._bgWant=url;
    const st=this._bgState[url];
    if(st==='ok'){apply(url);return;}
    if(st==='ng'){apply(STAGE_BG_URL);return;}
    if(st==='loading')return;
    this._bgState[url]='loading';
    const img=new Image();
    img.onload=()=>{this._bgState[url]='ok';if(this._bgWant===url)apply(url);};
    img.onerror=()=>{this._bgState[url]='ng';if(this._bgWant===url)apply(STAGE_BG_URL);};
    img.src=url;
  },
  head(m){
    const B=S.basho;
    this.el.day.classList.toggle('po',!!(m&&m.playoff));   // 決定戦は「決定戦」を小さめの字で1行に
    if(m&&m.practice){this.el.basho.textContent='練習戦';this.el.day.textContent='';this.el.sub.textContent='';return;}
    this.el.basho.textContent=`${tName(B.no)}\n${B.place.name}`;
    if(m&&m.playoff){this.el.day.textContent='決定戦';this.el.sub.textContent=`${GROUPS[m.gi].key}の優勝 ・ ${m.final?'決勝':m.round+'回戦'}`;return;}
    this.el.day.textContent=B.phase==='done'?'終了':(B.day?`${B.day}日目`:'開幕前');
    this.el.sub.textContent=(m&&B.matches.includes(m))?`${GROUPS[m.gi]?GROUPS[m.gi].key:''} ・ ${B.matches.indexOf(m)+1}/${B.matches.length}番`:'';
  },
  /* 合い口の表示。after=true で、この一番の結果を加えた成績にする */
  aiai(m,after,res){
    const box=this.el.aiai;box.classList.remove('upd');
    const pre=m.aiaiPre||aiaiGet(m.a,m.b)||[0,0],cnt=!m.practice&&aiaiEligible(m.a,m.b);
    const cur=pre.slice();
    if(after&&cnt&&res)cur[res.winner===m.a?0:1]++;
    if(!cur[0]&&!cur[1]){
      box.hidden=!cnt;
      if(cnt)box.innerHTML='<small>合い口</small><div class="at">初顔合わせ</div>';
      return;
    }
    const d=cur[0]-cur[1],lab=aiaiLabel(Math.max(cur[0],cur[1]),Math.min(cur[0],cur[1]));
    box.innerHTML=`<small>合い口${after&&cnt?'(更新)':''}</small>`
      +`<div class="ab"><b class="${d>0?'aw':''}">${cur[0]}勝</b> - <b class="${d<0?'aw':''}">${cur[1]}勝</b></div>`
      +`<div class="at">${d>0?`◀ 左が${lab}`:d<0?`右が${lab} ▶`:'互角'}</div>`;
    box.hidden=false;
    if(after&&cnt){void box.offsetWidth;box.classList.add('upd');}
  },
  idle(){
    $('stageBody').classList.add('idle');this.cur=null;this.el.aiai.hidden=true;
    if(S.basho)this.bg(S.basho.place);
    this.el.gs.hidden=true;this.head(null);this.el.turn.textContent='';this.el.res.textContent='';
    this.el.feed.innerHTML='<div class="dim">取組を始めるとここに戦闘が表示されます。</div>';
  },
  daysOf(m){return (m.practice||m.playoff)?0:Math.max(1,(GROUPS[m.gi]||{days:7}).days);},
  portrait(el,p,m){
    const box=el.querySelector('.portrait'),img=box.querySelector('img'),ph=box.querySelector('.ph');
    box.dataset.tier=m.practice?'norm':p.div==='大将'?'top':(TOP_DIVS.includes(p.div)||p.div==='戦士')?'sen':p.div==='闘士'?'toshi':'norm';   // 金枠+きらめきは大将だけ
    const h=nameHue(p.name);
    ph.textContent=[...String(p.name).replace(/\s/g,'')][0]||'?';
    ph.style.background=`linear-gradient(135deg,hsl(${h},50%,62%),hsl(${(h+45)%360},50%,38%))`;
    const url=imgUrl(p.img);
    const showPh=()=>{img.hidden=true;ph.hidden=false;};
    const showImg=()=>{img.hidden=false;ph.hidden=true;};
    img.onload=showImg;img.onerror=showPh;
    if(!url){img.removeAttribute('src');showPh();return;}
    showPh();                                   // 読み込めるまでは頭文字の仮画像
    if(img.getAttribute('src')!==url)img.src=url;
    if(img.complete&&img.naturalWidth)showImg();
  },
  chips(el,p,m,full){
    const box=el.querySelector('.chips'),days=this.daysOf(m);
    if(!days){box.hidden=true;return;}
    box.hidden=false;
    const all=p.res||[];
    const done=full?all:all.slice(0,-1);        // 戦闘中は、この一番の結果をまだ見せない
    const n=Math.max(days,done.length+(full?0:1));
    let h='';
    for(let i=0;i<n;i++){
      const r=done[i];
      h+=r?`<span class="${r.w?'w':'l'}" data-s="${r.w?'W':'L'}">${r.w?'Win':'Lose'}</span>`:`<span${!full&&i===done.length?' class="now"':''}></span>`;
    }
    box.innerHTML=h;
  },
  setup(m,A,B){
    this.cur=m;
    $('stageBody').classList.remove('idle');
    this.el.gs.hidden=true;
    this.bg(m.place||S.basho.place);     // 練習戦は選んだ開催地、本場所は今大会の開催地
    this.head(m);this.aiai(m,false);
    const put=(el,s,p)=>{
      el.querySelector('.who').className='who'+(p.plate?' pl-'+p.plate:'');   // 装備中の名札
      const rk=el.querySelector('.rk');
      rk.textContent=m.practice?'(練習戦)':`(${rankLabel(p)})`;
      rk.style.setProperty('--dc',TOP_DIVS.includes(p.div)?'#ffc83d':(DIV_COLOR[p.div]||'#aaa'));
      el.querySelector('.nm').textContent=p.name;
      const nk=p.nick||{},np=el.querySelector('.np'),nq=el.querySelector('.nq');   // 2つ名(前・後)
      np.textContent=nk.pre||'';np.hidden=!nk.pre;nq.textContent=nk.post||'';nq.hidden=!nk.post;
      const mv=el.querySelector('.who .mv');   // 矢印: 得意場所=上向き / 苦手場所=下向き
      mv.outerHTML=s.pl==='fav'?'<span class="mv" title="得意場所">⤴</span>':s.pl==='bad'?'<span class="mv dn" title="苦手場所">⤵</span>':'<span class="mv"></span>';
      const tags=[];
      if(s.sup)tags.push('超絶好調!');
      if(s.pl==='fav')tags.push('得意場所');else if(s.pl==='bad')tags.push('苦手場所');
      const cd=el.querySelector('.cond');
      cd.textContent=tags.join(' ・ ');
      cd.dataset.c=s.sup?'sup':(s.pl||'');
      el.querySelector('.st').textContent=`体${fmt(p.hp)} 力${fmt(p.pw)} 守${fmt(p.gd)} IQ${p.iq}`;
      const tag=el.querySelector('.spt');
      const n=s.cmds.length;
      tag.hidden=!n;tag.textContent=n?`✦ 特殊能力(${n})`:'';
      el.querySelector('.vm').classList.toggle('off',!s.hasMeter);
      this.hp(el,s.hp,s.max);this.meter(el,0);
      el.classList.remove('win','lose','hit','cast');
      this.portrait(el,p,m);
      this.chips(el,p,m,false);
    };
    put(this.el.L,A,m.a);put(this.el.R,B,m.b);
    this.el.turn.textContent='開始';this.el.res.textContent='';this.el.feed.innerHTML='';
    // 次の取組の画像を先読みして、切り替え時のちらつきを減らす
    const Bs=S.basho,nx=!m.practice&&Bs.matches[Bs.mi];
    if(nx)for(const q of [nx.a,nx.b]){const u=imgUrl(q.img);if(u)(new Image()).src=u;}
  },
  hp(el,hp,max){
    const shown=Math.min(Math.max(0,hp),max);     // 一時的な体力増加は表示上は上限で止める
    const r=shown/max;
    const bar=el.querySelector('.bar i');
    bar.style.width=(r*100)+'%';
    bar.dataset.lv=r>.5?'hi':r>.2?'mid':'lo';
    el.querySelector('.hpt').textContent=`HP:${fmt(shown)}/${fmt(max)}`;
  },
  meter(el,v){
    if(v==null)return;
    const i=el.querySelector('.vm i');i.style.height=Math.min(100,v)+'%';
    i.dataset.full=v>=100?'1':'0';
  },
  log(txt,cls){
    const d=document.createElement('div');d.textContent=txt;if(cls)d.className=cls;
    this.el.feed.appendChild(d);
    while(this.el.feed.children.length>60)this.el.feed.removeChild(this.el.feed.firstChild);
    this.el.feed.scrollTop=this.el.feed.scrollHeight;
  },
  pop(el,txt,cls){
    const s=document.createElement('span');s.className='pop '+cls;s.textContent=txt;
    (el.querySelector('.portrait')||el).appendChild(s);
    setTimeout(()=>s.remove(),1100);
  },
  flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);},
  gameset(m,res){
    const part=(p)=>{
      const w=res.winner===p;
      const rec=(m.practice||m.playoff)?(w?'WIN':'LOSE'):`${p.w}勝${p.l}敗`;
      const bi=m.bountyInfo;   // 懸賞金の対象外の取組(練習戦・闘士以下など)では表示しない
      const bl=bi?`<div class="gsb" title="${esc(bi.tip)}">懸賞金 ${w?`獲得 <b>${fmt(m.bounty)}</b> pt`:'<span class="dim">なし</span>'}</div>`:'';
      return `<div class="gsn ${w?'w':'l'}"><div class="n">${esc(p.name)}</div><div class="r">${rec}</div>${bl}</div>`;
    };
    this.el.gs.innerHTML=part(m.a)+'<div class="gst">Game<br>Set!</div>'+part(m.b);
    this.el.gs.hidden=false;
  },
  /* 大将撃破の演出: 相手が大将で、その大将に勝ったとき(練習戦・高速モードは対象外) */
  victory(m,res){
    if(m.practice)return;
    if(res.loser.div!=='大将')return;
    const fx=res.winner.effect;
    if(!fx||!(res.winner.effects||[]).includes(fx)||!FX_VFX[fx])return;
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const host=$('duel');if(!host)return;
    host.querySelectorAll('.fxlayer').forEach(x=>x.remove());
    const layer=document.createElement('div');layer.className='fxlayer';
    layer.innerHTML=`<div class="fx-banner">大将撃破!</div>`;
    host.appendChild(layer);
    FX_VFX[fx](layer);
    setTimeout(()=>layer.remove(),3800);
  },
  finish(m,res){
    this.hp(this.el.L,res.A.hp,res.A.max);this.hp(this.el.R,res.B.hp,res.B.max);
    const W=res.win==='A'?this.el.L:this.el.R,Lo=res.win==='A'?this.el.R:this.el.L;
    W.classList.add('win');Lo.classList.add('lose');
    this.chips(this.el.L,m.a,m,true);this.chips(this.el.R,m.b,m,true);
    this.el.turn.textContent=`${res.turns}ターン`;
    this.el.res.textContent=`勝者 ${res.winner.name}`;
    this.aiai(m,true,res);
    this.gameset(m,res);
  }
};
/* ---- 大将撃破の演出(CSS・Canvas・SVGのみ。外部素材なし) ---- */
function fxFireworks(c){
  const ctx=c.getContext('2d');c.width=c.clientWidth;c.height=c.clientHeight;
  const cols=['#ffd166','#ef476f','#06d6a0','#118ab2','#ffffff','#ff9f1c'];
  let ps=[],bursts=0;const t0=performance.now();
  const burst=(x,y)=>{const col=cols[Math.random()*cols.length|0];
    for(let i=0;i<48;i++){const a=Math.PI*2*i/48,v=2+Math.random()*3;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col});}};
  const step=now=>{
    if(!c.isConnected)return;
    if(bursts<6&&now-t0>bursts*380){burst(c.width*(.15+Math.random()*.7),c.height*(.1+Math.random()*.45));bursts++;}
    ctx.clearRect(0,0,c.width,c.height);
    for(const q of ps){q.x+=q.vx;q.y+=q.vy;q.vy+=.05;q.life-=.012;ctx.globalAlpha=Math.max(q.life,0);ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,3,3);}
    ctx.globalAlpha=1;
    ps=ps.filter(q=>q.life>0);
    if(bursts<6||ps.length)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function fxBoltPath(x,y,yEnd,jit){
  let d=`M${x.toFixed(1)} ${y}`;
  for(let yy=y+6;yy<yEnd;yy+=6){x+=(Math.random()-.5)*jit;d+=` L${x.toFixed(1)} ${yy}`;}
  return d;
}
const FX_VFX={
  fireworks(layer){const c=document.createElement('canvas');c.className='fx-canvas';layer.appendChild(c);fxFireworks(c);},
  lightning(layer){
    let bolts='';
    for(let i=0;i<3;i++){bolts+=`<path class="fx-bolt" style="animation-delay:${i*.45}s" d="${fxBoltPath(20+Math.random()*60,0,100,14)}"/>`;}
    layer.insertAdjacentHTML('beforeend',`<div class="fx-flash"></div><svg class="fx-bolts" viewBox="0 0 100 100" preserveAspectRatio="none">${bolts}</svg>`);
  },
  sakura(layer){
    let h='';
    for(let i=0;i<46;i++){h+=`<i class="fx-petal" style="left:${(Math.random()*100).toFixed(1)}%;animation-delay:${(Math.random()*1.8).toFixed(2)}s;animation-duration:${(2.6+Math.random()*2).toFixed(2)}s;--sw:${(Math.random()*120-60).toFixed(0)}px;--rot:${(Math.random()*720-360).toFixed(0)}deg"></i>`;}
    layer.insertAdjacentHTML('beforeend',h);
  },
  zabuton(layer){
    let h='';
    for(let i=0;i<8;i++){h+=`<i class="fx-zab" style="--x:${(Math.random()*240-120).toFixed(0)}px;--y:${(-(140+Math.random()*160)).toFixed(0)}px;--r:${(Math.random()*720-360).toFixed(0)}deg;animation-delay:${(i*.12).toFixed(2)}s"></i>`;}
    layer.insertAdjacentHTML('beforeend',h);
  },
};
const DELAY={1:1000,2:650,3:400,4:230,5:110};
function evClass(e){
  if(e.kind==='trig')return 'trig';
  if(e.kind==='fx')return 'fx';
  if(e.kind==='sp')return 'spk';
  if(e.kind==='hp')return e.delta>0?'heal':'fx';
  return e.type||'';
}
async function showBattle(m,res,animate){
  stage.setup(m,res.A,res.B);
  const ini={A:res.A.max,B:res.B.max};
  if(!animate){
    stage.log(`${m.a.name} vs ${m.b.name}`,'dim');
    for(const e of res.ev.slice(-8))stage.log(e.text,evClass(e));
    stage.finish(m,res);return;
  }
  UI.skip=false;
  for(const e of res.ev){
    if(UI.skip||UI.stop)break;
    const side=e.s==='A'?stage.el.L:stage.el.R;
    const tgtEl=(e.tgt||(e.s==='A'?'B':'A'))==='A'?stage.el.L:stage.el.R;
    stage.el.turn.textContent=`${e.t}ターン`;
    stage.log(e.text,evClass(e));
    stage.hp(stage.el.L,e.hpA,ini.A);stage.hp(stage.el.R,e.hpB,ini.B);
    stage.meter(stage.el.L,e.mA);stage.meter(stage.el.R,e.mB);
    let wait=DELAY[UI.speed];
    if(e.kind==='trig'){stage.flash(side,'cast');snd.play('special');}
    else if(e.kind==='fx'){stage.pop(side,'✦','pf');wait*=.6;}
    else if(e.kind==='hp'){
      if(e.delta>0)stage.pop(tgtEl,'+'+fmt(e.delta),'pg');else{stage.pop(tgtEl,fmt(e.delta),'ph');stage.flash(tgtEl,'hit');snd.play('hit');}
    }
    else if(e.type==='miss'){stage.pop(tgtEl,'MISS','pm');snd.play('miss');}
    else{
      stage.pop(tgtEl,'-'+fmt(e.dmg),e.kind==='sp'?'ps':e.type==='crit'?'pc':'ph');
      if(e.kind==='sp')stage.pop(tgtEl,'Special!','pspec');
      else if(e.type==='crit')stage.pop(tgtEl,'Critical Hit!','pcrit');
      stage.flash(tgtEl,'hit');
      snd.play(e.type==='crit'?'crit':'hit');
    }
    await sleep(wait);
  }
  stage.finish(m,res);
  if(!UI.stop)snd.play('gameset');
  if(!UI.stop)stage.victory(m,res);
  if(!UI.skip&&!UI.stop)await sleep(Math.max(900,DELAY[UI.speed]*2));   // Game Set表示を読める時間
}

/* ---------- サウンド(BGM・効果音) ---------- */
/* BGMは「sound」フォルダ(HTMLと同じ場所)から読み込む。大会の開催月と同じ名前の曲を鳴らす */
const SND_DIR='sound/';
const BGM_FILES={1:'1月大会BGM.mp3',3:'3月大会BGM.mp3',5:'5月大会BGM.mp3',7:'7月大会BGM.mp3',9:'9月大会BGM.mp3',11:'11月大会BGM.mp3'};
/* 曲ごとの音量補正(曲の元の音量差を揃える。測定値: 1月-11.7 3月-10.3 5月-6.1 7月-10.9 9月-8.7 11月-17.8 LUFS) */
const BGM_GAIN={1:.50,3:.42,5:.26,7:.45,9:.35,11:1};
/* 効果音ごとの音量補正(元の音が小さいものは持ち上げ、大きいものは抑える) */
const SFX_GAIN={hit:1.6,crit:1.3,miss:1.5,special:.8,gameset:.8};
const SND_DEF={bgmVol:60,seVol:80};
const snd={
  ctx:null,bufs:{},last:{},loading:null,
  on(){return S.settings.soundOn!==false;},
  vol(k){const v=+S.settings[k];return (Number.isFinite(v)&&S.settings[k]!==''&&S.settings[k]!=null?Math.max(0,Math.min(100,v)):SND_DEF[k])/100;},
  async unlock(){            // ブラウザの仕様上、最初のクリック等のあとでないと音は出せない
    try{
      if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();}
      if(this.ctx.state==='suspended')await this.ctx.resume();
      if(!this.loading)this.loading=this.load();
    }catch(e){}
  },
  async load(){
    for(const [k,uri] of Object.entries(SFX_DATA)){
      try{
        const bin=atob(uri.split(',')[1]),u=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        this.bufs[k]=await this.ctx.decodeAudioData(u.buffer);
      }catch(e){}
    }
  },
  play(k){
    if(!this.on()||!this.ctx||!this.bufs[k]||this.ctx.state!=='running')return;
    const now=performance.now();if(now-(this.last[k]||0)<70)return;this.last[k]=now;   // 同じ音の連打を間引く
    const src=this.ctx.createBufferSource(),g=this.ctx.createGain();
    src.buffer=this.bufs[k];g.gain.value=this.vol('seVol')*(SFX_GAIN[k]||1);
    src.connect(g);g.connect(this.ctx.destination);src.start();
  }
};
const bgm={
  el:null,month:null,pending:false,
  vol(){return this.vol0()*(BGM_GAIN[this.month]||.5);},
  vol0(){return snd.vol('bgmVol');},
  apply(){                    // 音量・オン/オフの変更を再生中の曲へ反映
    if(!this.el)return;
    if(!snd.on()){this.el.pause();return;}
    clearInterval(this.el._f);this.el.volume=Math.min(1,this.vol());
  },
  sync(){                     // 今の大会に合った曲を鳴らす(ボタン操作の流れで呼ぶ)
    const B=S.basho;if(!snd.on()||!B)return;
    const m=tMonth(B.no);
    if(this.el&&this.month===m){if(this.el.paused)this.play(false);return;}
    this.switchTo(m);
  },
  switchTo(m){
    if(this.el)this.drop(this.el,600);
    const a=new Audio(SND_DIR+encodeURIComponent(BGM_FILES[m]));
    a.loop=true;a.preload='auto';a.volume=0;
    a.addEventListener('error',()=>{if(this.el===a)setSndStat(false,m);});
    this.el=a;this.month=m;this.play(true);
  },
  play(fadeIn){
    const a=this.el;if(!a)return;
    const go=()=>this.fadeTo(a,Math.min(1,this.vol()),fadeIn?900:250);
    const p=a.play();
    if(p&&p.then)p.then(go).catch(()=>{this.pending=true;});else go();
  },
  fadeTo(a,v,ms){
    clearInterval(a._f);const v0=a.volume,t0=performance.now();
    a._f=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,v0+(v-v0)*k));if(k>=1)clearInterval(a._f);},40);
  },
  drop(a,ms){                 // フェードアウトして破棄
    this.fadeTo(a,0,ms);
    setTimeout(()=>{clearInterval(a._f);a.pause();a.removeAttribute('src');a.load();},ms+80);
  },
  stop(ms){if(!this.el)return;const a=this.el;this.el=null;this.month=null;this.drop(a,ms||1200);}
};

/* ---------- 進行制御 ---------- */
function inScope(m){
  if(UI.scope==='all')return true;
  if(UI.scope==='watch'){
    if(UI.watch.size)return UI.watch.has(m.a.id)||UI.watch.has(m.b.id);
    return m.gi===0;
  }
  return m.gi<=1;               // top: 総合+闘士
}

  if(g){const t=S.basho.titles[g.key];toast(`${tName(S.basho.no)} ${g.label}:${pname(t.id)}(${t.w}勝${t.l}敗)`);}

/* 1番進める。戻り値: 'ok' | 'dayend' | 'bashoend' | 'done' */
async function playMatch(animate,quiet){
  const B=S.basho;
  bgm.sync();
  if(B.phase==='done'||B.phase==='submit')return 'done';
  if(B.phase==='playoff')return playPlayoff(animate,quiet);
  if(B.day===0||dayDone()){
    if(B.day>=maxDays()&&dayDone())return afterDays();
    beginDay();renderAll();
    if(!B.matches.length){            // その日に取組がない(リセット直後で上位階級が空など)
      if(B.day>=maxDays())return afterDays();
      return 'dayend';
    }
  }
  const m=B.matches[B.mi++];
  const res=simulate(m.a,m.b,B.place);
  if(UI.mode==='fast')B.fastUsed=true;   // 高速で進めた大会は場所収入なし
  applyResult(m,res);
  UI.last={m,res};
  if(!quiet)await showBattle(m,res,animate&&UI.mode==='anim');
  if(dayDone()&&B.day>=maxDays())return afterDays();
  return dayDone()?'dayend':'ok';
}
/* 日程終了。同点首位がいれば優勝決定戦へ、いなければそのまま大会終了 */
function afterDays(){
  const B=S.basho;
  playoffInit();
  if(!playoffPending()){finishBasho();return 'bashoend';}
  B.phase='playoff';
  L(`${tName(B.no)} 優勝決定戦: ${B.po.groups.map(G=>`${GROUPS[G.gi].label}(${G.first}名)`).join('、')}`);
  const w=[...UI.watch].filter(id=>B.po.groups.some(G=>G.cand.includes(id)));
  if(w.length)toast(`観戦リストの${w.map(id=>pname(id)).join('、')}が優勝決定戦に進出しました`);
  return 'dayend';
}
async function playPlayoff(animate,quiet){
  const B=S.basho,pp=playoffPending();
  if(!pp){finishBasho();return 'bashoend';}
  const {G,m}=pp;
  const res=simulate(m.a,m.b,B.place);
  if(UI.mode==='fast')B.fastUsed=true;
  setBounty(m,res);                      // GameSet 演出で懸賞金を出すため、先に決めておく
  UI.last={m,res};
  if(!quiet)await showBattle(m,res,animate&&UI.mode==='anim');
  playoffApply(G,m,res);                 // 演出が終わってから結果を確定(途中で止めても結果は確定する)
  if(!playoffPending()){finishBasho();return 'bashoend';}
  return 'ok';
}
/* 次に行われる取組(通常の取組でも決定戦でも) */
function nextMatch(){
  const B=S.basho;
  if(B.phase==='done'||B.phase==='submit')return null;
  if(B.phase==='playoff'){const pp=playoffPending();return pp?pp.m:null;}
  return (B.day===0||dayDone())?null:B.matches[B.mi];
}
/* アニメで見せる取組か。決定戦は、観戦リストの選手が出る取組なら対象範囲の設定に関わらず見せる */
function animTarget(m){
  if(m.playoff)return inScope(m)||UI.watch.has(m.a.id)||UI.watch.has(m.b.id);
  return inScope(m);
}
async function runUntil(kind){
  if(UI.busy)return;
  UI.busy=true;UI.stop=false;setBusy(true);
  try{
    let n=0;
    while(!UI.stop){
      const B=S.basho;
      if(B.phase==='done'){
        if(UI.autoNext&&kind==='auto'){await sleep(1500);if(UI.stop)break;goNextBasho();continue;}
        break;
      }
      if(B.phase==='submit'){await sbStart();renderAll();if(S.basho.phase==='done'&&kind==='auto')continue;break;}   // 送信待ち(再開した場合など)
      const m=nextMatch();
      const anim=UI.mode==='anim'&&!!m&&animTarget(m);
      const r=await playMatch(anim,!anim);
      if(r==='dayend'){
        renderAll();saveSoon();
        if(kind==='day')break;
        if(UI.mode==='anim')await sleep(250);
      }
      if(r==='bashoend'){
        if(S.basho.phase==='submit')await sbStart();        // 結果送信が全員成功してから番付編成
        renderAll();
        if(kind!=='auto'||S.basho.phase!=='done')break;
      }
      if(++n%40===0){renderLight();await sleep(0);}
    }
  }finally{
    if(UI.last&&UI.mode!=='anim'){showBattle(UI.last.m,UI.last.res,false);}
    UI.busy=false;setBusy(false);renderAll();saveSoon();
  }
}

function arrow(p){

    return p.div==='前相撲'&&p.prevPos==null&&p.pos!=null&&p.rec.length?'<span class="dim">新</span>':'<span class="dim">–</span>';

  return '<span class="dim">–</span>';
}

/* ---------- 総合優勝争い ----------
   4日目終了以降、総合優勝の対象(大将〜戦士)で勝ち数が最も多い人を表示する。
   6日目終了以降で首位の人数が少ないとき(RACE_CHASE_MAX人以下)は、首位と1勝差の人も表示する。 */
const RACE_FROM=4, RACE_CHASE_FROM=6, RACE_CHASE_MAX=3, RACE_SHOW_MAX=12;
function daysFinished(){   // 終了した日数(進行中の日は含めない)
  const B=S.basho;if(!B.day)return 0;
  if(['playoff','titled','done'].includes(B.phase))return maxDays();
  return B.day-(dayDone()?0:1);
}
function raceHTML(){
  const B=S.basho,df=daysFinished();
  if(df<RACE_FROM||(B.titles&&B.titles['総合']))return '';
  const part=S.people.filter(p=>GROUPS[0].divs.includes(p.div));
  if(!part.length)return '';
  const top=Math.max(...part.map(p=>p.w));
  const lead=part.filter(p=>p.w===top).sort(bzCmp);
  const chase=(df>=RACE_CHASE_FROM&&lead.length<=RACE_CHASE_MAX)?part.filter(p=>p.w===top-1).sort(bzCmp):null;
  const items=arr=>arr.length?`<ul>${arr.slice(0,RACE_SHOW_MAX).map(p=>`<li>${rowName(p)}<em>${rankLabel(p)} ${p.w}勝${p.l}敗</em></li>`).join('')}${arr.length>RACE_SHOW_MAX?`<li class="dim">…ほか${arr.length-RACE_SHOW_MAX}人</li>`:''}</ul>`:'<p class="dim">なし</p>';
  const prog=dayDone()?'':`(${B.day}日目の取組が進行中)`;
  return `<div class="race"><h3>総合優勝争い <small class="dim">${df}日目終了時点${prog}</small></h3>
    <div class="hd lead">首位 ${top}勝(${lead.length}人)</div>${items(lead)}
    ${chase?`<div class="hd">1勝差 ${top-1}勝(${chase.length}人)</div>${items(chase)}`:''}
    ${B.phase==='playoff'?'<small class="dim">首位が複数のため、優勝決定戦で決まります。</small>':''}</div>`;
}

/* ---------- ショップ(キャラごとに買い物) ----------
   代金は、そのキャラの所持金から支払う。
   - 名札(プレート): 買うと持ち物になる。装備中のものが対戦画面の名前欄の見た目になる
   - ドリンク: 買うと、その大会の間ずっと能力が×1.1倍(同じドリンクは1大会1本まで)。
     大会と大会の間に買うと、次の大会から効く */
const SHOP_PLATES=[
  {id:'wood',   name:'木目の札',  price:50000, desc:'素朴な木の名札'},
  {id:'silver', name:'白銀の札',  price:100000, desc:'磨き上げた銀色の名札'},
  {id:'ruby',   name:'紅蓮の札',  price:150000, desc:'燃えるような深紅の名札'},
  {id:'gold',   name:'黄金の札',  price:225000, desc:'金箔がきらめく名札'},
  {id:'rainbow',name:'虹色の札',  price:300000, desc:'虹色の光が流れる名札'},
  {id:'king',   name:'王者の札',  price:400000, desc:'黒と金の最高級の名札'},
];
const SHOP_DRINKS=[
  {id:'stamina',stat:'hp',name:'スタミナドリンク',price:5000,desc:'体力を強化'},
  {id:'power',  stat:'pw',name:'パワードリンク',  price:7500,desc:'パワーを強化'},
  {id:'guard',  stat:'gd',name:'ガードドリンク',  price:7500,desc:'ガードを強化'},
  {id:'energy', stat:'iq',name:'エナジードリンク',price:10000,desc:'IQを強化'},
];
/* 大将撃破の演出: 相手が大将で、その大将に勝ったときに再生する(勝者の番付は問わない)。装備は1種類 */
const SHOP_EFFECTS=[
  {id:'fireworks',name:'花火',    price:50000, desc:'夜空に大輪の花火が上がる'},
  {id:'lightning',name:'稲妻',    price:50000, desc:'閃光とともに稲妻が走る'},
  {id:'sakura',   name:'桜吹雪',  price:100000,desc:'桜の花びらが舞い散る'},
  {id:'zabuton',  name:'座布団',  price:100000,desc:'座布団が宙を舞う(横綱戦の演出)'},
];
function effectOf(id){return SHOP_EFFECTS.find(x=>x.id===id);}
const DRINK_MUL=1.1;
const STAT_LABEL={hp:'体力',pw:'パワー',gd:'ガード',iq:'IQ'};
function plateOf(id){return SHOP_PLATES.find(x=>x.id===id);}
function plateName(p){const x=plateOf(p.plate);return x?x.name:'なし';}
/* 能力の強化値: ドリンクの効果が及ぶ大会の間だけ強化する */
function boostedStat(p,k){
  const v=p[k];
  return (p.boost&&p.boost[k]===S.basho.no)?Math.round(v*DRINK_MUL):v;
}
/* ドリンクの効果が及ぶ大会番号: 大会と大会の間(終了後)なら次の大会、それ以外は今の大会 */
function drinkTargetNo(){const B=S.basho;return (B.phase==='done'||B.phase==='submit')?B.no+1:B.no;}
function shopBuyPlate(p,id){
  const x=plateOf(id);if(!x)return;
  if(!p.plates)p.plates=[];
  if(p.plates.includes(id)){toast('既に持っています');return;}
  if((p.money||0)<x.price){toast('所持金が足りません');return;}
  p.money-=x.price;p.plates.push(id);
  L(`ショップ: ${p.name} が「${x.name}」を購入(${fmt(x.price)}pt)`);
  saveSoon();renderShop();
}
function shopEquipPlate(p,id){p.plate=id||'';saveSoon();renderShop();}
function shopBuyEffect(p,id){
  const x=effectOf(id);if(!x)return;
  if(!p.effects)p.effects=[];
  if(p.effects.includes(id)){toast('既に持っています');return;}
  if((p.money||0)<x.price){toast('所持金が足りません');return;}
  p.money-=x.price;p.effects.push(id);
  L(`ショップ: ${p.name} が演出「${x.name}」を購入(${fmt(x.price)}pt)`);
  saveSoon();renderShop();
}
function shopEquipEffect(p,id){p.effect=id||'';saveSoon();renderShop();}
/* 2つ名: 前後それぞれ5文字まで。入力は表示前にエスケープする(記号や改行は取り除く) */
const NICK_PRICE=250000, NICK_MAX=5;
function nickClean(v){
  const t=String(v==null?'':v).replace(/[\u0000-\u001f\u007f]/g,'').trim();
  const arr=Array.from(t);
  if(arr.length>NICK_MAX){toast(`2つ名は${NICK_MAX}文字までです(超えた分は削除しました)`);}
  return arr.slice(0,NICK_MAX).join('');
}
function shopBuyNick(p){
  if(p.nick){toast('既に持っています');return;}
  if((p.money||0)<NICK_PRICE){toast('所持金が足りません');return;}
  p.money-=NICK_PRICE;p.nick={pre:'',post:''};
  L(`ショップ: ${p.name} が2つ名を購入(${fmt(NICK_PRICE)}pt)`);
  saveSoon();renderShop();
}
function shopSaveNick(p){
  const pre=nickClean($('nickPre')?$('nickPre').value:''),post=nickClean($('nickPost')?$('nickPost').value:'');
  p.nick={pre,post};
  saveSoon();renderShop();toast('2つ名を保存しました');
}
function nickText(p){const n=p.nick;if(!n)return 'なし';return [n.pre,n.post].filter(Boolean).length?`${n.pre||'…'} ${p.name} ${n.post||'…'}`:'(未設定)';}
function shopBuyDrink(p,id){
  const d=SHOP_DRINKS.find(x=>x.id===id);if(!d)return;
  const no=drinkTargetNo();
  if(!p.boost)p.boost={};
  if(p.boost[d.stat]===no){toast(`${d.name}は${tName(no)}で効果中です(1大会1本まで)`);return;}
  if((p.money||0)<d.price){toast('所持金が足りません');return;}
  p.money-=d.price;p.boost[d.stat]=no;
  L(`ショップ: ${p.name} が${d.name}を購入(${fmt(d.price)}pt、${tName(no)}で${STAT_LABEL[d.stat]}×${DRINK_MUL})`);
  saveSoon();renderShop();
}
function shopList(){
  const q=UI.shopQ||'';
  return sortRank(S.people.filter(p=>!q||nameKey(p.name).includes(nameKey(q)))).slice(0,300);
}
function nickHTML(p,money){
  if(!p.nick){
    return `<div class="shop-item"><div><b>2つ名</b> <small class="dim">名前の前後に、5文字ずつの言葉を付けられます</small>
      <small>${fmt(NICK_PRICE)} pt</small></div><button data-nbuy="1" ${money<NICK_PRICE?'disabled':''}>購入</button></div>`;
  }
  const n=p.nick;
  return `<div class="nick-edit">
    <label>前 <input id="nickPre" maxlength="12" value="${esc(n.pre)}" placeholder="例: 鋼鉄の"></label>
    <label>後 <input id="nickPost" maxlength="12" value="${esc(n.post)}" placeholder="例: 山脈"></label>
    <div class="nick-prev">表示例: <span class="who"><span class="np">${esc(n.pre)}</span><span class="nm">${esc(p.name)}</span><span class="nq">${esc(n.post)}</span></span></div>
    <button data-nsave="1">保存</button></div>`;
}
function shopBodyHTML(p){
  const no=drinkTargetNo(),money=p.money||0;
  const plates=SHOP_PLATES.map(x=>{
    const own=(p.plates||[]).includes(x.id),eq=p.plate===x.id;
    const btn=own
      ?(eq?'<button data-unequip="1">外す</button>':`<button data-equip="${x.id}">装備する</button>`)
      :`<button data-pbuy="${x.id}" ${money<x.price?'disabled':''}>購入</button>`;
    const st=own?(eq?' ・ 装備中':' ・ 所持'):'';
    return `<div class="shop-item"><div><span class="who pl-${x.id} shop-prev"><span class="nm">${esc(x.name)}</span></span>
      <small class="dim">${esc(x.desc)}</small><small>${fmt(x.price)} pt${st}</small></div>${btn}</div>`;
  }).join('');
  const drinks=SHOP_DRINKS.map(d=>{
    const on=!!(p.boost&&p.boost[d.stat]===no);
    const btn=on?'<button disabled>効果中</button>':`<button data-dbuy="${d.id}" ${money<d.price?'disabled':''}>購入</button>`;
    return `<div class="shop-item"><div><b>${esc(d.name)}</b> <small class="dim">${esc(d.desc)}(×${DRINK_MUL})</small>
      <small>${fmt(d.price)} pt</small></div>${btn}</div>`;
  }).join('');
  const fxs=SHOP_EFFECTS.map(x=>{
    const own=(p.effects||[]).includes(x.id),eq=p.effect===x.id;
    const btn=own
      ?(eq?'<button data-eunequip="1">外す</button>':`<button data-eequip="${x.id}">装備する</button>`)
      :`<button data-ebuy="${x.id}" ${money<x.price?'disabled':''}>購入</button>`;
    const st=own?(eq?' ・ 装備中':' ・ 所持'):'';
    return `<div class="shop-item"><div><b>${esc(x.name)}</b> <small class="dim">${esc(x.desc)}</small>
      <small>${fmt(x.price)} pt${st}</small></div>${btn}</div>`;
  }).join('');
  return `<h3>${esc(p.name)} <small class="dim">${esc(rankLabel(p))}</small></h3>
    <p>所持金: <b>${fmt(money)} pt</b> ・ 名札: <b>${esc(plateName(p))}</b></p>
    <h4>名札(プレート)</h4>${plates}
    <h4>ドリンク(${esc(tName(no))}の間、能力×${DRINK_MUL})</h4>${drinks}
    <h4>大将撃破の演出(装備は1種類)</h4>${fxs}

}
function renderShop(){
  const el=$('tab_shop');
  if(!el.dataset.built){
    el.dataset.built='1';
    el.innerHTML=`<p class="dim">キャラクターごとに買い物ができます。代金は、そのキャラの所持金から支払います。</p>
      <div class="row"><input id="shopQ" type="search" placeholder="キャラ名で検索(一部でOK)" autocomplete="off"></div>
      <div class="row"><select id="shopSel" size="8" style="width:100%"></select></div>
      <div id="shopBody"></div>`;
    const qi=$('shopQ');
    const updList=()=>{UI.shopQ=qi.value;$('shopSel').innerHTML=shopOpts();};
    qi.addEventListener('input',e=>{if(!e.isComposing)updList();});
    qi.addEventListener('compositionend',updList);
    $('shopSel').onchange=e=>{UI.shopId=+e.target.value;renderShop();};
    $('shopBody').onclick=e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      const p=UI.shopId&&S.byId.get(UI.shopId);if(!p)return;
      if(b.dataset.pbuy)shopBuyPlate(p,b.dataset.pbuy);
      else if(b.dataset.equip)shopEquipPlate(p,b.dataset.equip);
      else if(b.dataset.unequip)shopEquipPlate(p,'');
      else if(b.dataset.dbuy)shopBuyDrink(p,b.dataset.dbuy);
      else if(b.dataset.ebuy)shopBuyEffect(p,b.dataset.ebuy);
      else if(b.dataset.eequip)shopEquipEffect(p,b.dataset.eequip);
      else if(b.dataset.eunequip)shopEquipEffect(p,'');
      else if(b.dataset.nbuy)shopBuyNick(p);
      else if(b.dataset.nsave)shopSaveNick(p);
    };
  }
  $('shopSel').innerHTML=shopOpts();
  const cur=UI.shopId&&S.byId.get(UI.shopId);
  $('shopBody').innerHTML=cur?shopBodyHTML(cur):'<p class="dim">キャラクターを選んでください</p>';
}
function shopOpts(){

function renderSearch(){

  <li>番付は「内部スコア=番付−評価点」方式。大将・副将・先鋒・旗頭は独立した昇進ルール。</li>
  <li>特殊能力コマンド(能力調整・攻撃・システム介入・条件分岐)を実装。メーターは前作(Scratch)と同じ式で増加(コミュ力・能力評価値・体力差で変わる)。</li>
  <li>「HPに応じる」(発動条件2)は、HPが指定%以下のとき毎ターン判定する形で実装(仕様書では未実装扱い)。</li>
  <li>種別9(例外コード)は呼び出し口のみ用意(中身は未定義)。</li>
  <li>取組編成は「取組編成ロジック仕様表 v1.1」準拠。番付適合度と成績適合度を日数別ウェイトで合成し、大将・副将同士の解禁/固定ルールと再戦ペナルティを加えて全体マッチングで決定。取組表の行をクリックすると編成理由を確認できます。</li>
  </ul>`;
  bindUpdateInfo();
  $('oSpecial').onchange=e=>{S.settings.special=e.target.checked;saveSoon();};
  $('oGate').onchange=e=>{S.settings.gateHp=e.target.checked;saveSoon();};
  $('oSound').onchange=e=>setSound(e.target.checked);
  $('oBgmVol').oninput=e=>{S.settings.bgmVol=+e.target.value;$('oBgmVolV').textContent=e.target.value;bgm.apply();saveSoon();};
  $('oSeVol').oninput=e=>{S.settings.seVol=+e.target.value;$('oSeVolV').textContent=e.target.value;saveSoon();};
  $('oSeVol').onchange=()=>{snd.unlock().then(()=>snd.play('hit'));};   // 音量を変えたら試し打ち
  probeBgm();
  $('oSuper').onchange=e=>{S.settings.superOn=e.target.checked;saveSoon();};
  $('oSuperP').onchange=e=>{let v=+e.target.value;if(!(v>=0))v=SUPER_PROB_DEF;v=Math.min(100,v);e.target.value=v;S.settings.superProb=v;saveSoon();};
  [['oT6','mmT6'],['oF5','mmF5'],['oF6','mmF6']].forEach(([id,k])=>{$(id).onchange=e=>{let v=Math.round(+e.target.value);if(!(v>=0))v=MM.DEF[k];v=Math.min(100,v);e.target.value=v;S.settings[k]=v;saveSoon();};});
  $('oScope').onchange=e=>{UI.scope=e.target.value;saveSoon();};
  $('oAuto').onchange=e=>{UI.autoNext=e.target.checked;saveSoon();};
  $('oSave').onclick=()=>{saveNow();toast('保存しました');};
  $('oExport').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(serialize())],{type:'application/json'}));
    a.download=`se_battle2_save_basho${S.basho.no}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  $('oImport').onchange=async e=>{
    try{restore(JSON.parse(await e.target.files[0].text()));saveNow();renderAll();toast('読み込みました');}
    catch(err){toast('読み込みに失敗しました');}
  };
  $('oClearCareer').onclick=()=>{
    if(UI.busy){toast('進行中です。停止してから成績をクリアしてください');return;}
    if(!confirm('全員の累計勝敗(大会ごとの記録)と優勝歴をすべて0に戻します。\n番付の位置・大会の進行・キャラクターデータは変わりません。\nよろしいですか?'))return;
    clearCareer();saveNow();renderAll();
    toast('成績をクリアしました(累計勝敗・優勝回数を0に戻しました)');
  };
}
/* 練習戦タブ用: 指定したキャラの合い口(得意な相手・苦手な相手)と、2人の組み合わせの成績 */
function aiaiPanelHTML(a,b){
  if(!a&&!b)return '';
  const pair=(a&&b&&a!==b)?aiaiGet(a,b):null;
  let h='';
  if(pair){
    const d=pair[0]-pair[1],lab=aiaiLabel(Math.max(...pair),Math.min(...pair));
    h+=`<div class="pair"><b>この組み合わせの合い口</b>:${rowName(a)} ${pair[0]}勝 - ${pair[1]}勝 ${rowName(b)}`
      +`(${d>0?`${esc(a.name)}が${lab}`:d<0?`${esc(b.name)}が${lab}`:'互角'})</div>`;
  }
  const one=p=>{
    const list=aiaiOf(p);
    if(!list.length)return `<h4>${esc(p.name)}の合い口</h4><div class="dim">合い口データはまだありません(戦士以上同士の本場所の対戦だけが記録されます)。</div>`;
    const grp=(cls,title,arr)=>arr.length?`<div class="gl ${cls}"><b>${title}</b><span class="chips">${arr.map(x=>`<span class="chip">${rowName(x.o)} <em>${x.w}勝${x.l}敗</em></span>`).join('')}</span></div>`:'';
    const by=f=>list.filter(f).sort((x,y)=>Math.abs(y.w-y.l)-Math.abs(x.w-x.l)||(y.w+y.l)-(x.w+x.l)||x.o.id-y.o.id);
    return `<h4>${esc(p.name)}の合い口</h4>`
      +grp('g','得意な相手',by(x=>x.w>x.l))+grp('b','苦手な相手',by(x=>x.w<x.l))+grp('','互角',by(x=>x.w===x.l));
  };
  if(a)h+=one(a);
  if(b&&b!==a)h+=one(b);
  return h;
}
function renderDuel(){
  const el=$('tab_duel');
  const names=S.people.map(p=>`<option value="${esc(p.name)}">`).join('');
  const D=UI.duel||(UI.duel={a:'',b:'',place:0,spOnly:true});
  el.innerHTML=`<p class="dim">順位や成績に影響しない練習対戦です。特殊能力の動きを確かめるのに使えます。キャラを指定すると、本場所で戦士以上同士が戦った合い口(得意な相手・苦手な相手)も見られます。</p>
  <div class="row"><label>左 <input type="search" id="dA" list="dl" placeholder="名前" value="${esc(D.a)}" autocomplete="off"></label>
  <label>右 <input type="search" id="dB" list="dl" placeholder="名前" value="${esc(D.b)}" autocomplete="off"></label></div>
  <datalist id="dl">${names}</datalist>
  <div class="row"><label>開催地 <select id="dP">${PLACES.map((x,i)=>`<option value="${i}"${D.place===i?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <label><input type="checkbox" id="dS" ${D.spOnly?'checked':''}> ランダムは特殊能力持ちを優先</label></div>
  <div class="row"><button class="primary" id="dGo">▶ 対戦する</button><button id="dRnd">🎲 ランダムに選ぶ</button><button id="dRep">もう一度</button></div>
  <div id="dMsg" class="dim"></div>
  <div class="aiaiP" id="dAiai"></div>
  <h3>特殊能力を持つキャラ(${S.people.filter(p=>p.cmd).length}人)</h3>
  <div class="chips">${S.people.filter(p=>p.cmd).map(p=>`<span class="chip">${rowName(p)}</span>`).join('')}</div>`;
  const find=n=>{const k=nameKey(n);return k?S.people.find(p=>nameKey(p.name)===k):null;};
  const sync=()=>{D.a=$('dA').value;D.b=$('dB').value;D.place=+$('dP').value;D.spOnly=$('dS').checked;};
  const showAiai=()=>{sync();$('dAiai').innerHTML=aiaiPanelHTML(find(D.a),find(D.b));};
  $('dA').oninput=$('dB').oninput=showAiai;
  $('dRnd').onclick=()=>{
    sync();
    const pool=S.people.filter(p=>!p.pre);
    const sp=pool.filter(p=>p.cmd);
    const pick=l=>l[Math.floor(Math.random()*l.length)];
    const a=D.spOnly&&sp.length?pick(sp):pick(pool);
    let b;do{b=pick(pool);}while(b===a);
    D.a=a.name;D.b=b.name;$('dA').value=D.a;$('dB').value=D.b;showAiai();
  };
  const go=async()=>{
    sync();
    const a=find(D.a),b=find(D.b);
    if(!a||!b||a===b){$('dMsg').textContent='左右に別々のキャラを、一覧から選んで入力してください。';return;}
    if(UI.busy)return;
    UI.busy=true;UI.stop=false;setBusy(true);$('dMsg').textContent='';
    try{
      const res=simulate(a,b,PLACES[D.place],true);   // 練習戦は超絶好調なし
      const m={a,b,practice:true,place:PLACES[D.place]};
      window.scrollTo({top:0,behavior:'smooth'});
      await showBattle(m,res,true);
      $('dMsg').textContent=`${res.winner.name} の勝ち(${res.turns}ターン${res.sp?`・特殊能力の発動 ${res.sp}回`:''})`;
    }finally{UI.busy=false;setBusy(false);}
  };
  $('dGo').onclick=go;$('dRep').onclick=go;
  showAiai();
}
const TABS={duel:renderDuel,matches:renderMatches,banzuke:renderBanzuke,standings:renderStandings,titles:renderTitles,search:renderSearch,shop:renderShop,log:renderLog,settings:renderSettings};
function renderTab(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='tab_'+UI.tab);
  TABS[UI.tab]();
}
function renderAll(){renderStatus();renderTab();syncModeUI();}
function renderLight(){renderStatus();}
function syncModeUI(){
  document.querySelectorAll('[name=mode]').forEach(r=>r.checked=(r.value===UI.mode));
  $('speed').value=UI.speed;$('speedBox').style.opacity=UI.mode==='anim'?1:.4;
}

/* ---------- プロフィール ---------- */
const COMMAND_TOOL_URL='https://shirotetsu-shiojima.github.io/command/';   // 特殊能力コマンド生成ツール
function cmdHTML(p){
  if(!p.cmd)return `<p><a class="btn" href="${COMMAND_TOOL_URL}" target="_blank" rel="noopener" title="特殊能力コマンド生成ツールを新しいタブで開きます">✦ 特殊能力を設定</a></p>`;
  const {cmds,errs}=parseCommands(p.cmd);
  const items=cmds.map(c=>{
    const t=c.a[0];
    const cls=t===4?'gate':t===2?'atk':t===3?'sys':'stat';
    return `<li class="${cls}">${esc(describeCmd(c.a))}</li>`;
  }).join('');
  const hasM=cmds.some(c=>c.a[8]===0);
  const mr=meterBaseRate(p);
  const mline=hasM?`<p class="dim" style="margin:4px 0 0">メーター増加の目安: 互角の相手なら1ターン約${mr>=100?'100':mr.toFixed(0)}%(約${Math.max(1,Math.ceil(100/Math.min(100,mr)))}ターンで満タン)。相手が格上・自分が劣勢だと速くなります</p>`:'';
  return `<div class="sp"><b>✦ 特殊能力</b><ul>${items}</ul>${mline}${errs.length?`<p class="dim">解釈できないコマンドが${errs.length}件あります</p>`:''}
  <details><summary class="dim">コマンドコード</summary><code>${esc(p.cmd)}</code></details></div>`;
}
function openProfile(id){
  const p=S.byId.get(id);if(!p)return;
  const bar=(v,max)=>`<span class="sb"><i style="width:${Math.min(100,v/max*100)}%"></i></span>`;
  const rec=p.rec.slice(-12).reverse().map(r=>`<tr><td>${tName(r.b)}</td><td>${esc(r.div)}</td><td>${r.w}勝${r.l}敗</td></tr>`).join('');
  const tl=p.titles.map(t=>`${tName(t.b)} ${t.key}`).slice(-12).join('、');
  const tw=p.rec.reduce((s,r)=>s+r.w,0),tl2=p.rec.reduce((s,r)=>s+r.l,0);
  $('dlgBody').innerHTML=`<h2>${esc(p.name)}</h2>
  ${p.img?`<img class="pfimg" src="${esc(imgUrl(p.img))}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
  <p><b>${rankLabel(p)}</b> ${p.pre?'(前相撲)':''}${p.tsuna?' ・綱取りの大会':''}</p>
  <div class="stats">
   <div><small>体力</small><b>${fmt(p.hp)}</b>${bar(p.hp,25000)}</div>
   <div><small>パワー</small><b>${fmt(p.pw)}</b>${bar(p.pw,26000)}</div>
   <div><small>ガード</small><b>${fmt(p.gd)}</b>${bar(p.gd,27000)}</div>
   <div><small>IQ</small><b>${p.iq}</b>${bar(p.iq,190)}</div>
   <div><small>能力評価値</small><b>${fmt(p.ab)}</b>${bar(p.ab,40000)}</div>
   <div><small>場所収入(大会ごと)</small><b>${fmt(p.inc)}</b></div><div><small>所持金</small><b>${fmt(p.money||0)} pt</b></div>
  </div>
  <p>2つ名: <b>${esc(nickText(p))}</b></p>
  <p>名札: <b>${esc(plateName(p))}</b> ・ 所持金: <b>${fmt(p.money||0)} pt</b></p>
  <p>得意場所:<b>${esc(placeLabel(p.fav)||'なし')}</b> / 苦手場所:<b>${esc(placeLabel(p.bad)||'なし')}</b>${isSuper(p)?' / <b style="color:#d98a00">⚡ 今大会は超絶好調</b>':''}</p>
  ${cmdHTML(p)}
  <p>通算(記録分): ${tw}勝${tl2}敗 ${tl?`<br>優勝歴: ${esc(tl)}`:''}</p>
  ${rec?`<div class="tbl small"><table><thead><tr><th>大会</th><th>番付</th><th>成績</th></tr></thead><tbody>${rec}</tbody></table></div>`:'<p class="dim">まだ大会の記録がありません</p>'}
  <div class="row"><button id="pWatch">${UI.watch.has(id)?'観戦リストから外す':'観戦リストに追加'}</button><button id="pClose">閉じる</button></div>`;
  $('pClose').onclick=()=>$('dlg').close();
  $('pWatch').onclick=()=>{UI.watch.has(id)?UI.watch.delete(id):UI.watch.add(id);saveSoon();openProfile(id);if(UI.tab==='search')renderSearch();};
  if(!$('dlg').open)$('dlg').showModal();
}

/* ---------- 起動 ---------- */
function boot(){
  stage.init();
  if(!loadSaved())initPeople(dbRows());
  stage.idle();
  initSound();
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;renderTab();});
  document.addEventListener('click',e=>{const a=e.target.closest('a.nl');if(a)openProfile(+a.dataset.id);});
  document.addEventListener('click',e=>{if(e.target.closest('a.nl'))return;const r=e.target.closest('.m[data-mi]');if(r)openMatchInfo(+r.dataset.mi);});
  document.querySelectorAll('[name=mode]').forEach(r=>r.onchange=()=>{UI.mode=r.value;syncModeUI();saveSoon();});
  $('speed').oninput=e=>{UI.speed=+e.target.value;saveSoon();};
  $('bOne').onclick=()=>{
    if(UI.busy)return;UI.busy=true;UI.stop=false;setBusy(true);
    playMatch(true).then(async()=>{if(S.basho.phase==='submit')await sbStart();}).finally(()=>{UI.busy=false;setBusy(false);renderAll();saveSoon();});
  };
  $('bDay').onclick=()=>runUntil('day');
  $('bBasho').onclick=()=>runUntil('basho');
  $('bAuto').onclick=()=>{if(!UI.busy)runUntil('auto');};
  $('bStop').onclick=()=>{UI.stop=true;UI.skip=true;};
  $('bSkip').onclick=()=>{UI.skip=true;};
  $('bNext').onclick=goNextBasho;
  $('sbBox').onclick=e=>{if(e.target.closest('#sbRetry'))sbResumeUI();};
  $('bUpd').onclick=checkUpdate;
  $('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close();});
  renderAll();setBusy(false);
  sbCatchUp();
}
window.addEventListener('DOMContentLoaded',boot);
