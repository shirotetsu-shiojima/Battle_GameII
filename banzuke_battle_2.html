<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>番付バトルシミュレーター2</title>
<style>
:root{
  --bg:#f3eee3;--panel:#fffdf8;--ink:#201c17;--dim:#7a7064;--line:#ddd3c1;--accent:#b3261e;--accent2:#8a6a1f;
  --good:#1d7a46;--bad:#a33;--bar:#2f9e5a;--barmid:#d9a21b;--barlow:#c4372b;--chip:#efe7d6;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","BIZ UDMincho",serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#181613;--panel:#222019;--ink:#efe9dc;--dim:#a39a89;--line:#3a352b;--accent:#ee6b60;--accent2:#d8b25a;
  --good:#58c487;--bad:#ee7b7b;--chip:#2f2b22;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--mincho);margin:0}
h3{font-size:15px;margin:18px 0 8px;border-left:4px solid var(--accent);padding-left:8px}
button,select,input{font:inherit;color:inherit}
button,.btn{padding:7px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;display:inline-block}
button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
select,input[type=search]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
input[type=search]{width:100%}
.dim{color:var(--dim)} small{font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px 40px}

/* ヘッダ */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--accent);padding:8px 0;
  padding-top:max(8px,env(safe-area-inset-top,0px))}
.top .in{max-width:1180px;margin:0 auto;padding:0 12px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px;letter-spacing:.08em}
.brand small{color:var(--dim)}
.status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.status div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:0}
.status small{display:block;color:var(--dim)}
.status b{display:block;font-family:var(--mincho);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl .grow{flex:1}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.modes label{padding:6px 10px;cursor:pointer}
.modes input{display:none}
.modes label:has(input:checked){background:var(--accent);color:#fff}
#speedBox{display:inline-flex;align-items:center;gap:4px}
#speed{width:80px}

/* バトルステージ */
.stage{margin:14px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stagehead h2{font-size:16px}
.arena{display:grid;grid-template-columns:1fr 90px 1fr;gap:10px;align-items:start}
.side{position:relative;border:2px solid var(--line);border-radius:10px;padding:8px 10px;transition:border-color .2s,background .2s}
.side .rk{font-size:12px;color:var(--accent2);font-weight:700}
.side .nm{font-family:var(--mincho);font-size:19px;font-weight:700;overflow-wrap:anywhere}
.side .cond{font-size:12px;margin:2px 0 4px;color:var(--dim)}
.side .cond[data-c="1.2"]{color:var(--accent);font-weight:700}
.side .cond[data-c="0.8"]{color:var(--bad)}
.side .st{font-size:11px;color:var(--dim);margin-top:4px}
.bar{height:14px;background:var(--chip);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:var(--bar);transition:width .25s}
.bar i[data-lv=mid]{background:var(--barmid)} .bar i[data-lv=lo]{background:var(--barlow)}
.hpt{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.side.win{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--panel))}
.side.lose{opacity:.65}
.side.hit{animation:shake .28s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mid{text-align:center;padding-top:14px}
.mid .vs{font-family:var(--mincho);font-size:24px;color:var(--accent);font-weight:700}
.mid .turn{font-size:12px;color:var(--dim)} .mid .res{font-size:12px;font-weight:700;margin-top:4px}
.pop{position:absolute;right:10px;top:6px;font-weight:800;font-size:18px;pointer-events:none;animation:up .9s forwards}
.pop.ph{color:var(--accent)} .pop.pc{color:#e08a00;font-size:24px} .pop.pm{color:var(--dim);font-size:14px}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
.feed{margin-top:10px;height:116px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
.feed .crit{color:#e08a00;font-weight:700} .feed .miss{color:var(--dim)}
.idle .arena{opacity:.35}

/* タブ */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-top:6px}
.tabs button{border-radius:8px 8px 0 0;border-bottom:none;background:transparent}
.tabs button.on{background:var(--panel);border-color:var(--accent);color:var(--accent);font-weight:700}
.pane{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:12px;min-height:240px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

.mlist{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.m{display:grid;grid-template-columns:62px 1fr 22px 20px 22px 1fr 62px;gap:4px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--line);font-size:13px}
.mlist>.m:last-child{border-bottom:none}
.m .r{font-size:11px;color:var(--dim)} .m .r:last-child{text-align:right}
.m a.nl:last-of-type{text-align:right}
.m i{font-style:normal;color:var(--dim);font-size:11px;text-align:center}
.m b{text-align:center}.m b.w{color:var(--good)}.m b.x{color:var(--dim)}
.m.cur{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:2px solid var(--accent);outline-offset:-2px}
/* 検索タブ用: 行が1要素のとき */
#tab_search .m{grid-template-columns:70px 1fr auto}
a.nl{color:inherit;cursor:pointer;text-decoration:underline dotted var(--dim);text-underline-offset:3px;overflow-wrap:anywhere}
a.nl:hover{color:var(--accent)}

.tbl{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tbl.small{max-height:220px;margin:8px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td:nth-child(3){white-space:normal}
th{position:sticky;top:0;background:var(--chip);font-size:12px}
.up{color:var(--good)} .dn{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.card small{display:block} .card b{font-family:var(--mincho);font-size:16px;display:block}
.chg{margin:0;padding-left:20px;font-size:13px}
ol.rk{margin:0;padding-left:22px}
.logbox{max-height:520px;overflow:auto;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.logbox div{padding:1px 0;border-bottom:1px dashed var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:99px;padding:3px 6px 3px 10px;display:inline-flex;gap:4px;align-items:center}
.chip button{padding:0 6px;border-radius:99px;border:none;background:transparent}
.set{margin:10px 0}.set.btns{display:flex;gap:8px;flex-wrap:wrap}
.memo{font-size:13px;color:var(--dim);padding-left:20px}

dialog{border:1px solid var(--accent);border-radius:14px;background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 24px);padding:16px}
dialog::backdrop{background:#0008}
dialog h2{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stats small{display:block;color:var(--dim)} .stats b{font-size:16px}
.sb{display:block;height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:3px}
.sb i{display:block;height:100%;background:var(--accent2)}
code{font-size:11px;word-break:break-all}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:720px){
  .status{grid-template-columns:repeat(3,minmax(0,1fr))}
  .arena{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;order:3;padding:0;display:flex;gap:10px;justify-content:center;align-items:center}
  .m{grid-template-columns:1fr 20px 18px 20px 1fr}.m .r{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><h1>番付バトルシミュレーター2</h1><small>観戦型・後継作</small></div>
  <div class="status">
    <div><small>場所</small><b id="stNo">-</b></div>
    <div><small>開催地</small><b id="stPlace">-</b></div>
    <div><small>日程</small><b id="stDay">-</b></div>
    <div><small>残り取組</small><b id="stLeft">-</b></div>
    <div><small>総合優勝</small><b id="stChamp">-</b></div>
  </div>
  <div class="ctl">
    <button class="primary" id="bOne">▶ 次の1番</button>
    <button id="bDay">今日を進める</button>
    <button id="bBasho">場所を最後まで</button>
    <button id="bAuto">▶ 自動で進める</button>
    <button class="danger" id="bStop" hidden>■ 停止</button>
    <button class="primary" id="bNext" hidden>次の場所へ ▶</button>
    <span class="grow"></span>
    <div class="modes" title="戦闘の見せ方">
      <label><input type="radio" name="mode" value="fast">高速</label>
      <label><input type="radio" name="mode" value="anim">観戦</label>
    </div>
    <span id="speedBox">速さ<input type="range" id="speed" min="1" max="5" step="1" value="3"></span>
  </div>
</div></header>

<main class="wrap">
  <section class="stage" id="stageBody">
    <div class="stagehead"><h2>本日の一番</h2><span><small class="dim" id="stNext"></small> <button id="bSkip">スキップ</button></span></div>
    <div class="arena">
      <div class="side" id="sideL"><div class="rk">-</div><div class="nm">-</div><div class="cond"></div><div class="bar"><i></i></div><div class="hpt"></div><div class="st"></div></div>
      <div class="mid"><div class="vs">VS</div><div class="turn" id="turn"></div><div class="res" id="res"></div></div>
      <div class="side" id="sideR"><div class="rk">-</div><div class="nm">-</div><div class="cond"></div><div class="bar"><i></i></div><div class="hpt"></div><div class="st"></div></div>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <nav class="tabs">
    <button data-tab="matches">取組</button>
    <button data-tab="banzuke">番付</button>
    <button data-tab="standings">成績</button>
    <button data-tab="titles">優勝</button>
    <button data-tab="search">検索・観戦</button>
    <button data-tab="log">ログ</button>
    <button data-tab="settings">設定</button>
  </nav>
  <div class="pane" id="tab_matches"></div>
  <div class="pane" id="tab_banzuke" hidden></div>
  <div class="pane" id="tab_standings" hidden></div>
  <div class="pane" id="tab_titles" hidden></div>
  <div class="pane" id="tab_search" hidden></div>
  <div class="pane" id="tab_log" hidden></div>
  <div class="pane" id="tab_settings" hidden></div>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast"></div>

/* ---------- データ初期化 ---------- */
function initPeople(){
  S.people=DATA.map(r=>({id:r[0],name:r[1],hp:r[2],pw:r[3],gd:r[4],iq:r[5],ab:r[6],rk:r[7],
    fav:norm(r[8]),bad:norm(r[9]),inc:r[10],cmd:r[11]||'',pre:!!r[12],
    div:'',slot:0,pk:0,w:0,l:0,met:[],rec:[],titles:[],tsuna:false,demoted:false}));
  S.byId=new Map(S.people.map(p=>[p.id,p]));
  const rest=[];
  for(const p of S.people){
    if(p.pre){p.div='前相撲';p.slot=9999;}
    else if(p.rk>=1&&p.rk<=4){p.div=TOP_NAMES[p.rk];p.slot=p.rk;}
    else rest.push(p);
  }
  rest.sort((a,b)=>a.rk-b.rk||b.ab-a.ab||a.id-b.id);
  layout(rest);
  S.people.forEach(p=>p.pk=p.slot);
  S.history=[];S.logs=[];
  startBasho(1);
}

/* 並び順(良い順)から番付枠へ流し込む。1枚につき2人(東西) */
function layout(list){
  let idx=0;
  for(const [name,start,cap] of LAYOUT){
    for(let k=0;k<cap&&idx<list.length;k++,idx++){
      const p=list[idx];p.div=name;p.slot=start+Math.floor(k/2);p.pre=false;p.demoted=false;
    }
  }
  const rest=list.slice(idx),n=rest.length;
  let third=Math.min(THIRD_COUNT,n);
  if((n-third)%2)third++;
  third=Math.min(third,n);
  S.thirdStart=LOW_START+Math.floor((n-third)/2);
  rest.forEach((p,k)=>{
    p.slot=LOW_START+Math.floor(k/2);
    p.div=k<n-third?'二等兵':'三等兵';
    p.pre=false;p.demoted=false;
  });
  S.maxSlot=LOW_START+Math.ceil(n/2);
}
function slotBase(div){
  if(div==='二等兵')return LOW_START-1;
  if(div==='三等兵')return S.thirdStart-1;
  const e=LAYOUT.find(x=>x[0]===div);return e?e[1]-1:0;
}
function rankLabel(p){
  if(p.div==='前相撲')return '前相撲';
  if(TOP_DIVS.includes(p.div))return p.div;
  return p.div+(p.slot-slotBase(p.div));
}
function groupIndex(p){return GROUPS.findIndex(g=>g.divs.includes(p.div));}
function rankSortKey(p){return p.div==='前相撲'?99999:p.slot;}

/* ---------- 戦闘 ---------- */
function condRoll(){
  const r=1+Math.floor(Math.random()*100);
  return r>90?1.2:r>65?1.1:r>35?1:r>10?0.9:0.8;
}
function mkSide(p,place){
  const base=condRoll();
  let c=base;
  if(place.key===p.fav)c*=1.2;
  else if(place.key===p.bad)c*=0.8;
  if(S.settings.superMode&&SUPER_IDS.has(p.id))c+=50;
  return {p,base,c,hp:p.hp,max:p.hp};
}
function guardRate(p,c){const g=p.gd*c;return ((g-70)/(g+70))/2;}
function strike(att,def){
  const iqc=att.p.iq*att.c;
  const crit=(iqc-70)/iqc;                       // クリティカル率
  const ratio=((iqc-70)/(iqc+200))*100;
  const miss=ratio===0?Infinity:1/ratio;         // ミス率
  let dmg=0,type='miss';
  if(Math.random()<crit){
    if(Math.random()>miss){dmg=att.p.pw*att.c/4;type='crit';}
  }else{
    if(Math.random()>miss){dmg=att.p.pw*att.c/6;type='hit';}
  }
  // 防御は「攻撃側のIQ由来の確率」で有効(原作どおり)
  let d=0;
  if(Math.random()<crit)d=guardRate(def.p,def.c);
  if(d<0)d=0;
  if(1-d<0)d=0.99;
  const fin=dmg*(1-d);
  def.hp-=fin;
  if(Math.ceil(def.hp)<1)def.hp=0;
  return {type,raw:dmg,dmg:fin,guard:d};
}
function simulate(a,b,place){
  const A=mkSide(a,place),B=mkSide(b,place);
  const ev=[];let turn=0;
  while(A.hp>0&&B.hp>0&&turn<400){
    turn++;
    const ra=strike(A,B);
    ev.push({t:turn,s:'A',...ra,hpA:A.hp,hpB:B.hp});
    if(B.hp<=0)break;
    const rb=strike(B,A);
    ev.push({t:turn,s:'B',...rb,hpA:A.hp,hpB:B.hp});
  }
  let win;
  if(B.hp<=0&&A.hp>0)win='A';else if(A.hp<=0&&B.hp>0)win='B';
  else win=(A.hp/A.max>=B.hp/B.max)?'A':'B';
  return {A,B,ev,turns:turn,win,winner:win==='A'?a:b,loser:win==='A'?b:a};
}

/* ---------- 場所の進行 ---------- */
function startBasho(no){
  S.people.forEach(p=>{p.w=0;p.l=0;p.met=[];});
  S.basho={no,place:PLACES[(no-1)%PLACES.length],day:0,matches:[],mi:0,phase:'ready',
    titles:null,playoffs:[],byes:[]};
}
function maxDays(){return 7;}
function met(a,b){return a.met.includes(b.id);}
function ordKey(p){return rankSortKey(p)*10000-p.ab;}   // 小さいほど上位
function sortRank(list){return list.slice().sort((a,b)=>ordKey(a)-ordKey(b)||a.id-b.id);}

function foldPairs(list,rot){
  let arr=list.slice(),parts=[arr];
  if(arr.length>19){const k=Math.floor(arr.length/3);parts=[arr.slice(0,k),arr.slice(k,2*k),arr.slice(2*k)];}
  for(let i=0;i<parts.length-1;i++)if(parts[i].length%2)parts[i+1].unshift(parts[i].pop());
  const pairs=[];
  for(let part of parts){
    if(part.length>1&&rot){const r=rot%part.length;part=part.slice(r).concat(part.slice(0,r));}
    const rest=part.slice();
    while(rest.length>1){
      const x=rest.shift();let k=rest.length-1;
      while(k>=0&&met(x,rest[k]))k--;
      if(k<0)k=rest.length-1;
      pairs.push([x,rest.splice(k,1)[0]]);
    }
  }
  return pairs;
}
function swissPairs(list){
  const rest=list.slice().sort((a,b)=>b.w-a.w||a.l-b.l||ordKey(a)-ordKey(b));
  const pairs=[];
  while(rest.length>1){
    const x=rest.shift();let k=0;
    while(k<rest.length&&met(x,rest[k]))k++;
    if(k>=rest.length)k=0;
    pairs.push([x,rest.splice(k,1)[0]]);
  }
  return pairs;
}
function planDay(day){
  const B=S.basho;B.byes=[];
  const pools=[];
  GROUPS.forEach((g,gi)=>{
    if(day>g.days)return;
    const list=sortRank(S.people.filter(p=>g.divs.includes(p.div)));
    pools.push({g,gi,list});
  });
  // 奇数なら下の階級から1人借りて偶数にする。最後が奇数なら1人は休み
  for(let i=0;i<pools.length;i++){
    if(pools[i].list.length%2){
      if(i+1<pools.length&&pools[i+1].list.length){pools[i].list.push(pools[i+1].list.shift());}
      else{B.byes.push(pools[i].list.pop());}
    }
  }
  const out=[];
  for(const {g,gi,list} of pools){
    const swiss=g.days===7?day>=6:(day===2||day===5);
    const pairs=swiss?swissPairs(list):foldPairs(list,day-1);
    pairs.forEach(([a,b])=>{
      if(ordKey(b)<ordKey(a))[a,b]=[b,a];
      out.push({a,b,gi,w:null,swiss});
    });
  }
  // 下位の取組から順に。最後が最上位(結び)
  out.sort((x,y)=>y.gi-x.gi||ordKey(y.a)-ordKey(x.a));
  return out;
}
function beginDay(){
  const B=S.basho;
  B.day++;B.mi=0;B.phase='days';
  B.matches=planDay(B.day);
  L(`第${B.no}場所 ${B.day}日目:${B.matches.length}番の取組を編成`);
}
function applyResult(m,res){
  m.w=res.winner===m.a?'A':'B';
  m.turns=res.turns;m.condA=res.A.c;m.condB=res.B.c;
  m.hpA=res.A.hp;m.hpB=res.B.hp;
  const win=res.winner,lose=res.loser;
  win.w++;lose.l++;
  win.met.push(lose.id);lose.met.push(win.id);
}
function playNextFast(){
  const B=S.basho;if(B.mi>=B.matches.length)return null;
  const m=B.matches[B.mi++];
  const res=simulate(m.a,m.b,B.place);applyResult(m,res);return {m,res};
}
function dayDone(){return S.basho.mi>=S.basho.matches.length;}
function bashoDaysDone(){return S.basho.day>=maxDays()&&dayDone();}

/* ---------- 優勝・決定戦 ---------- */
function decideTitles(){
  const B=S.basho;B.titles={};B.playoffs=[];
  for(const g of GROUPS){
    const mem=S.people.filter(p=>g.divs.includes(p.div));
    if(!mem.length)continue;
    const mx=Math.max(...mem.map(p=>p.w));
    let cand=mem.filter(p=>p.w===mx);
    const first=cand.slice();
    let round=1;
    while(cand.length>1){
      cand=cand.slice().sort(()=>Math.random()-.5);
      const nxt=[];
      for(let i=0;i<cand.length;i+=2){
        if(i+1>=cand.length){nxt.push(cand[i]);continue;}
        const r=simulate(cand[i],cand[i+1],B.place);
        B.playoffs.push({key:g.key,round,a:cand[i].id,b:cand[i+1].id,win:r.winner.id});
        nxt.push(r.winner);
      }
      cand=nxt;round++;
    }
    const ch=cand[0];
    B.titles[g.key]={id:ch.id,w:ch.w,l:ch.l,playoff:first.length>1,n:first.length};
    ch.titles.push({b:B.no,key:g.key});
    L(`第${B.no}場所 ${g.label}:${ch.name}(${ch.w}勝${ch.l}敗)${first.length>1?' 決定戦':''}`);
  }
  B.phase='titled';
}

/* ---------- 番付編成 ---------- */
function promote(p,div){p.div=div;p.slot=TOP_DIVS.indexOf(div)+1;p.pre=false;p.demoted=false;}
function rebalance(){
  const B=S.basho;
  S.people.forEach(p=>{p.rec.push({b:B.no,div:rankLabel(p),w:p.w,l:p.l});if(p.rec.length>40)p.rec.shift();p.pk=rankSortKey(p);});
  const changes=[];
  const tops=[],movers=[];
  for(const p of S.people){
    const prevW=p.rec.length>1?p.rec[p.rec.length-2].w:0;
    const sum3=p.rec.slice(-3).reduce((s,r)=>s+r.w,0);
    const before=rankLabel(p);
    if(p.div==='大将'){tops.push(p);continue;}
    if(p.div==='副将'){
      if(p.w===7){
        if(p.tsuna){promote(p,'大将');p.tsuna=false;changes.push(`${p.name}:副将→大将(2場所連続7勝)`);}
        else p.tsuna=true;
        tops.push(p);
      }else{
        p.tsuna=false;
        if(p.w>3||prevW>3)tops.push(p);
        else{promote(p,'先鋒');tops.push(p);changes.push(`${p.name}:副将→先鋒`);}
      }
      continue;
    }
    if(p.div==='先鋒'){
      if(sum3>14){promote(p,'副将');changes.push(`${p.name}:先鋒→副将`);tops.push(p);}
      else if(p.w>3)tops.push(p);
      else if(p.w>2){promote(p,'旗頭');tops.push(p);changes.push(`${p.name}:先鋒→旗頭`);}
      else{p.demoted=true;p.div='戦士';p.slot=5;movers.push(p);changes.push(`${p.name}:先鋒→降下`);}
      continue;
    }
    if(p.div==='旗頭'){
      if(p.w>3){promote(p,'先鋒');tops.push(p);changes.push(`${p.name}:旗頭→先鋒`);}
      else if(p.w>2)tops.push(p);
      else{p.demoted=true;p.div='戦士';p.slot=5;movers.push(p);}
      continue;
    }
    movers.push(p);
  }
  // 一般力士の内部スコア
  const lowN=S.people.filter(p=>p.slot>=LOW_START&&p.div!=='前相撲').length;
  const cut=Math.floor(lowN/2)+121;
  const scored=[];
  for(const p of movers){
    let s;
    const wi=(arr)=>arr[Math.min(p.w,arr.length-1)];
    if(p.div==='前相撲'||p.pre)s=(S.maxSlot||300)-wi(PRE);
    else{
      const sl=p.demoted?5:p.slot;
      if(sl<37){s=sl-wi(HYO);if(s<4)s=4;}
      else if(sl<67)s=sl-wi(MID);
      else if(sl<cut)s=sl-wi(LOW);
      else s=sl-wi(LOWEST);
    }
    if(s<=4&&p.div!=='前相撲'&&!p.pre){promote(p,'旗頭');tops.push(p);changes.push(`${p.name}:${p.w}勝${p.l}敗で旗頭へ`);continue;}
    p._s=s;scored.push(p);
  }
  scored.sort((a,b)=>a._s-b._s||b.w-a.w||a.slot-b.slot||b.ab-a.ab||a.id-b.id);
  layout(scored);
  scored.forEach(p=>{delete p._s;});
  B.changes=changes;
  const hi=changes.filter(c=>/大将|副将|先鋒/.test(c));
  hi.slice(0,12).forEach(c=>L('番付 '+c));
  B.phase='done';
}
function nextBasho(){
  S.history.push({no:S.basho.no,place:S.basho.place.name,titles:S.basho.titles,playoffs:S.basho.playoffs});
  if(S.history.length>200)S.history.shift();
  startBasho(S.basho.no+1);
}
function finishBashoLogic(){ // 日程終了後: 優勝決定→番付編成
  decideTitles();rebalance();
}

/* ---------- 戦闘ステージ ---------- */
const stage={
  init(){this.el={L:$('sideL'),R:$('sideR'),feed:$('feed'),turn:$('turn'),res:$('res')};},
  idle(){
    $('stageBody').classList.add('idle');
    this.el.feed.innerHTML='<div class="dim">取組を始めるとここに戦闘が表示されます。</div>';
  },
  setup(m,A,B){
    $('stageBody').classList.remove('idle');
    const put=(el,s,p)=>{
      el.querySelector('.rk').textContent=rankLabel(p);
      el.querySelector('.nm').textContent=p.name;
      const cl=COND_LABEL[s.base]||'普通';
      const ps=s.c/s.base;
      const place=ps>1.001?' ・得意場所':ps<0.999?' ・苦手場所':'';
      const sp=s.c>10?' ・超絶好調!':'';
      el.querySelector('.cond').textContent=cl+place+sp;
      el.querySelector('.cond').dataset.c=s.base;
      el.querySelector('.st').textContent=`体${fmt(p.hp)} 力${fmt(p.pw)} 守${fmt(p.gd)} IQ${p.iq}`;
      this.hp(el,s.hp,s.max);
      el.classList.remove('win','lose','hit');
    };
    put(this.el.L,A,m.a);put(this.el.R,B,m.b);
    this.el.turn.textContent='開始';this.el.res.textContent='';this.el.feed.innerHTML='';
  },
  hp(el,hp,max){
    const r=Math.max(0,hp/max);
    const bar=el.querySelector('.bar i');
    bar.style.width=(r*100)+'%';
    bar.dataset.lv=r>.5?'hi':r>.2?'mid':'lo';
    el.querySelector('.hpt').textContent=`${fmt(Math.max(0,hp))} / ${fmt(max)}`;
  },
  log(txt,cls){
    const d=document.createElement('div');d.textContent=txt;if(cls)d.className=cls;
    this.el.feed.appendChild(d);
    while(this.el.feed.children.length>40)this.el.feed.removeChild(this.el.feed.firstChild);
    this.el.feed.scrollTop=this.el.feed.scrollHeight;
  },
  pop(el,txt,cls){
    const s=document.createElement('span');s.className='pop '+cls;s.textContent=txt;el.appendChild(s);
    setTimeout(()=>s.remove(),900);
  },
  finish(m,res){
    this.hp(this.el.L,res.A.hp,res.A.max);this.hp(this.el.R,res.B.hp,res.B.max);
    const W=res.win==='A'?this.el.L:this.el.R,Lo=res.win==='A'?this.el.R:this.el.L;
    W.classList.add('win');Lo.classList.add('lose');
    this.el.turn.textContent=`${res.turns}ターン`;
    this.el.res.textContent=`勝者 ${res.winner.name}`;
  }
};
const DELAY={1:1000,2:650,3:400,4:230,5:110};
async function showBattle(m,res,animate){
  stage.setup(m,res.A,res.B);
  const ini={A:res.A.max,B:res.B.max};
  if(!animate){
    stage.log(`${m.a.name} vs ${m.b.name}`,'dim');
    for(const e of res.ev.slice(-6))stage.log(evText(e,res),e.type);
    stage.finish(m,res);return;
  }
  UI.skip=false;
  for(const e of res.ev){
    if(UI.skip||UI.stop)break;
    const atk=e.s==='A'?res.A.p:res.B.p;
    const defEl=e.s==='A'?stage.el.R:stage.el.L;
    stage.el.turn.textContent=`${e.t}ターン`;
    stage.log(evText(e,res),e.type);
    stage.hp(stage.el.L,e.hpA,ini.A);stage.hp(stage.el.R,e.hpB,ini.B);
    if(e.type==='miss')stage.pop(defEl,'MISS','pm');
    else{
      stage.pop(defEl,'-'+fmt(e.dmg),e.type==='crit'?'pc':'ph');
      defEl.classList.remove('hit');void defEl.offsetWidth;defEl.classList.add('hit');
    }
    await sleep(DELAY[UI.speed]);
  }
  stage.finish(m,res);
  if(!UI.skip&&!UI.stop)await sleep(Math.max(250,DELAY[UI.speed]));
}
function evText(e,res){
  const who=e.s==='A'?res.A.p.name:res.B.p.name;
  if(e.type==='miss')return `${who}の攻撃は外れた`;
  const g=e.guard>0?`(防御${Math.round(e.guard*100)}%軽減)`:'';
  return `${who}の${e.type==='crit'?'会心の一撃! ':'攻撃 '}${fmt(e.dmg)}ダメージ${g}`;
}

/* ---------- 進行制御 ---------- */
function inScope(m){
  if(UI.scope==='all')return true;
  if(UI.scope==='watch'){
    if(UI.watch.size)return UI.watch.has(m.a.id)||UI.watch.has(m.b.id);
    return m.gi===0;
  }
  return m.gi<=1;               // top: 総合+闘士
}
function finishBasho(){
  finishBashoLogic();
  const t=S.basho.titles['総合'];
  toast(`第${S.basho.no}場所 総合優勝:${S.byId.get(t.id).name}(${t.w}勝${t.l}敗)`);
  UI.tab=(UI.tab==='matches')?'titles':UI.tab;
  saveSoon();
}
/* 1番進める。戻り値: 'ok' | 'dayend' | 'bashoend' | 'done' */
async function playMatch(animate,quiet){
  const B=S.basho;
  if(B.phase==='done')return 'done';
  if(B.day===0||dayDone()){
    if(B.day>=maxDays()&&dayDone()){finishBasho();return 'bashoend';}
    beginDay();renderAll();
  }
  const m=B.matches[B.mi++];
  const res=simulate(m.a,m.b,B.place);
  applyResult(m,res);
  UI.last={m,res};
  if(!quiet)await showBattle(m,res,animate&&UI.mode==='anim');
  if(dayDone()&&B.day>=maxDays()){finishBasho();return 'bashoend';}
  return dayDone()?'dayend':'ok';
}
async function runUntil(kind){
  if(UI.busy)return;
  UI.busy=true;UI.stop=false;setBusy(true);
  try{
    let n=0;
    while(!UI.stop){
      const B=S.basho;
      if(B.phase==='done'){
        if(UI.autoNext&&kind==='auto'){await sleep(1500);if(UI.stop)break;nextBasho();stage.idle();renderAll();continue;}
        break;
      }
      const m=(B.day===0||dayDone())?null:B.matches[B.mi];
      const anim=UI.mode==='anim'&&!!m&&inScope(m);
      const r=await playMatch(anim,!anim);
      if(r==='dayend'){
        renderAll();saveSoon();
        if(kind==='day')break;
        if(UI.mode==='anim')await sleep(250);
      }
      if(r==='bashoend'){renderAll();if(kind!=='auto')break;}
      if(++n%40===0){renderLight();await sleep(0);}
    }
  }finally{
    if(UI.last&&UI.mode!=='anim'){showBattle(UI.last.m,UI.last.res,false);}
    UI.busy=false;setBusy(false);renderAll();saveSoon();
  }
}

  const el=$('tab_standings');
  const g=GROUPS.find(x=>x.key===UI.sFilter)||GROUPS[0];
  const list=S.people.filter(p=>g.divs.includes(p.div)).sort((a,b)=>b.w-a.w||a.l-b.l||ordKey(a)-ordKey(b));
  el.innerHTML=`<div class="row"><label>階級 <select id="sFilter">${GROUPS.map(x=>`<option value="${x.key}"${x.key===g.key?' selected':''}>${x.key}</option>`).join('')}</select></label></div>
  <div class="tbl"><table><thead><tr><th>順位</th><th>番付</th><th>名前</th><th>勝</th><th>敗</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${i+1}</td><td>${rankLabel(p)}</td><td>${rowName(p)}</td><td>${p.w}</td><td>${p.l}</td></tr>`).join('')}</tbody></table></div>`;
  $('sFilter').onchange=e=>{UI.sFilter=e.target.value;renderStandings();};
}
function renderTitles(){
  const el=$('tab_titles');const B=S.basho;
  const cards=GROUPS.map(g=>{
    const t=B.titles&&B.titles[g.key];
    return `<div class="card"><small>${g.label}</small><b>${t?rowName(S.byId.get(t.id)):'-'}</b><small class="dim">${t?`${t.w}勝${t.l}敗${t.playoff?`(${t.n}名で決定戦)`:''}`:''}</small></div>`;
  }).join('');
  const ranking=S.people.map(p=>({p,n:p.titles.filter(t=>t.key==='総合').length,all:p.titles.length})).filter(x=>x.all).sort((a,b)=>b.n-a.n||b.all-a.all).slice(0,12);
  const hist=S.history.slice(-30).reverse().map(h=>{
    const t=h.titles&&h.titles['総合'];
    return `<tr><td>第${h.no}場所</td><td>${esc(h.place)}</td><td>${t?rowName(S.byId.get(t.id)):'-'}</td><td>${t?`${t.w}-${t.l}`:''}</td><td>${h.titles&&h.titles['闘士']?rowName(S.byId.get(h.titles['闘士'].id)):''}</td></tr>`;
  }).join('');
  const ch=(B.changes||[]).filter(c=>/大将|副将|先鋒|旗頭/.test(c)).slice(0,20);
  el.innerHTML=`<h3>${B.titles?`第${B.no}場所の結果`:'今場所の優勝(終了後に確定)'}</h3><div class="cards">${cards}</div>
  ${B.playoffs&&B.playoffs.length?`<p class="dim">優勝決定戦 ${B.playoffs.length}番:${B.playoffs.slice(0,8).map(x=>`${esc(S.byId.get(x.a).name)}×${esc(S.byId.get(x.b).name)}→${esc(S.byId.get(x.win).name)}`).join(' / ')}${B.playoffs.length>8?' …':''}</p>`:''}
  ${ch.length?`<h3>上位番付の変動</h3><ul class="chg">${ch.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
  <h3>総合優勝 回数ランキング</h3>${ranking.length?`<ol class="rk">${ranking.map(x=>`<li>${rowName(x.p)} <b>${x.n}回</b> <small class="dim">(全部門 ${x.all}回)</small></li>`).join('')}</ol>`:'<p class="dim">まだ優勝者はいません。</p>'}
  <h3>歴代の総合優勝</h3><div class="tbl"><table><thead><tr><th>場所</th><th>開催地</th><th>総合優勝</th><th>成績</th><th>闘士優勝</th></tr></thead><tbody>${hist||'<tr><td colspan="5" class="dim">まだありません</td></tr>'}</tbody></table></div>`;
}
function renderSearch(){
  const el=$('tab_search');
  const q=(UI.q||'').replace(/\s/g,'');
  let res=[];
  if(q)res=S.people.filter(p=>p.name.replace(/\s/g,'').includes(q)).slice(0,60);
  el.innerHTML=`<div class="row"><input id="q" type="search" placeholder="名前で検索(一部でOK)" value="${esc(UI.q||'')}" autocomplete="off"></div>
  <div class="mlist">${res.map(p=>`<div class="m"><span class="r">${rankLabel(p)}</span>${rowName(p)}<span class="dim">${p.cmd?' ✦特殊能力':''}</span></div>`).join('')||(q?'<p class="dim">見つかりません</p>':'<p class="dim">キャラクターを検索して、詳細や観戦登録ができます。</p>')}</div>
  <h3>観戦リスト</h3>${UI.watch.size?`<div class="chips">${[...UI.watch].map(id=>`<span class="chip">${rowName(S.byId.get(id))}<button data-rm="${id}">×</button></span>`).join('')}</div>`:'<p class="dim">空です。登録した選手の取組は、観戦モードでアニメ表示されます。</p>'}`;
  const qi=$('q');
  qi.oninput=()=>{UI.q=qi.value;const pos=qi.selectionStart;renderSearch();const n=$('q');n.focus();n.setSelectionRange(pos,pos);};
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{UI.watch.delete(+b.dataset.rm);renderSearch();saveSoon();});
}
function renderLog(){
  $('tab_log').innerHTML=`<div class="logbox">${S.logs.slice().reverse().map(l=>`<div>${esc(l)}</div>`).join('')||'<span class="dim">ログはまだありません</span>'}</div>`;
}
function renderSettings(){
  $('tab_settings').innerHTML=`
  <div class="set"><label><input type="checkbox" id="oSuper" ${S.settings.superMode?'checked':''}> 超絶好調リスト(7名)の「調子+50」を有効にする <small class="dim">原作の仕様。有効にすると該当者は事実上無敵になります</small></label></div>
  <div class="set"><label>アニメ観戦の対象
    <select id="oScope"><option value="top"${UI.scope==='top'?' selected':''}>総合+闘士の取組</option><option value="watch"${UI.scope==='watch'?' selected':''}>観戦リスト(空なら総合のみ)</option><option value="all"${UI.scope==='all'?' selected':''}>全ての取組(とても長い)</option></select></label></div>
  <div class="set"><label><input type="checkbox" id="oAuto" ${UI.autoNext?'checked':''}> 場所が終わったら自動で次の場所へ進む(「自動で進める」使用時)</label></div>
  <div class="set btns"><button id="oSave">いま保存</button><button id="oExport">ファイルに書き出す</button><label class="btn">読み込む<input type="file" id="oImport" accept=".json" hidden></label><button id="oReset" class="danger">最初からやり直す</button></div>
  <p class="dim">進行状況は、このブラウザに自動保存されます。</p>
  <h3>この版の仕様メモ</h3><ul class="memo">
  <li>戦闘式は TurboWarp 版の「対戦処理」を移植(調子5段階、得意/苦手場所補正、IQによる会心・ミス、ガード軽減)。</li>
  <li>番付は「内部スコア=番付−評価点」方式。大将・副将・先鋒・旗頭は独立した昇進ルール。</li>
  <li>特殊能力コマンド・必殺ゲージは<b>データのみ保持</b>(未実装)。</li>
  </ul>`;
  $('oSuper').onchange=e=>{S.settings.superMode=e.target.checked;saveSoon();};
  $('oScope').onchange=e=>{UI.scope=e.target.value;saveSoon();};
  $('oAuto').onchange=e=>{UI.autoNext=e.target.checked;saveSoon();};
  $('oSave').onclick=()=>{saveNow();toast('保存しました');};
  $('oExport').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(serialize())],{type:'application/json'}));
    a.download=`banzuke_save_basho${S.basho.no}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  $('oImport').onchange=async e=>{
    try{restore(JSON.parse(await e.target.files[0].text()));saveNow();renderAll();toast('読み込みました');}
    catch(err){toast('読み込みに失敗しました');}
  };
  $('oReset').onclick=()=>{
    if(!confirm('進行状況をすべて消して最初からやり直します。よろしいですか?'))return;
    UI.stop=true;try{localStorage.removeItem(SAVE_KEY);}catch(e){}
    initPeople();stage.idle();renderAll();toast('初期状態に戻しました');
  };
}
const TABS={matches:renderMatches,banzuke:renderBanzuke,standings:renderStandings,titles:renderTitles,search:renderSearch,log:renderLog,settings:renderSettings};
function renderTab(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='tab_'+UI.tab);
  TABS[UI.tab]();
}
function renderAll(){renderStatus();renderTab();syncModeUI();}
function renderLight(){renderStatus();}
function syncModeUI(){
  document.querySelectorAll('[name=mode]').forEach(r=>r.checked=(r.value===UI.mode));
  $('speed').value=UI.speed;$('speedBox').style.opacity=UI.mode==='anim'?1:.4;
}

/* ---------- プロフィール ---------- */
function openProfile(id){
  const p=S.byId.get(id);if(!p)return;
  const bar=(v,max)=>`<span class="sb"><i style="width:${Math.min(100,v/max*100)}%"></i></span>`;
  const rec=p.rec.slice(-12).reverse().map(r=>`<tr><td>第${r.b}場所</td><td>${esc(r.div)}</td><td>${r.w}勝${r.l}敗</td></tr>`).join('');
  const tl=p.titles.map(t=>`第${t.b}場所 ${t.key}`).slice(-12).join('、');
  const tw=p.rec.reduce((s,r)=>s+r.w,0),tl2=p.rec.reduce((s,r)=>s+r.l,0);
  $('dlgBody').innerHTML=`<h2>${esc(p.name)}</h2>
  <p><b>${rankLabel(p)}</b> ${p.pre?'(前相撲)':''}${p.tsuna?' ・綱取りの場所':''}</p>
  <div class="stats">
   <div><small>体力</small><b>${fmt(p.hp)}</b>${bar(p.hp,25000)}</div>
   <div><small>パワー</small><b>${fmt(p.pw)}</b>${bar(p.pw,26000)}</div>
   <div><small>ガード</small><b>${fmt(p.gd)}</b>${bar(p.gd,27000)}</div>
   <div><small>IQ</small><b>${p.iq}</b>${bar(p.iq,190)}</div>
   <div><small>能力評価値</small><b>${fmt(p.ab)}</b>${bar(p.ab,40000)}</div>
   <div><small>場所収入</small><b>${fmt(p.inc)}</b></div>
  </div>
  <p>得意場所:<b>${esc(p.fav||'なし')}</b> / 苦手場所:<b>${esc(p.bad||'なし')}</b></p>
  ${p.cmd?`<p class="dim">✦ 特殊能力コマンドあり(未実装): <code>${esc(p.cmd)}</code></p>`:''}
  <p>通算(記録分): ${tw}勝${tl2}敗 ${tl?`<br>優勝歴: ${esc(tl)}`:''}</p>
  ${rec?`<div class="tbl small"><table><thead><tr><th>場所</th><th>番付</th><th>成績</th></tr></thead><tbody>${rec}</tbody></table></div>`:'<p class="dim">まだ場所の記録がありません</p>'}
  <div class="row"><button id="pWatch">${UI.watch.has(id)?'観戦リストから外す':'観戦リストに追加'}</button><button id="pClose">閉じる</button></div>`;
  $('pClose').onclick=()=>$('dlg').close();
  $('pWatch').onclick=()=>{UI.watch.has(id)?UI.watch.delete(id):UI.watch.add(id);saveSoon();openProfile(id);if(UI.tab==='search')renderSearch();};
  if(!$('dlg').open)$('dlg').showModal();
}

/* ---------- 起動 ---------- */
function boot(){
  stage.init();
  if(!loadSaved())initPeople();
  stage.idle();
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;renderTab();});
  document.addEventListener('click',e=>{const a=e.target.closest('a.nl');if(a)openProfile(+a.dataset.id);});
  document.querySelectorAll('[name=mode]').forEach(r=>r.onchange=()=>{UI.mode=r.value;syncModeUI();saveSoon();});
  $('speed').oninput=e=>{UI.speed=+e.target.value;saveSoon();};
  $('bOne').onclick=()=>{
    if(UI.busy)return;UI.busy=true;UI.stop=false;setBusy(true);
    playMatch(true).finally(()=>{UI.busy=false;setBusy(false);renderAll();saveSoon();});
  };
  $('bDay').onclick=()=>runUntil('day');
  $('bBasho').onclick=()=>runUntil('basho');
  $('bAuto').onclick=()=>{if(!UI.busy)runUntil('auto');};
  $('bStop').onclick=()=>{UI.stop=true;UI.skip=true;};
  $('bSkip').onclick=()=>{UI.skip=true;};
  $('bNext').onclick=()=>{nextBasho();stage.idle();renderAll();saveSoon();};
  $('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close();});
  renderAll();setBusy(false);
}
window.addEventListener('DOMContentLoaded',boot);

</script>
</body>
</html>
